/* Заголовок просроченной секции на тёмном поле тонул: --danger рассчитан на бумагу. */
.tk-lab{color:rgba(255,255,255,.7)!important;}
.tk-lab.bad{color:#ff7a5e!important;}
/* «План месяца» на «Задачах»: внешность целиком взята у .cz-note (плотное стекло, яркая кромка),
   здесь только поведение кнопки и раскладка трёх строк. Новых цветов и размеров не вводим. */
.mp{display:block;width:100%;margin:0 0 12px;padding:14px 16px;border-radius:20px;cursor:pointer;
  text-align:left;font-family:var(--font-body);}
.mp .mp-top{display:flex;align-items:center;gap:10px;}
.mp .cz-cap{flex:1;min-width:0;}
.mp .mp-per{font-family:var(--font-display);font-weight:700;font-size:12px;white-space:nowrap;
  font-variant-numeric:tabular-nums;color:rgba(255,255,255,.72)!important;}
.mp .chv{display:flex;flex:0 0 auto;opacity:.5;}
/* Два числа плана рядом. Шрифт и размер — те же, что у денег на «Росте»: план должен читаться
   как результат, к которому идут, а не как подпись под задачами. */
.mp .mp-grid{display:flex;gap:12px;margin-top:12px;}
.mp .mp-k{flex:1 1 0;min-width:0;display:block;}
.mp .mp-k .n{display:block;font-family:var(--font-display);font-weight:700;font-size:32px;
  line-height:1.05;font-variant-numeric:tabular-nums;color:var(--lime)!important;}
.mp .mp-k .l{display:block;margin-top:4px;font-size:11.5px;line-height:1.3;font-weight:600;
  color:#fff!important;}
.mp .mp-k .s{display:block;margin-top:2px;font-size:11px;line-height:1.3;
  color:rgba(255,255,255,.62)!important;}
.mp .mp-note{display:block;margin-top:10px;font-size:11.5px;line-height:1.45;
  color:rgba(255,255,255,.72)!important;}
.tk-sum{background:rgba(0,0,0,.5)!important;border:1px solid rgba(255,255,255,.16)!important;
  border-top-color:rgba(255,255,255,.3)!important;color:#fff!important;
  backdrop-filter:blur(30px) saturate(180%)!important;-webkit-backdrop-filter:blur(30px) saturate(180%)!important;}
.tk-sum *{color:#fff!important;}
.tk-sum .s3{background:var(--lime)!important;color:var(--lime-ink)!important;}

/* ===== Заказы: карточки белые, не стекло =====
   Стекло красиво, но данные на нём не читаются: в карте пути цифр и подписей много,
   и глазу нужен лист, а не подсветка. Узкое место — жёлтым, оно должно бросаться в глаза
   раньше остального. Блок идёт после тёмного каркаса, иначе тот перекрасит обратно. */
.ord{background:#fff!important;border:1px solid rgba(0,0,0,.08)!important;
  box-shadow:0 12px 28px -20px rgba(0,0,0,.8)!important;backdrop-filter:none!important;
  -webkit-backdrop-filter:none!important;}
.ord *{color:#211f1b!important;}
.ord .ord-state,.ord-card .ord-state{display:inline-block;margin-right:8px;padding:3px 9px;border-radius:99px;
  background:#000!important;color:#fff!important;font-size:10.5px;font-weight:800;letter-spacing:.03em;
  vertical-align:1px;}
.ord-card .ord-state.big{font-size:12px;padding:5px 11px;}
.ord .ord-st{display:block;text-align:left!important;}
.ord .ord-pz{font-size:11.5px;font-weight:700;color:rgba(0,0,0,.5)!important;white-space:nowrap;}
.ord .ord-st{color:rgba(0,0,0,.72)!important;}
.ord .ord-bar{background:rgba(0,0,0,.1)!important;}
.bn-btn{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 0 0;margin:0;font:inherit;color:inherit;cursor:pointer;}
.bn-btn b{display:block;margin-top:6px;font-size:14px;}
.bn-btn .b{display:block;margin-top:4px;}
/* Метка слева, переход справа — один ряд вместо двух.
   Замер на 375: метка 166–202 px, переход 103, зазор 8. «этап» и «ресурс» укладываются в 309,
   «проблема» длиннее на 4 px и переносится. Гнаться за этими пикселями нельзя: на 360 поедет
   и остальное. Перенесённый переход прижимается вправо, а не липнет под метку.
   05.10 глаза перед «Предложение →» прибавляли 24 px; 06.10 сняты, переход снова 103. */
.bn-head{display:flex;align-items:center;justify-content:space-between;gap:6px 8px;flex-wrap:wrap;}
.bn-head .ow-tag{margin-top:0!important;}
.bn-go{margin-left:auto;font-size:11.5px;font-weight:700;white-space:nowrap;}
/* Разделитель перекрашивается под белую карточку, как и у строк этапов выше: токен --line
   в тёмной теме белый, и на белом листе плашки сливались в одну простыню. */
.ord-card .bn-btn{padding:10px 0;border-top:1px solid rgba(0,0,0,.08)!important;}
.ord-card .bn-btn:first-child{border-top:0;padding-top:0;}
.ord .ord-warn{display:inline-block;margin-top:8px;padding:4px 10px;border-radius:99px;
  background:#ffcf3f!important;color:#1a1400!important;font-size:11px;font-weight:800;}
.ord-card{background:#fff!important;border:1px solid rgba(0,0,0,.08)!important;
  border-radius:22px;padding:16px;margin-bottom:12px;
  backdrop-filter:none!important;-webkit-backdrop-filter:none!important;}
.ord-card *{color:#211f1b!important;}
.ord-card .cz-fact{background:#F6F5F2!important;border:1px solid rgba(0,0,0,.06)!important;
  backdrop-filter:none!important;-webkit-backdrop-filter:none!important;}
.ord-card .cz-fact .muted{color:rgba(0,0,0,.6)!important;}

.ord-card .os{border-bottom-color:rgba(0,0,0,.08)!important;}
.ord-card .os .m{background:rgba(0,0,0,.08)!important;}
.ord-card .os.ok .m{background:var(--lime)!important;color:var(--lime-ink)!important;}
.ord-card .os.bad .m{background:var(--orange)!important;color:#fff!important;}
.ord-card .os.warn .m{background:#ffcf3f!important;color:#1a1400!important;}
.ord-card .os .b{color:rgba(0,0,0,.55)!important;}
.ord-card .os .r{color:rgba(0,0,0,.7)!important;}
/* Предупреждение: жёлтый — тот же, что у статусов (#ffcf3f). Коричневого в фирстиле нет,
   он тянулся из старых --warn и выбивался из палитры. */
/* Карточка под карточкой: жёлтый лист снизу и слева, белый с текстом сверху.
   Обводки нет — жёлтое работает тенью-опознавателем, а текст лежит на белом и читается.
   Сплошная заливка под абзацем не годится: пробовали, текст тонет. */
.ow{display:block;margin-top:12px;border-radius:16px;padding:0 0 7px 7px;
  background:#ffcf3f!important;border:0!important;}
.ow .ow-in{display:block;border-radius:13px;padding:12px 14px;background:#fff!important;
  box-shadow:0 1px 0 rgba(0,0,0,.06);}
.ow .ow-h{display:inline-block;padding:3px 9px;border-radius:99px;background:#ffcf3f!important;
  color:#1a1400!important;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;}
.ow .ow-t{display:block;margin-top:8px;font-size:12.5px;line-height:1.45;color:#211f1b!important;font-weight:700;}
.ow .ow-f{display:block;margin-top:6px;font-size:11.5px;line-height:1.45;color:rgba(0,0,0,.7)!important;font-weight:500;}
/* Этап на странице узких мест — подложкой: когда этапов несколько, их надо разделить. */
.ow-group{display:flex;align-items:center;gap:8px;margin:18px 0 0;padding:8px 12px;border-radius:10px;
  background:rgba(0,0,0,.06)!important;color:rgba(0,0,0,.7)!important;
  font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;}
.ow-group span{margin-left:auto;display:inline-flex;align-items:center;justify-content:center;
  min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:#ffcf3f!important;
  color:#1a1400!important;font-size:10px;}
.ow-group:first-child{margin-top:0;}
/* Метка на этапе: страница заказа — про сроки, разбор живёт отдельной страницей. */
.ow-tag{display:inline-block;margin-top:5px;padding:2px 8px;border-radius:99px;
  background:#ffcf3f!important;color:#1a1400!important;font-size:10px;font-weight:800;
  letter-spacing:.04em;text-transform:uppercase;}
.ord-go{display:flex;align-items:center;gap:8px;width:100%;margin-top:14px;padding:13px 15px;
  border:0!important;border-radius:16px;cursor:pointer;
  background:#ffcf3f!important;color:#1a1400!important;
  font:800 12.5px var(--font-body);text-align:left;}
.ord-go .chv{display:flex;margin-left:auto;opacity:.6;}
.ord-card .cz-cap{color:rgba(0,0,0,.55)!important;}

/* ===== Лайм — там же, где был. Единственный акцентный свет. ===== */
.at-tile.lime,.lime-heading,.pill.lime,.ov.g{background:var(--lime)!important;color:var(--lime-ink)!important;}
.at-tile.lime .c,.at-tile.lime .s,.lime-heading *{color:var(--lime-ink)!important;}
.sq-row:active,.pr-tab.on{
  background:rgba(255,255,255,.26)!important;color:#fff!important;border-color:rgba(255,255,255,.4)!important;}
/* .proj исключён: метка «(проект)» стоит на светлой карточке шага, и белым по белому её нет.
   Она берёт цвет от поверхности через currentColor — см. .tag.proj в начале файла. */
.pill:not(.lime):not(.ghost),.tag:not(.proj){background:rgba(255,255,255,.16)!important;color:#fff!important;}
.botnav{background:rgba(0,0,0,.5)!important;border:1px solid rgba(255,255,255,.14)!important;
  backdrop-filter:blur(30px) saturate(180%)!important;-webkit-backdrop-filter:blur(30px) saturate(180%)!important;}
.logo{filter:invert(1) brightness(2);}

/* Переключатель страниц: активная — чёрная, вторая — стекло.
   Без этого переход между «Изучать» и «Игрой» не виден вообще. */
.gm-sw button.on,.subtab.on{background:#000!important;color:#fff!important;
  border:1px solid rgba(255,255,255,.22)!important;
  backdrop-filter:none!important;-webkit-backdrop-filter:none!important;}
.gm-sw button:not(.on),.subtab:not(.on){background:rgba(255,255,255,.08)!important;color:#fff!important;
  border:1px solid var(--glass-border)!important;
  backdrop-filter:blur(26px) saturate(170%)!important;-webkit-backdrop-filter:blur(26px) saturate(170%)!important;}

/* Кружки и квадраты с иконкой: фон чёрный, знак белый.
   Правило «весь текст внутри белой строки тёмный» красило и иконку — она пропадала. */
.ic,.ic-sm,.cz-ic,.dblock-ic,.dm-ic,.st-ic,.mk,[class*="-ic"],[class*="ic-"]{
  background:#000!important;color:#fff!important;border:0!important;}
.ic *,.ic-sm *,.cz-ic *,.dblock-ic *,.dm-ic *,.st-ic *,.mk *,[class*="-ic"] *,[class*="ic-"] *{
  color:#fff!important;stroke:#fff!important;fill:none!important;}
/* Аватар на тёмном поле не может быть чёрным — круг пропадает вместе с человеком.
   Даём ему плотность стекла и светлую кромку. */
.avatar{background:rgba(255,255,255,.14)!important;color:#fff!important;
  border:1px solid rgba(255,255,255,.26)!important;}

/* Нумерованный список «Эталона п/з»: кружок с номером — та же логика, что у иконки.
   Отмеченный шаг остаётся лаймовым, это его смысл, а не оформление. */
.cz-step .num,.cz-step .num *{background:#000!important;color:#fff!important;}
.cz-step .num.lime,.cz-step .num.lime *{background:var(--lime)!important;color:var(--lime-ink)!important;}

/* Стеклянные объекты приходят с фоном #0d0d0f — прозрачному стеклу нужно что преломлять.
   Плашку красим тем же цветом и режем по ней: шва не видно, фон растворяется. */
.g-art{background:#0d0d0f!important;overflow:hidden!important;
  border:1px solid rgba(255,255,255,.10)!important;}
.g-obj{--y:0%!important;}
.g-obj img{filter:none!important;}

.g-art{overflow:visible!important;}
.g-obj{--s:1.28!important;--y:-6%!important;}

/* ===== «Тренажёр»: пробуем стекло вместо белой карточки ===== */
.g-card.g-s0{background:rgba(255,255,255,.16)!important;border:1px solid rgba(255,255,255,.34)!important;
  border-top-color:rgba(255,255,255,.55)!important;
  backdrop-filter:blur(34px) saturate(180%)!important;-webkit-backdrop-filter:blur(34px) saturate(180%)!important;}
.g-card .g-title{color:#211f1b!important;}
.g-card .g-more{color:rgba(0,0,0,.62)!important;}
/* Текст карточки живёт на белой подложке внутри стекла: стекло остаётся стеклом,
   а правило читается чёрным по белому. Плашка «главное» — реверс внутри подложки.
   Подложка у всех карточек стопки, а не только у передней: когда она была только
   у передней, при каждой смене карточки белое пятно возникало рывком. */
.g-card .g-body{
  left:12px!important;right:12px!important;bottom:12px!important;top:198px!important;
  background:#F9F9F9!important;border-radius:22px!important;
  padding:15px 16px 12px!important;overflow:hidden!important;
  box-shadow:0 10px 26px -18px rgba(0,0,0,.8)!important;}
.g-card .g-body *{color:#211f1b!important;}
.g-card .g-key{background:#000!important;}
.g-card .g-key,.g-card .g-key *{color:#fff!important;}
/* Стикер категории — та же логика: белая подложка, чёрные буквы.
   Счётчик «1/10» остаётся реверсом, иначе два одинаковых пятна в одном ряду. */
.g-chip:not(.g-cnt),.g-chip:not(.g-cnt) *{background:#F9F9F9!important;color:#211f1b!important;
  border:1px solid rgba(0,0,0,.10)!important;}
.g-chip:not(.g-cnt) *{background:transparent!important;border:0!important;}
.g-chip.g-cnt,.g-chip.g-cnt *{background:#000!important;color:#fff!important;border-color:#000!important;}
.g-card .g-more{color:rgba(0,0,0,.62)!important;}
.g-card.g-s1{background:#000 url("assets/bg/card-plate.webp") center/cover no-repeat!important;
  border:1px solid rgba(255,255,255,.16)!important;
  backdrop-filter:none!important;-webkit-backdrop-filter:none!important;}
.g-stats,.g-pill{color:#fff!important;}

/* ===== Белая бумага внутри тёмной темы: шторка документа =====
   `.dm-sheet` — белый лист поверх чёрной модалки. Всё, что лежит прямо на нём и берёт цвет
   из `--ink`, после смены темы стало белым по белому: заголовок «Ошибки, которые уже были»
   давал контраст ровно 1,00. Возвращаем тёмный `--ink` внутри листа, а не правим каждый
   заголовок по отдельности — иначе следующий такой же появится незамеченным. */
.dm-sheet{--ink:#211f1b;color:#211f1b;}
/* Загрузка в шторке была белой с тёмной тенью на белом — не видна (найдено 05.10).
   Возвращаем бумажный --ink-dim; глаза берут цвет текста и темнеют вместе с ним. */
.dm-sheet .empty{color:#54514a!important;text-shadow:none!important;}
.cz-lab.err{color:#211f1b!important;}

/* ===== Длинное правило важнее картинки =====
   Подложка с текстом — окно фиксированной высоты с обрезкой, и у длинных правил нижняя
   строка («Источник: …») просто исчезала. Высота карточки теперь считается по самому
   длинному правилу колоды и ставится всем сразу — см. `measureDeckHeight()`. Ужимать окно
   объекта нельзя: мелкий предмет перестаёт читаться. Прокрутка подложки осталась
   страховкой; `touch-action:pan-y` оставляет горизонтальный свайп карточке. */
/* Кнопка тура «Что нового» была чёрной на белом. На чёрном фоне от неё осталась одна
   надпись без кнопки. Красим лаймом — это «дальше», а лайм у нас и значит действие. */
.nt-go{background:var(--lime)!important;color:var(--lime-ink)!important;}

.g-card.g-fitscroll .g-body{overflow:auto!important;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}

/* ===== Лайм остаётся действием: текст на нём — --lime-ink, никогда не белый =====
   Общие правила «всё внутри блока белое» перекрашивали и лаймовые плашки:
   плашка «Главное» внутри чёрного блока и счётчик «Знаю N из 49» на тёмном
   читались белым по лайму — контраст 1,14. Найдено обходом всех экранов
   с подсчётом контраста, а не глазами: на макете этого никто не заметил. */
.g-pill.g-know,.g-pill.g-know *,.g-key b,.g-card .g-key b,
/* .g-card.g-s0 .g-key * — три класса, поэтому побеждало белым; повторяем вес селектора */
.g-card.g-s0 .g-key b,.g-card.g-s0 .g-key b *{color:var(--lime-ink)!important;}


@media (prefers-reduced-transparency:reduce){
  [class]{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;}
  .g-card{filter:none!important;}
  .bgfield{background-image:none!important;}}
</style>
<!-- ===== РЕЖИМЫ «Работа» и «Обучение» =====
     Дизайн утверждён 06.10.2026 (Notion «🧩 Приложение: режимы…», холст дизайна). Ветка redesign-modes,
     только предпросмотр. Блок идёт после тёмного каркаса и переопределяет его: белый лист, чёрная шапка,
     заголовок экрана на пилюле цвета режима, два меню по пять пунктов, переход по глазкам.
     Порядок блоков внутри экранов не трогаем — сотрудники к нему привыкли (решение 06.10). -->
<style>
:root{--paper:#ffffff;--ink:#000;--ink-soft:#211f1b;--ink-dim:#646464;--line:rgba(0,0,0,.14);
  --glass:#fff;--glass-strong:#fff;--glass-border:rgba(0,0,0,.14);--mode:#dbff3d;--mode-ink:#0e1400;}
body.mode-learn{--mode:#E85002;--mode-ink:#000;
  /* в «Обучении» салатовый не берём: всё, что было лаймом, становится оранжевым с чёрным текстом */
  --lime:#E85002;--lime-ink:#000;}
body{background:#fff!important;color:#000!important;}
.bgfield{display:none!important;}

/* Шапка: чёрная полоса с логотипом и поиском, под ней заголовок экрана на пилюле.
   В «Работе» пилюля салатовая и с наклоном 10°, в «Обучении» оранжевая и прямая. Текст на пилюле чёрный. */
.app{padding-top:0!important;}
.topbar{margin:0 -16px!important;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 0!important;background:#000;min-height:56px;}
.msearch{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
.msearch svg{display:block;}
.mhero{margin:0 -16px;padding:12px 16px 44px;background:#000;}
.mh-title{display:inline-block;margin:0;background:var(--mode);color:var(--mode-ink);border-radius:99px;padding:6px 20px 9px;
  font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1.15;}
.mh-title span{display:inline-block;transform:skewX(-10deg);}
body.mode-learn .mh-title span{transform:none;}

/* Белый лист заходит на шапку на 28 px. Первый заголовок экрана дублирует пилюлю в шапке —
   прячем его, а подпись под ним остаётся подписью источника. */
.section.active{position:relative;margin:-28px -16px 0;padding:20px 16px 0;background:#fff;border-radius:28px 28px 0 0;min-height:60vh;}
.section > .lime-heading:first-child{display:none!important;}

/* Заголовки разделов — чёрные пилюли с белым текстом. */
.lime-heading{background:#000!important;color:#fff!important;font-size:15px!important;padding:7px 14px!important;}
.lime-heading *{color:#fff!important;}
.honest,.sub,.eb,.empty,.muted,.lime-heading + .honest,.cz-cap{color:#646464!important;text-shadow:none!important;}

/* Поверхности: стекло стало белой карточкой с тонкой рамкой; «нельзя пролистать» — чёрной. */
.glass:not(.tblack),.cz-fact,.cz-route,.cz-card,.at-card:not(.dk),.at-score:not(.dk),.at-tile:not(.lime):not(.dk),
.st-card,.taskcard,.rhead,.sq-field,.dblock,.op:not(.hot):not(.lime){
  background:#fff!important;border:1px solid rgba(0,0,0,.14)!important;color:#000!important;box-shadow:none!important;
  backdrop-filter:none!important;-webkit-backdrop-filter:none!important;}
.at-tile:not(.lime):not(.dk) .c,.at-tile:not(.lime):not(.dk) .s{color:#646464!important;}
.cz-note,.glass.tblack,.at-score.dk,.at-card.dk,.at-tile.dk,.mp,.tk-sum{
  background:#000!important;border:1px solid #000!important;color:#fff!important;
  backdrop-filter:none!important;-webkit-backdrop-filter:none!important;}
.cz-note .cz-cap,.cz-note .cz-txt,.cz-note .muted,.cz-note .honest,.at-card.dk .muted,.at-card.dk .honest,
.glass.tblack .muted,.at-score.dk .muted{color:rgba(255,255,255,.78)!important;}
.cz-note .cz-txt{color:#fff!important;}
/* Строки списков — белые, не серые: серый у нас только подписи. */
.cz-item,.cz-row,.cz-step,.cz-task,.op.hot,.pk-doc,.sq-row,.at-row,.wk-d,.tk-card{
  background:#fff!important;border:1px solid rgba(0,0,0,.14)!important;box-shadow:none!important;}
.pill:not(.lime):not(.ghost),.tag:not(.proj){background:#000!important;color:#fff!important;}
.pr-tab.on,.sq-row:active{background:#000!important;color:#fff!important;border-color:#000!important;}
.gm-sw button:not(.on),.subtab:not(.on){background:#fff!important;color:#000!important;border:1px solid rgba(0,0,0,.14)!important;
  backdrop-filter:none!important;-webkit-backdrop-filter:none!important;}
.avatar{background:#000!important;color:#fff!important;border:0!important;}
.tk-hint{color:#646464!important;text-shadow:none!important;}
.tk-hint i{filter:invert(1);}
.tk-lab{color:#000!important;}.tk-lab.bad{color:#c8331f!important;}
.g-stats,.g-pill:not(.g-know){color:#000!important;}

/* Колода — вариант А: задние карты залиты оранжевыми ступенями, содержимое на них скрыто. */
.g-card{background:#fff!important;border:1px solid rgba(0,0,0,.14)!important;
  backdrop-filter:none!important;-webkit-backdrop-filter:none!important;}
.g-card.g-s1{background:#FFB27A!important;border-color:transparent!important;}
.g-card.g-s2{background:#E85002!important;border-color:transparent!important;}
.g-card.g-s3{background:#000!important;border-color:transparent!important;}
.g-card.g-s1 > *,.g-card.g-s2 > *,.g-card.g-s3 > *{opacity:0;transition:opacity 360ms cubic-bezier(.22,.78,.2,1);}

/* Нижнее меню: два набора по пять пунктов, видим набор текущего режима. Полоса сплошная чёрная. */
.botnav{left:16px!important;right:16px!important;transform:none!important;max-width:488px;margin:0 auto;display:block;
  padding:4px!important;border-radius:30px!important;background:#000!important;border:1px solid #000!important;
  backdrop-filter:none!important;-webkit-backdrop-filter:none!important;}
.botnav .nav-work,.botnav .nav-learn{display:flex;align-items:stretch;}
body:not(.mode-learn) .botnav .nav-learn,body.mode-learn .botnav .nav-work{display:none;}
.botnav .ni{flex:1 1 0;min-width:0;width:auto!important;height:auto!important;min-height:54px;border-radius:24px!important;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 2px 6px;
  background:transparent;border:0;color:#fff;font:700 11px/1.12 var(--font-body);}
.botnav .ni[hidden]{display:none!important;}
.botnav .ni.on{background:var(--mode)!important;color:var(--mode-ink)!important;}
.eyebtn{flex:0 0 48px;min-height:54px;border:0;padding:0;background:transparent;color:#fff;border-radius:24px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;}
.eyebtn svg{display:block;}

/* Переход между режимами: глазки → белая загрузка → глазки разворачиваются → новый режим, ~700 мс. */
.mswitch{position:fixed;inset:0;z-index:60;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;}
.mswitch.to-learn{color:#E85002;}
.mswitch.go{animation:mswIn 700ms cubic-bezier(.2,.72,.18,1) both;pointer-events:auto;}
.mswitch.go svg{animation:mswFlip 340ms cubic-bezier(.2,.72,.18,1) 220ms both;}
/* В работу глазки разворачиваются в обратную сторону: стартуют зеркальными (как в меню обучения) и смотрят направо. */
.mswitch.go.to-work svg{animation-name:mswFlipBack;}
@keyframes mswFlipBack{from{transform:rotateY(180deg)}to{transform:rotateY(0)}}
@keyframes mswIn{0%{opacity:0}16%,80%{opacity:1}100%{opacity:0}}
@keyframes mswFlip{from{transform:rotateY(0)}to{transform:rotateY(180deg)}}
@media (prefers-reduced-motion:reduce){.mswitch.go,.mswitch.go svg{animation:none;}}

/* «Сегодня» — каркас: плитки «Рост» и «Обучение» одной линией. Остальные блоки — следующим шагом. */
.td-pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);margin:0 0 12px;}
.td-pair button{min-height:136px;border:0;border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:8px;
  text-align:left;font:800 14px var(--font-body);cursor:pointer;}
.td-gr{position:relative;z-index:1;background:#000;color:#fff;}
.td-ln{margin-left:-28px;padding-left:42px!important;border-radius:0 24px 24px 0!important;background:#E85002;color:#000;}
.mh-back{display:flex;width:max-content;align-items:center;gap:6px;min-height:44px;margin:0 0 6px -4px;padding:0 4px;border:0;background:none;color:#fff;font:700 13px var(--font-body);cursor:pointer;}
.mh-back[hidden],.mh-fact[hidden],.mh-expl[hidden]{display:none;}
.mh-fact{margin:16px 0 6px;font-family:var(--font-display);font-weight:700;font-size:21px;line-height:1.2;color:#fff;}
.mh-expl{font:600 13px/1.35 var(--font-body);color:#fff;}
#s-profile > .sq{display:none;}
/* «Рост» в «Работе» — без аттестации: она в «Обучении» (решение 06.10). В «Обучении» пункт
   «Аттестация» показывает этот же экран, но только карточку аттестации. */
body:not(.mode-learn) #atBox{display:none!important;}
body.mode-learn #s-growth > :not(#atCards),body.mode-learn #atCards > :not(#atBox):not(#atTrainer){display:none!important;}
/* Тренажёр — на «Аттестации» под карточкой аттестации (дизайн 06.10); на «Карточках» только «Изучать».
   Блок «Рост» из тренажёра в «Обучении» не показываем: баллов и премии здесь нет. */
body:not(.mode-learn) #atTrainer{display:none!important;}
#atTrainer{margin-top:12px;}
#atTrainer > .at-score{display:none!important;}
#s-game .gm-sw,#s-game .gm-play{display:none!important;}
/* заголовок «Аттестация» внутри карточки повторяет пилюлю в шапке */
body.mode-learn #atBox > .lime-heading:first-child{display:none!important;}
/* «Как считаются баллы» — под кнопкой, как «Требования» у премии. */
details.gr-fold{margin:0 0 12px;}
details.gr-fold > summary{list-style:none;display:flex;align-items:center;justify-content:center;gap:6px;min-height:52px;border-radius:99px;
  background:#000;color:#fff;font:800 13px var(--font-body);cursor:pointer;}
details.gr-fold > summary::-webkit-details-marker{display:none;}
details.gr-fold > summary svg{transition:transform 200ms;}
details.gr-fold[open] > summary svg{transform:rotate(180deg);}
details.gr-fold > #czScale,details.gr-fold > .attn,details.gr-fold > #czMachine{margin-top:12px;}
.er-row.td-rw + .er-row.td-rw{border-top:1px solid rgba(0,0,0,.08);}
.at-score .td-ic.mc{background:transparent!important;color:#000!important;}
.at-score .td-ic.mc *,.dm-sheet .td-ic.mc *{fill:#000!important;}
.gr-more{display:flex;align-items:center;justify-content:center;width:100%;min-height:44px;margin:8px 0 0;border:1.5px solid #000;
  border-radius:99px;background:#fff;color:#000;font:800 12.5px var(--font-body);cursor:pointer;}
/* Роль: метка (видят директор и сам сотрудник) и словарь документов. */
.rl-mark{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:99px;background:#ffcf3f;color:#0e1400!important;font:700 10.5px var(--font-body);vertical-align:1px;}
details.rl-gl{margin:0 0 12px;border:1px solid rgba(0,0,0,.14);border-radius:20px;padding:0 14px;background:#fff;}
details.rl-gl summary{list-style:none;min-height:48px;display:flex;align-items:center;font:800 13px var(--font-body);cursor:pointer;}
details.rl-gl summary::-webkit-details-marker{display:none;}
.rl-gi{padding:10px 0;border-top:1px solid rgba(0,0,0,.08);font-size:12.5px;line-height:1.4;}
.rl-gi b{display:block;font-weight:800;}
.rl-gi span{display:block;}
.rl-gi small{display:block;color:#646464;font-size:11px;margin-top:2px;}
/* ===== Читаемость (аудит 06.10, замер контраста по всем экранам) ===== */
/* Подписи-заголовки на чёрных карточках были серыми (#646464 на чёрном, 3,5 : 1) — делаем светлыми. */
.cz-note .cz-cap,.glass.tblack .cz-cap,.at-card.dk .cz-cap,.at-score.dk .cz-cap,.mp .cz-cap,.attn .eb,.glass.tblack .eb,.tm-hd .cz-cap,
.at-card.dk .muted,.attn .muted{color:rgba(255,255,255,.78)!important;}
/* Активная карточка карусели — чёрная, текст светлый (была белой с белым текстом, 1 : 1). */
.cz-card.on{background:#000!important;border-color:#000!important;color:#fff!important;}
.cz-card.on .cz-s,.cz-card.on .cz-p{color:rgba(255,255,255,.78)!important;}
/* Счётчик «Партия … · осталось …» на чёрной полосе — белым по прозрачному. */
.g-pill.g-left{background:rgba(255,255,255,.16)!important;color:#fff!important;}
/* Огонь серии в профиле — на чёрном, подпись светлее. */
.fireb{background:#000!important;}.fireb-c{color:rgba(255,255,255,.78)!important;}
.ord .ord-pz{color:rgba(0,0,0,.64)!important;}
.gp-draft{color:#b33c00!important;border-color:#b33c00!important;}

/* ===== Разминка — чёрный блок, оранжевая кнопка, вопрос жирным (директор 06.10) ===== */
#qDay.qd{background:#000!important;color:#fff!important;border:0!important;box-shadow:none!important;
  backdrop-filter:none!important;-webkit-backdrop-filter:none!important;}
#qDay .strk-top,#qDay .strk-top *{color:#fff!important;}
#qDay .strk-sub,#qDay .qd-cap{color:rgba(255,255,255,.78)!important;}
#qDay .at-cta,#qDay .qd-go{background:#E85002!important;color:#000!important;border:0!important;}
#qDay .at-cta *{color:#000!important;stroke:#000!important;}
#qDay .qd-q{color:#fff!important;font-weight:800!important;font-size:15.5px!important;}
#qDay .qd-o{background:#fff!important;color:#000!important;font-weight:600!important;border:0!important;}
#qDay .qd-o.ok{background:#E85002!important;color:#000!important;}
#qDay .qd-o.no{background:#3a1208!important;color:#ffb39e!important;}
#qDay .qd-r{color:#fff!important;}

/* ===== «Ошибки»: кнопка «Что считается ошибкой» наезжала на заголовок «Ошибки» ===== */
#myErrCatalog{margin:0 0 20px;}
#myErrCatalog .at-cta{width:100%;min-height:48px;}
/* ===== «Знания» (дизайн 06.10) ===== */
#s-process > .sq{display:none!important;}               /* поиск — кнопкой в шапке */
.kn-top{display:flex;align-items:center;gap:8px;margin:0 0 12px;}
.kn-top #prModes{flex:1 1 auto;min-width:0;margin:0!important;}
.kn-top .etl{flex:0 0 auto;min-height:44px;padding:0 16px;border:0;border-radius:99px;background:#000;color:#fff;font:800 13px var(--font-body);cursor:pointer;white-space:nowrap;}
.kn-last{background:#000;color:#fff;border-radius:24px;padding:6px 14px 14px;margin:0 0 12px;}
.kn-last .td-sh b{background:#E85002!important;color:#000!important;}
.kn-last .kt{font:800 14px/1.35 var(--font-body);margin:4px 0 4px;}
.kn-last .ks{font-size:12px;line-height:1.45;color:rgba(255,255,255,.78);}
.kn-last .kb2{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin-top:12px;border:0;border-radius:99px;background:#E85002;color:#000;font:800 13px var(--font-body);cursor:pointer;}
/* «Аттестация»: блоки к повторению — первыми */
.at-rep-h{font:800 15px var(--font-body);display:inline-flex;align-items:center;min-height:32px;padding:0 14px;border-radius:99px;background:#E85002;color:#000;margin:4px 0 8px;}
/* «Внимание» (бывшие «Ошибки», директор 06.10): сводка по отделу — только директору (решение 02.10);
   «Запреты» — на оранжевой подложке, для внимания. */
body:not(.is-director) .dept-only{display:none!important;}
.lime-heading.ban-h{background:#E85002!important;color:#000!important;}
.lime-heading.ban-h *{color:#000!important;}
/* Глазки трёх цветов (дизайн 06.10): оранжевые — из «Работы» в обучение к правилу; салатовая «В работу» — назад. */
.kbl{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;margin:-12px -10px -12px auto;
  border:0;background:none;color:#E85002!important;cursor:pointer;flex:0 0 auto;padding:0;}
.kbl svg,.kbl svg *{fill:#E85002!important;stroke:none!important;}
.fd-kv .k{display:flex;align-items:center;gap:8px;}
.ord-card .os .sb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.mh-work{display:flex;width:max-content;align-items:center;gap:8px;min-height:44px;margin:0 0 10px;padding:0 16px 0 12px;border:0;border-radius:99px;
  background:#dbff3d;color:#0e1400;font:800 13px var(--font-body);cursor:pointer;}
.mh-work[hidden]{display:none;}
.mh-work svg *{fill:#0e1400!important;}
/* «Сегодня»: блоки — карточки с заголовком-пилюлей; срочное — чёрная, остальное — белые. */
.td-bk{border-radius:24px;padding:6px 14px 8px;margin:0 0 12px;}
.td-bk.wb{background:#fff;border:1px solid rgba(0,0,0,.14);}
.td-bk.dk{background:#000;color:#fff;}
.td-sh{display:flex;align-items:center;gap:8px;min-height:44px;}
.td-sh b{display:inline-flex;align-items:center;min-height:32px;padding:0 14px;border-radius:99px;background:#000;color:#fff;font:800 15px var(--font-body);}
.td-bk.dk .td-sh b{background:#fff;color:#000;}
.td-sh b.acc{background:#dbff3d!important;color:#0e1400!important;}
.td-sh .ct{font:700 13px var(--font-display);}
.td-sh .lk{margin-left:auto;min-height:44px;display:inline-flex;align-items:center;gap:4px;border:0;background:none;font:700 12px var(--font-body);color:inherit;cursor:pointer;padding:0;}
.td-src{font-size:11px;color:#646464;margin:-4px 0 4px 2px;}
.td-bk.dk .td-src{color:rgba(255,255,255,.72);}
.td-rw{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 0;width:100%;border:0;background:none;color:inherit;text-align:left;font:inherit;cursor:pointer;}
.td-rw + .td-rw{border-top:1px solid rgba(0,0,0,.08);}
.td-bk.dk .td-rw + .td-rw{border-top-color:rgba(255,255,255,.14);}
.td-ic{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto;border:1px solid rgba(0,0,0,.14);}
.td-bk.dk .td-ic{border-color:rgba(255,255,255,.3);}
.td-ic.mc{border:0;}
/* общее правило иконок снимает заливку (fill:none) — глазки нарисованы заливкой, возвращаем её */
.td-ic.mc *{fill:currentColor!important;stroke:none!important;}
.td-k{flex:1;min-width:0;}
.td-k b{display:block;font-size:12.5px;font-weight:700;line-height:1.3;}
.td-k span{display:block;font-size:11px;color:#646464;margin-top:2px;}
.td-bk.dk .td-k span{color:rgba(255,255,255,.72);}
.td-v{font:700 16px var(--font-display);white-space:nowrap;}
.td-late{background:#c8331f;color:#fff;font-size:10.5px;font-weight:700;padding:5px 8px;border-radius:99px;white-space:nowrap;}
.td-t{font-size:11.5px;font-weight:700;color:#646464;white-space:nowrap;}
.td-fl{display:flex;gap:6px;margin:0 0 4px;}
.td-fl button{min-height:36px;display:inline-flex;align-items:center;gap:6px;padding:0 14px;border-radius:99px;background:#fff;border:1px solid rgba(0,0,0,.14);color:#000;font:700 12px var(--font-body);cursor:pointer;}
.td-fl button.on{background:#000;border-color:#000;color:#fff;}
.td-fl i{font-style:normal;font:700 10.5px var(--font-display);opacity:.75;}
.td-empty{padding:10px 0 12px;font-size:12.5px;font-weight:600;}
.td-pair button{gap:10px;}
.td-pair .c{font-size:14px;font-weight:800;}
.td-pair .nums{display:flex;align-items:flex-end;flex-wrap:wrap;gap:8px 12px;margin-top:auto;}
.td-pair .nums b{display:block;font:700 26px/1 var(--font-display);}
.td-pair .nums em{display:block;font-style:normal;font-size:11px;margin-top:4px;opacity:.8;}
.td-pair .pl{display:inline-block;align-self:flex-start;font:700 11px var(--font-display);padding:5px 8px;border-radius:99px;}
.td-gr .pl{background:#dbff3d;color:#0e1400;}
.td-ln .pl{background:#000;color:#fff;}
.td-gate{height:6px;border-radius:99px;overflow:hidden;}
.td-gr .td-gate{background:rgba(255,255,255,.2);}.td-gr .td-gate i{background:#dbff3d;}
.td-ln .td-gate{background:rgba(0,0,0,.18);}.td-ln .td-gate i{background:#000;}
.td-gate i{display:block;height:100%;border-radius:99px;}
/* ===== Деньги на «Сегодня» (07.10): блок A, окно C3, форма F2. Цвет по состоянию, оранжевого нет. ===== */
/* Бухгалтерия (08.10): меню то же, пункты производства скрыты атрибутом hidden в finBoot. Поиск индексирует
   процесс производства — у бухгалтерии его нет. На «Знаниях» нет «Сейчас» и «Эталона п/з», на «Внимании» — только свои ошибки. */
body.is-finance #mSearch,body.is-finance .kn-top,body.is-finance #prModes,body.is-finance #s-errors > :not(#myErrors){display:none!important;}
.fin-bk{display:block;width:100%;border:0;text-align:left;font:inherit;cursor:pointer;}
.fin-cap{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.72);margin:2px 2px 4px;}
.fin-big{font:700 30px/1.05 var(--font-display);letter-spacing:-.01em;margin:0 2px;color:#fff;}
.fin-big small{font-size:18px;margin-left:4px;}
.td-src.fin-src{margin:8px 2px 6px;}
.td-rw.fin-open{padding:0;}
.td-rw.fin-open .td-k span.fin-big{display:block;margin:0;font-size:30px;color:#fff;}
.fin-pl{display:inline-flex;align-items:center;min-height:24px;padding:0 9px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap;flex:0 0 auto;}
.td-sh .fin-pl{margin-left:4px;}
.fin-pl.r{background:#c8331f;color:#fff;}
.fin-pl.y{background:#ffcf3f;color:#0e1400;}
.fin-pl.g{background:#dbff3d;color:#0e1400;}
.fin-pl.o{background:#fff;color:#000;border:1px solid rgba(0,0,0,.14);}
.fin-list{background:#fff;color:#000;border-radius:18px;padding:2px 12px;margin:10px 0;}
.fin-list .td-rw{cursor:default;}
.fin-list .td-rw + .td-rw{border-top-color:rgba(0,0,0,.08)!important;}
.fin-list .td-k span{color:#646464!important;}
.fin-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:99px;border:0;background:#dbff3d;color:#0e1400;font:800 13px var(--font-body);cursor:pointer;margin:2px 0 8px;}
.fin-btn:disabled{opacity:.5;}
.td-bk.wb .fin-btn,.dm-sheet .fin-btn{margin-top:4px;}
.dm-sheet .td-bk{margin:0;}
.fin-row{display:flex;align-items:center;gap:10px;min-height:60px;padding:8px 0;}
.fin-row + .fin-row{border-top:1px solid rgba(0,0,0,.08);}
.td-bk.dk .fin-row + .fin-row{border-top-color:rgba(255,255,255,.14);}
.td-v.fin-v{font-size:14px;}
.fin-since{color:#c8331f;font-weight:700;}
.td-bk.dk .fin-since{color:#ff9d8f;}
.fin-gh{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#646464;margin:6px 2px 0;}

<script>
(function(){
  const TITLES = {search:'Поиск', today:'Сегодня', tasks:'Задачи', orders:'Заказы', profile:'Профиль', growth:'Рост',
                  game:'Карточки', process:'Знания', errors:'Внимание'};
  const title = document.getElementById('mhTitle');
  const setTitle = t => { title.innerHTML = '<span>'+t+'</span>'; };
  // Режим определяется набором, из которого пришёл пункт: так и кнопки внутри экранов,
  // которые «нажимают» пункт меню программно, переключают режим сами.
  document.querySelectorAll('.botnav .ni').forEach(b => b.addEventListener('click', () => {
    document.body.classList.toggle('mode-learn', !!b.closest('.nav-learn'));
    setTitle(b.dataset.title || TITLES[b.dataset.s] || '');
    window.scrollTo(0, 0);
  }, true));
  const sw = document.getElementById('mswitch');
  document.querySelectorAll('.eyebtn').forEach(e => e.addEventListener('click', () => {
    const toLearn = e.dataset.to === 'learn';
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    sw.className = 'mswitch go ' + (toLearn ? 'to-learn' : 'to-work');
    setTimeout(() => document.querySelector(toLearn ? '.nav-learn .ni:not([hidden])' : '.nav-work .ni:not([hidden])').click(), reduce ? 0 : 400);
    setTimeout(() => { sw.className = 'mswitch'; }, reduce ? 0 : 720);
  }));
  // ===== «Сегодня» =====
  // Сборка из того, что сервер уже отдаёт: находки — предварительные начисления из счёта ошибок,
  // задачи — из Трекера, «Рост» — из трёх счетов, «Обучение» — из серии разминки.
  // ponytail: «Оплачено, не принято» рисуется, только если сервер отдаёт window.PAID_PENDING — ручки пока нет
  const esc = t => String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const svg = (d, n) => '<svg width="'+(n||18)+'" height="'+(n||18)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+d+'</svg>';
  const EYE_MC = '<svg width="24" height="12" viewBox="-82 -40 164 80" aria-hidden="true"><g fill="currentColor"><path d="M-45.88,36L-7,36A72,72 0 0 0 -79,-36L-79,-2.88A33.12,33.12 0 0 1 -45.88,36Z"/><path d="M40.12,36L79,36A72,72 0 0 0 7,-36L7,-2.88A33.12,33.12 0 0 1 40.12,36Z"/></g></svg>';
  const CHEV = svg('<polyline points="9 6 15 12 9 18"/>', 16);
  const KBL = '<button type="button" class="kbl" aria-label="Правило — в обучении"><svg width="30" height="15" viewBox="-82 -40 164 80" aria-hidden="true"><g transform="scale(-1,1)"><path d="M-45.88,36L-7,36A72,72 0 0 0 -79,-36L-79,-2.88A33.12,33.12 0 0 1 -45.88,36Z"/><path d="M40.12,36L79,36A72,72 0 0 0 7,-36L7,-2.88A33.12,33.12 0 0 1 40.12,36Z"/></g></svg></button>';
  const TASK_IC = svg('<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M8 12l3 3 5-6"/>');
  const FLAG_IC = svg('<path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/>');
  const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 12 || h > 14) ? b : c; };
  let TD_FILTER = 'all', TD_FIND = null;
  const hero = {fact: document.getElementById('mhFact'), expl: document.getElementById('mhExpl'), back: document.getElementById('mhBack')};
  function setHero(fact, expl){
    hero.fact.hidden = !fact; hero.fact.textContent = fact || '';
    hero.expl.hidden = !expl; hero.expl.textContent = expl || '';
  }
  function findings(){
    // Бухгалтерия (08.10): записи «Учёта ошибок», ещё не разобранные на созвоне. Баллов и уровней у них нет.
    if(isFinRole()) return ERROR_LOG.filter(e => e.status !== 'Обсуждено на созвоне')
      .map(e => ({fin:true, what:e.title, cat:e.cat, desc:e.desc, draft:e.draft, detectedOn:e.dt}))
      .sort((a, b) => (b.detectedOn || '').localeCompare(a.detectedOn || ''));
    if(!TD_FIND || !TD_FIND.items) return [];
    return TD_FIND.items.filter(x => x.status === 'new').sort((a, b) => (b.detectedOn || '').localeCompare(a.detectedOn || ''));
  }
  function docHead(x){ if(x.fin) return x.cat || 'Учёт ошибок'; return (typeof errType === 'function' ? errType(x.docType) : 'Документ') + (x.doc ? ' ' + x.doc : ''); }
  function findingSheet(x){
    if(x.fin) return openSheet({cap:'Ошибка', title: esc(x.what), icon: IC.flag, sub: esc(docHead(x)) + (x.draft ? ' · до правила' : ' · без оценки'),
      body: '<div class="cz-fact">'+
        (x.desc ? '<div class="fd-kv"><div class="k">Что произошло</div><div class="t">'+esc(x.desc)+'</div></div>' : '')+
        '<div class="fd-kv"><div class="k">Зафиксировано</div><div class="t">'+(x.detectedOn ? AT_DM(x.detectedOn) : '—')+' · «Учёт ошибок»</div></div>'+
        '<div class="fd-kv"><div class="k">Дальше</div><div class="t">'+(x.draft ? 'Правила ещё нет: запись — для разбора и правила.' : 'Разбор на созвоне.')+' Без оценки.</div></div>'+
        '</div>'});
    const fixable = x.level && x.level < 3;
    openSheet({cap:'Находка', title: esc(x.what || docHead(x)), icon: IC.flag, sub: esc(docHead(x)) + ' · уровень ' + (x.level || '—'),
      body: '<div class="cz-fact">'+
        '<div class="fd-kv"><div class="k">Что нарушено'+KBL+'</div><div class="t">'+esc(x.what || '—')+'</div></div>'+
        (x.clause ? '<div class="fd-kv"><div class="k">Правило'+KBL+'</div><div class="t">'+esc(x.clause)+'</div></div>' : '')+
        '<div class="fd-kv"><div class="k">Балл</div><div class="t"><b>'+AT_NEG(x.points)+'</b> · '+(fixable
          ? 'станет 0, если исправить в утреннее окно — час после созвона'
          : 'уровень 3 в окне не снимается')+'</div></div>'+
        '<div class="fd-kv"><div class="k">'+(x.machine ? 'Нашла машина' : 'Зафиксировал директор')+'</div><div class="t">'+(x.detectedOn ? 'обнаружено '+AT_DM(x.detectedOn) : '')+'</div></div>'+
        '<div class="fd-kv"><div class="k">Не согласны</div><div class="t">Напишите боту «оспорить '+x.id+'» с пояснением — 3 рабочих дня с уведомления.</div></div>'+
        '</div>',
      after: body => body.querySelectorAll('.kbl').forEach(b => b.onclick = () => openRule(x.clause || x.what || ''))});
  }
  // ===== Деньги на «Сегодня» (решения директора 07.10.2026: блок A, окно C3, форма F2) =====
  // Всё считает сервер (/api/app/finance): кто что видит и вносит, сверка с Мой Складом на 00:00, история
  // «не закрыто с». Здесь только показ и форма. Цвет — по состоянию: лайм сходится, красный расходится,
  // жёлтый не внесено. Оранжевый в деньгах не используется.
  let FIN = null, FIN_ERR = false;
  const BANK_IC = svg('<path d="M3 10l9-6 9 6"/><path d="M5 10v8"/><path d="M10 10v8"/><path d="M14 10v8"/><path d="M19 10v8"/><path d="M3 20h18"/>', 28);
  const EDIT_IC = svg('<path d="M4 20h4L19 9l-4-4L4 16z"/>', 16);
  const isFinRole = () => !!(currentUser && currentUser.role === 'finance');
  const finFor = () => !!(currentUser && (currentUser.role === 'finance' || currentUser.key === 'director'));
  // Рубли из копеек: «5 626 950», с копейками — только в форме.
  const rub = k => k === null || k === undefined ? '—' : (k < 0 ? '−' : '') + String(Math.round(Math.abs(k) / 100)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  const rubK = k => k === null || k === undefined ? '' : String(Math.floor(Math.abs(k) / 100)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ',' + String(Math.abs(k) % 100).padStart(2, '0');
  const sgn = k => (k > 0 ? '+' : '') + rub(k);
  // Тот же разбор, что на сервере: сервер всё равно проверит, здесь — чтобы не отправлять мусор.
  const parseRub = v => { const s = String(v == null ? '' : v).replace(/[\s  ]/g, '').replace(',', '.'); if(!/^\d{1,12}(\.\d{1,2})?$/.test(s)) return null; const [i, f = ''] = s.split('.'); return Number(i) * 100 + Number((f + '00').slice(0, 2)); };
  const ekbHm = () => new Date(Date.now() + 5 * 3600 * 1000).toISOString().slice(11, 16);
  const finAuth = () => ({Authorization: 'tma ' + tgInit()});
  async function finLoad(){
    if(!finFor()) return;
    try{
      const r = await fetch(apiBase() + '/finance', {headers: finAuth()});
      if(!r.ok) throw new Error('http ' + r.status);
      FIN = await r.json(); FIN_ERR = false;
    }catch(e){ FIN_ERR = true; }
    renderToday();
  }
  const pill = (cls, t) => '<span class="fin-pl ' + cls + '">' + t + '</span>';
  function linePill(l, f){
    if(l.state === 'mismatch') return pill('r', sgn(l.diff) + ' ₽');
    if(l.state === 'match') return pill('g', 'сходится');
    if(l.state === 'late') return pill('r', 'не внесено');
    if(l.state === 'missing') return pill('y', 'не внесено');
    if(l.state === 'waiting') return pill('o', 'ждёт бухгалтера');
    if(l.state === 'nodata') return pill('o', 'нет Мой Склада');
    return '';
  }
  const tails = l => l.banks.length > 1 ? ' · ' + l.banks.map(b => '…' + b.label.slice(-4)).join(' + ') : '';
  function lineSub(l, f){
    if(l.state === 'mismatch' || l.state === 'match') return 'МС ' + rub(l.ms) + ' · банк ' + rub(l.bank) + '<br>' + esc(l.who || '') + (l.since ? ' · <b class="fin-since">не закрыто с ' + l.since + '</b>' : '');
    if(l.state === 'waiting') return 'ждёт подключения бухгалтера · пока по Мой Складу' + (l.since ? ' · не закрыто с ' + l.since : '');
    if(l.state === 'missing' || l.state === 'late') return 'вносит ' + esc(l.byName || '—') + (l.of > 1 ? ' · внесено ' + l.entered + ' из ' + l.of : '') + (l.state === 'late' ? ' · срок ' + f.deadline + ' прошёл' : f.workday ? ' · до ' + f.deadline : '') + (l.since ? ' · не закрыто с ' + l.since : '');
    return '';
  }
  function finBlock(){
    if(!finFor()) return '';
    if(!FIN) return FIN_ERR ? '<div class="td-bk dk"><div class="td-sh"><b>Деньги</b></div><div class="td-empty">Деньги не загрузились. Откройте приложение ещё раз.</div></div>' : '';

    if(window.PAID_PENDING && PAID_PENDING.length){
      parts.push('<div class="td-bk wb"><div class="td-sh"><b>Оплачено, не принято</b><span class="ct">'+PAID_PENDING.length+'</span></div>'+
        PAID_PENDING.slice(0, 3).map(x => '<div class="td-rw"><span class="td-ic">'+svg('<circle cx="5" cy="12" r="2"/><circle cx="19" cy="12" r="2"/><path d="M7 12h10"/>')+'</span><span class="td-k"><b>'+esc(x.title)+'</b><span>'+esc(x.sub||'')+'</span></span>'+(x.late ? '<span class="td-late">+'+x.late+' дн.</span>' : '')+'</div>').join('')+'</div>');
    }
    // У финансов «Роста» и «Обучения» нет: только деньги и задачи (решение 07.10).
    if(isFinRole()){
      el.innerHTML = parts.join('');
      gdBind(el); // гид «Марина в отпуске» — Лере, пока флаг включён
      finBind(el);
      el.querySelectorAll('[data-f]').forEach(x => x.addEventListener('click', () => findingSheet(f[+x.dataset.f])));
      const allF = document.getElementById('tdAllF');
      if(allF) allF.addEventListener('click', () => document.querySelector('.nav-learn .ni[data-s="errors"]').click()); // пункт меню сам переключает режим
      el.querySelectorAll('[data-url]').forEach(x => x.addEventListener('click', () => tkOpen(x.dataset.url)));
      heroToday();
      return;
    }
    // «Рост» и «Обучение» одной линией: чёрный «Рост» заходит на оранжевую плитку.
    const e = window.ERR_SCORE, g = window.GROW_SCORE, d = window.DISCIPLINE, b = window.BONUS, st = window.STREAK;
    const growTotal = g ? (g.cleanWeeks*3 + g.greenMonths*5 + g.sectionAttest*10 + g.zoneAttest*25 + (g.game||0) + ((d && d.plus)||0)) : 0;
    const lim = b && b.oct && b.oct.docsLimit ? b.oct.docsLimit : 10;
    const pts = e ? e.points : 0;
    const days = (st && st.days) || 0, done = !!(st && st.answeredToday);
    parts.push('<div class="td-pair">'+
      '<button type="button" class="td-gr" id="tdGrowth" aria-label="Рост: подробности"><span class="c">Рост'+(e ? ' · '+esc(e.month) : '')+'</span>'+
        '<span class="nums"><span><b>'+AT_NEG(pts)+'</b><em>ошибки из '+lim+'</em></span><span class="pl">'+AT_POS(growTotal)+' рост</span></span>'+
        '<span class="td-gate"><i style="width:'+Math.min(100, Math.round(pts / lim * 100))+'%"></i></span></button>'+
      '<button type="button" class="td-ln" id="tdLearn" aria-label="В обучение: серия и разминка"><span class="c">Обучение</span>'+
        '<span class="nums"><span><b>'+days+'</b><em>'+(days ? DAY_WORD(days) + ' серия' : 'серия не начата')+'</em></span><span class="pl">'+(done ? 'разминка ✓' : 'разминка')+'</span></span>'+
        '<span class="td-gate"><i style="width:'+(done ? 100 : 0)+'%"></i></span></button></div>');
    el.innerHTML = parts.join('');
    gdBind(el);
    finBind(el);
    el.querySelectorAll('[data-f]').forEach(x => x.addEventListener('click', () => findingSheet(f[+x.dataset.f])));
    el.querySelectorAll('[data-go="tasks"]').forEach(x => x.addEventListener('click', () => document.querySelector('.nav-work .ni[data-s="tasks"]').click()));
    el.querySelectorAll('[data-fl]').forEach(x => x.addEventListener('click', () => { TD_FILTER = x.dataset.fl; renderToday(); }));
    const allF = document.getElementById('tdAllF');
    if(allF) allF.addEventListener('click', () => document.getElementById('tdGrowth').click());
    document.getElementById('tdGrowth').onclick = () => document.querySelector('.nav-work .ni[data-s="growth"]').click();
    document.getElementById('tdLearn').onclick = () => document.querySelector('.eyebtn[data-to="learn"]').click();
    if(document.querySelector('.section.active') === el) heroToday();
  }
  window.TD_RENDER = renderToday; // гид перерисовывает плашку после «Ознакомлен»
  function heroToday(){
    const f = findings(), tk = tasksAll();
    if(isFinRole()){
      if(!FIN) return setHero('Сегодня', FIN_ERR ? 'Деньги не загрузились' : '');
      const n = FIN.counts.mismatch, w = FIN.counts.missing;
      const more = w ? (n ? 'И ' : '') + w + ' ' + plural(w, 'счёт', 'счёта', 'счетов') + ' ещё не ' + plural(w, 'внесён', 'внесены', 'внесены') + (FIN.workday && !FIN.late ? ' · срок ' + FIN.deadline : '') : '';
      return n ? setHero(n + ' ' + plural(n, 'расхождение', 'расхождения', 'расхождений'), more) : setHero(w ? 'Внести остатки' : 'Всё сходится', w ? more : 'Внесённые счета сходятся с Мой Складом');
    }
    if(f.length) setHero(f.length+' '+plural(f.length,'находка','находки','находок'), 'Уровень 1–2 — без балла, если исправить в утреннее окно');
    else if(tk && tk.overdue.length) setHero(tk.overdue.length+' '+plural(tk.overdue.length,'задача просрочена','задачи просрочены','задач просрочено'), tk.todayList.length ? 'И ещё '+tk.todayList.length+' на сегодня' : '');
    else if(tk) setHero(tk.todayList.length ? tk.todayList.length+' '+plural(tk.todayList.length,'задача','задачи','задач')+' на сегодня' : 'Чистый день', 'Находок нет');
    else setHero('', '');
  }
  // Строка факта под заголовком — у экранов, где она уже считается из данных.
  function heroFor(sec){
    hero.back.hidden = sec !== 'growth' || document.body.classList.contains('mode-learn');
    if(sec === 'today') return heroToday();
    if(sec === 'tasks'){ const tk = tasksAll(); return tk ? setHero(
      (tk.overdue.length ? tk.overdue.length+' '+plural(tk.overdue.length,'просрочена','просрочены','просрочено')+' · ' : '')+tk.todayList.length+' на сегодня',
      window.DISCIPLINE ? 'Закрыто в срок: +'+DISCIPLINE.plus+' из '+DISCIPLINE.cap+' плюсов за месяц' : '') : setHero('', ''); }
    if(sec === 'growth' && !document.body.classList.contains('mode-learn')){ const e = window.ERR_SCORE, b = window.BONUS;
      return setHero(e ? AT_NEG(e.points)+' '+plural(e.points,'балл','балла','баллов')+' · '+e.month : '', b && b.oct ? 'Премия до '+mpFmt(b.oct.total) : ''); }
    setHero('', '');
  }
  hero.back.addEventListener('click', () => document.querySelector('.nav-work .ni[data-s="today"]').click());
  document.querySelectorAll('.botnav .ni').forEach(b => b.addEventListener('click', () => {
    heroFor(b.dataset.s);
    // «Рост» — экран по тапу с «Сегодня»: в меню его нет, подсвечиваем «Сегодня».
    if(b.hidden) setTimeout(() => { b.classList.remove('on'); document.querySelector('.nav-work .ni[data-s="today"]').classList.add('on'); }, 0);
  }));
  // Поиск — отдельный экран поверх текущего режима; меню не меняется.
  // На экране поиска кнопка становится крестиком и возвращает туда, откуда пришли.
  const sBtn = document.getElementById('mSearch');
  const ICON_SEARCH = sBtn.innerHTML;
  const ICON_X = svg('<path d="M18 6L6 18"/><path d="M6 6l12 12"/>', 20);
  let searchFrom = null;
  function searchOff(){
    sBtn.innerHTML = ICON_SEARCH; sBtn.setAttribute('aria-label', 'Поиск по правилам и документам'); searchFrom = null;
  }
  sBtn.addEventListener('click', () => {
    if(searchFrom){
      const back = searchFrom; searchOff();
      document.getElementById('s-search').classList.remove('active');
      back.sec.classList.add('active'); setTitle(back.title); heroFor(back.sec.id.slice(2)); window.scrollTo(0, 0);
      return;
    }
    const cur = document.querySelector('.section.active');
    searchFrom = {sec: cur, title: title.textContent};
    document.querySelectorAll('.section').forEach(x => x.classList.remove('active'));
    document.getElementById('s-search').classList.add('active');
    setTitle('Поиск'); setHero('', ''); hero.back.hidden = true; window.scrollTo(0, 0);
    sBtn.innerHTML = ICON_X; sBtn.setAttribute('aria-label', 'Закрыть поиск');
    setTimeout(() => { const i = document.querySelector('#s-search input'); if(i) i.focus(); }, 60);
  });
  document.querySelectorAll('.botnav .ni, .eyebtn').forEach(b => b.addEventListener('click', searchOff));
  // Данные приходят в разное время: пересобираем «Сегодня» после каждого источника.
  // «Рост»: «Как считаются баллы» — под кнопкой; в «Баллах по месяцам» два последних начисления
  // и «Показать все». Список перерисовывается при смене месяца — следим и применяем заново.
  function growthTidy(){
    const sc = document.getElementById('czScale');
    if(sc && !sc.closest('details.gr-fold')){
      const d = document.createElement('details'); d.className = 'gr-fold';
      d.innerHTML = '<summary>Как считаются баллы '+svg('<polyline points="6 9 12 15 18 9"/>', 16)+'</summary>';
      sc.parentNode.insertBefore(d, sc);
      // «Важно» и «Что машина начисляет сама» — правила счёта, туда же, под кнопку.
      const box = d.parentNode;
      [box.querySelector(':scope > .attn'), document.getElementById('czMachine')].forEach(x => { if(x) d.appendChild(x); });
      d.appendChild(sc);
      d.addEventListener('toggle', () => { if(d.open && typeof refreshCarousels === 'function') refreshCarousels(); });
    }
    const list = document.getElementById('atErrList');
    if(list && !list.dataset.all){
      const items = list.querySelectorAll('.er-row');
      const more = list.querySelector('.gr-more');
      if(items.length > 2 && !more){
        items.forEach((x, i) => { if(i > 1) x.hidden = true; });
        const b = document.createElement('button'); b.type = 'button'; b.className = 'gr-more';
        b.textContent = 'Показать все · '+items.length;
        b.onclick = () => { list.dataset.all = '1'; list.querySelectorAll('.er-row').forEach(x => x.hidden = false); b.remove(); };
        items[items.length - 1].after(b);
      }
    }
  }
  const grBox = document.getElementById('s-growth');
  if(grBox) new MutationObserver(() => growthTidy()).observe(grBox, {childList: true, subtree: true});
  growthTidy();
  // Тренажёр живёт на «Аттестации»: контейнер под карточкой аттестации, рисует его тот же gmStatus.
  function trainerMount(){
    const cards = document.getElementById('atCards');
    if(!cards || typeof gmStatus !== 'function') return null;
    let h = document.getElementById('atTrainer');
    if(!h){ h = document.createElement('div'); h.id = 'atTrainer'; cards.appendChild(h); }
    gmStatus(h);
    return h;
  }
  const learnAtt = document.querySelector('.nav-learn .ni[data-s="growth"]');
  if(learnAtt) learnAtt.addEventListener('click', () => setTimeout(trainerMount, 0));
  // Все входы «в тренажёр» (кнопка на «Росте» и прочие) ведут на «Аттестацию».
  if(typeof gmSet === 'function'){
    const _gmSet = gmSet;
    gmSet = function(mode){
      if(mode !== 'play') return _gmSet(mode);
      learnAtt.click();
      setTimeout(() => { const t = document.getElementById('atTrainer'); if(t) t.scrollIntoView({behavior:'smooth', block:'start'}); }, 300);
    };
  }
  // ===== «Знания» =====
  // Роли вместо имён на плитках операций: каркас один на несколько отделов (решение 06.10).
  // \b в JS не видит кириллицу — границы слова задаём явно.
  const W = w => new RegExp('(?<![А-Яа-яЁё])'+w+'(?![А-Яа-яЁё])', 'g');
  const ROLE_WORDS = [[W('Антону'),'руководителю'],[W('Антона'),'руководителя'],[W('Антон'),'руководитель'],
    [W('Михаилу'),'менеджеру по закупкам'],[W('Михаила'),'менеджера по закупкам'],[W('Михаил'),'менеджер по закупкам'],
    [W('Арсению'),'кладовщику'],[W('Арсения'),'кладовщика'],[W('Арсений'),'кладовщик']];
  const toRoles = t => ROLE_WORDS.reduce((x,[re,r]) => x.replace(re, r), t);
  function openSearch(q){
    sBtn.click();
    setTimeout(() => { const i = document.querySelector('#s-search input'); if(i){ i.value = q; i.dispatchEvent(new Event('input')); } }, 80);
  }
  function knLast(){
    const body = document.getElementById('prBody');
    if(!body || PR_MODE !== 'now' || body.querySelector('.kn-last')) return;
    const items = (TD_FIND && TD_FIND.items) ? TD_FIND.items.slice().sort((a,b) => (b.detectedOn||'').localeCompare(a.detectedOn||'')) : [];
    const x = items[0];
    if(!x) return;
    const box = document.createElement('div'); box.className = 'kn-last';
    box.innerHTML = '<div class="td-sh"><b>По вашей последней ошибке</b></div>'+
      '<div class="kt">'+esc(x.what || docHead(x))+'</div>'+
      '<div class="ks">'+esc(docHead(x))+(x.detectedOn ? ' · '+AT_DM(x.detectedOn) : '')+(x.machine ? ' · нашла машина' : '')+(x.clause ? '<br>Пункт: '+esc(x.clause) : '')+'</div>'+
      '<button type="button" class="kb2">Найти правило</button>';
    box.querySelector('.kb2').onclick = () => openSearch(x.clause || x.what || '');
    body.insertBefore(box, body.firstChild);
  }
  if(typeof renderProcess === 'function'){
    const _renderProcess = renderProcess;
    renderProcess = function(u){
      _renderProcess(u);
      const modes = document.getElementById('prModes');
      // Переключатель «Сейчас / Справочник» слева, чёрная кнопка «Эталон п/з» — отдельно справа.
      if(modes && !modes.parentElement.classList.contains('kn-top')){
        const row = document.createElement('div'); row.className = 'kn-top';
        modes.parentElement.insertBefore(row, modes); row.appendChild(modes);
        const b = document.createElement('button'); b.type = 'button'; b.className = 'etl'; b.textContent = 'Эталон п/з';
        b.onclick = () => { PR_MODE = 'ref'; PR_TAB = 'flow'; renderProcess(currentUser); };
        row.appendChild(b);
      }
      document.querySelectorAll('#s-process .op-w, #s-process .op-t').forEach(e => { e.textContent = toRoles(e.textContent); });
      knLast();
    };
  }
  // ===== «Аттестация»: блоки «К повторению» — над статусом и кнопкой теста =====
  function attOrder(){
    const b = document.getElementById('atBox'), bl = b && b.querySelector(':scope > .at-blocks');
    if(!bl || bl.dataset.top) return;
    bl.dataset.top = '1';
    const h = document.createElement('div'); h.className = 'at-rep-h'; h.textContent = 'К повторению';
    const anchor = b.querySelector(':scope > .honest') || b.firstChild;
    anchor.after(h); h.after(bl);
  }
  const atObs = document.getElementById('atCards');
  if(atObs) new MutationObserver(attOrder).observe(atObs, {childList:true, subtree:true});
  // ===== Оранжевые глазки: из «Работы» в обучение к правилу, салатовая «В работу» — назад =====
  const KBL_SVG = '<svg width="30" height="15" viewBox="-82 -40 164 80" aria-hidden="true"><g transform="scale(-1,1)"><path d="M-45.88,36L-7,36A72,72 0 0 0 -79,-36L-79,-2.88A33.12,33.12 0 0 1 -45.88,36Z"/><path d="M40.12,36L79,36A72,72 0 0 0 7,-36L7,-2.88A33.12,33.12 0 0 1 40.12,36Z"/></g></svg>';
  const mhWork = document.getElementById('mhWork');
  let RETURN_TO = null;
  function modeSwitch(toLearn, action){
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    sw.className = 'mswitch go ' + (toLearn ? 'to-learn' : 'to-work');
    setTimeout(action, reduce ? 0 : 400);
    setTimeout(() => { sw.className = 'mswitch'; }, reduce ? 0 : 720);
  }
  function rememberWork(){
    const on = document.querySelector('.nav-work .ni.on');
    RETURN_TO = on ? on.dataset.s : 'today';
  }
  function showWorkBtn(){ mhWork.hidden = !RETURN_TO; }
  // Правило: открываем «Обучение» и поиск по пункту перечня или тексту нарушения.
  window.openRule = function(q){
    if(typeof closeDoc === 'function') closeDoc();
    rememberWork();
    modeSwitch(true, () => {
      document.querySelector('.nav-learn .ni[data-s="process"]').click();
      if(q) openSearch(q);
      showWorkBtn();
    });
  };
  // Этап заказа: открываем «Эталон п/з».
  window.openEtalon = function(){
    if(typeof closeDoc === 'function') closeDoc();
    rememberWork();
    modeSwitch(true, () => {
      document.querySelector('.nav-learn .ni[data-s="process"]').click();
      PR_MODE = 'ref'; PR_TAB = 'flow'; renderProcess(currentUser);
      showWorkBtn();
    });
  };
  mhWork.addEventListener('click', () => {
    const back = RETURN_TO || 'today'; RETURN_TO = null; mhWork.hidden = true;
    if(searchFrom) searchOff();
    modeSwitch(false, () => document.querySelector('.nav-work .ni[data-s="'+back+'"]').click());
  });
  // Ушёл из обучения сам (глазками в меню) — кнопка «В работу» больше не нужна.
  document.querySelectorAll('.eyebtn').forEach(e => e.addEventListener('click', () => { RETURN_TO = null; mhWork.hidden = true; }));
  // Шторки начислений и карта пути рисуются в общем окне — добавляем глазки, когда оно открывается.
  const dm = document.getElementById('docModalInner');
  if(dm) new MutationObserver(() => {
    if(document.body.classList.contains('mode-learn')) return;
    dm.querySelectorAll('.ord-card .os .sb').forEach(sb => {
      if(sb.querySelector('.kbl')) return;
      const b = document.createElement('button'); b.type = 'button'; b.className = 'kbl'; b.setAttribute('aria-label', 'Как закрывается этап — эталон в обучении');
      b.innerHTML = KBL_SVG; b.onclick = e => { e.stopPropagation(); openEtalon(); };
      sb.appendChild(b);
    });
  }).observe(dm, {childList:true, subtree:true});
  const _renderAll = renderAll;
  renderAll = function(u){
    if(u && u.role === 'finance'){ finBoot(u); return; }
    _renderAll(u);
    afterData(u);
  };
  // Лера и Марина (08.10, «всё по аналогии с производством, новое ничего не создаём»): те же экраны и меню.
  // Работа — «Сегодня» (деньги, задачи, ошибки) и «Задачи»; обучение — «Знания» (своя роль и правила, проектом) и «Внимание»
  // (свои ошибки без баллов). Что им можно, решает сервер; здесь только не рисуем того, чего у них нет.
  const FIN_DRAFT = '<div class="cz-note" style="margin-bottom:12px;"><div class="cz-cap">Проект</div>'+
    '<div class="cz-txt">База знаний бухгалтерии собрана из решений директора 05–08.10.2026 и ещё не объявлена правилом. Спорное — к директору.</div></div>';
  function finBoot(u){
    document.body.classList.add('is-finance');
    document.body.classList.remove('is-director');
    const w = document.getElementById('whoami');
    if(w) w.innerHTML = '<div class="av">'+esc(u.initials || '')+'</div><div class="nm">'+esc(String(u.name || '').split(' ')[0])+'</div>';
    // «Задачи» — тот же экран и свайп, что у производства (директор 08.10: «задачи есть в Трекере»); счёта дисциплины сервер не отдаёт.
    document.querySelectorAll('.botnav .ni').forEach(b => { if(['today', 'tasks', 'process', 'errors'].indexOf(b.dataset.s) < 0) b.hidden = true; });
    const r = ROLES[u.key];
    PR_TABS.splice(0, PR_TABS.length,
      {k:'role', t:'Моя роль', head:'Карточка роли', sub: r ? r.position : '', body:'<div id="finRole"></div>', mount:()=>{
        const h = document.getElementById('finRole');
        if(!h) return;
        if(!r){ h.innerHTML = '<div class="cz-note"><div class="cz-txt">Карточка роли не загрузилась. Откройте приложение ещё раз, а если не появится — скажите директору.</div></div>'; return; }
        h.innerHTML = roleBlockHtml(r); roleBlockBind(r);
      }},
      {k:'rules', t:'Правила', head:'Правила бухгалтерии', sub:'Оплаты, счета, фонды, остатки, сверка', body:'<div id="ruleAccordion"></div>', mount:()=>renderRules()});
    PR_MODE = 'ref'; PR_TAB = 'role';
    renderProcess(u);
    myErrorsMount();
    renderToday();
    loadTasks(true);
    finLoad();
  }
  const _loadTasks = loadTasks;
  loadTasks = async function(silent){ await _loadTasks(silent); renderToday(); };
  // Загрузка могла закончиться раньше, чем выполнился этот блок, — тогда собираем сразу.
  function afterData(u){
    document.body.classList.toggle('is-director', !!(u && u.key === 'director'));
    if(typeof sqMount === 'function') sqMount('s-search', u, {});
    renderToday();
    if(typeof myScore === 'function') myScore().then(h => { TD_FIND = h; renderToday(); knLast(); }).catch(() => {});
    if(u && u.key === 'director') finLoad();
  }
  if(typeof currentUser !== 'undefined' && currentUser) (currentUser.role === 'finance' ? finBoot : afterData)(currentUser);
})();
</script>
<div class="bgfield" aria-hidden="true"></div>
<script>
/* Заставка профиля живёт на своей фоновой картинке. Класс переключается по смене экрана. */
(function(){
  function sync(){
    var a=document.querySelector('.section.active');
    document.body.classList.toggle('bg-start', !!a && a.id==='s-profile');
  }
  document.addEventListener('click', function(e){ if(e.target.closest('.botnav')) setTimeout(sync,0); }, true);
  setTimeout(sync,120);
})();
</script>
