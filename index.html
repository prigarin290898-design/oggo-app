};

// Тело шага: абзацы, затем подшаги (7.1–7.3), затем «(проект)», затем перечень документов.
// Порядок не случайный: документы идут последним, чтобы «(проект)» не оказался между
// действующими правилами и списком форм и не прочитался как ещё одна форма к печати.
function stepDocsHtml(n){
  const d = STEP_DOCS[n];
  if(!d) return '';
  // Шаги 2 и 7.1 документа не порождают вовсе. Пустую строку человек читает как
  // «форму забыли назвать», поэтому у них отдельная подпись, а не пустой чип.
  if(d.none) return '<div class="cz-line" style="margin-top:8px;"><span class="lb">Документов нет</span><span class="tx">'+d.none+'</span></div>';
  // «Работаем в» — документ в программе, «Печатаем» — бумага, «В чат» — фото или PDF (решение директора 02.10.2026:
  // прежняя подпись «К печати» над всеми документами шага была неверной — заказ покупателя не печатается).
  const line = (lb, list) => (list && list.length) ? '<div class="cz-line" style="margin-top:8px;"><span class="lb">'+lb+'</span>'+list.map(x=>'<span class="pr">'+x+'</span>').join('')+'</div>' : '';
  return line('Работаем в', d.work) + line('Печатаем', d.print) + line('В чат', d.chat);
}
// Пара «ключ — значение» размечается ТОЛЬКО там, где тире или двоеточие уже стоит в тексте
// правила, и только выделением того, что там написано. Ничего не переписываем, заголовков не
// сочиняем, ключей тексту не назначаем: решать, что в правиле главное, значит редактировать
// процесс под видом вёрстки. Ключ — до 40 знаков и без точки внутри, иначе абзац идёт как есть.
// Сколько таких абзацев найдётся — столько и разметится, ноль так ноль.
const KV_RE = /^([^.!?]{2,40}?)(\s+—\s+|:\s+)(.+)$/;

// Запрет выделяется НАЧЕРТАНИЕМ, а не цветом (решение директора 25.09.2026).
// Чёрную плашку не ставим: каскад «Тёмного каркаса» красит всё внутри .cz-step с !important,
// и цветной приём пришлось бы продавливать через ОЧ-40. Жирность каскад не трогает —
// приём переживает текущий !important и ничего не требует чинить.
// Запрет опознаётся закрытым списком слов, а не по смыслу: разметка не решает за процесс.
// Выделяется формулировка, которая уже есть в тексте; слова «Нельзя» не дописываем.
// Не больше одного выделения на тело правила; нет ни одного слова из списка — нет и выделения.
const BAN_RE = /нельзя|запрещ|не трогаем|не отменяем|не берём|не принимаются|не выполняется в принципе/i;

function paraHtml(line, banIdx, idx){
  const ban = idx === banIdx;
  const m = KV_RE.exec(line);
  if(!ban) return m ? '<p class="kv"><b>'+m[1]+'</b>'+m[2]+m[3]+'</p>' : '<p>'+line+'</p>';
  // Запретительный абзац: лид жирным отдельной строкой, хвост — обычным.
  // Граница лида берётся из самого текста: якорь пары, если он есть, иначе первая точка
  // или точка с запятой. Ничего не дописываем — выделяем то, что в шаге уже написано.
  if(m) return '<p class="ban"><b>'+m[1]+'</b>'+m[2].trim()+' '+m[3]+'</p>';
  const s = /^(.+?[;.])\s+(.+)$/.exec(line);
  return s ? '<p class="ban"><b>'+s[1]+'</b>'+s[2]+'</p>' : '<p class="ban"><b>'+line+'</b></p>';
}

function stepBody(st){
  // Шаги, несущие «(проект)» — 7.3, 10, 13 — директор назвал поимённо: на них акцент не ставим.
  // Правило было сформулировано под чёрную плашку; с начертанием оно держится по букве.
  // ⚠️ На шаге 13 под выделение попадал бы настоящий запрет («нет номенклатуры или остаток ≤ 0 —
  // отгрузка не выполняется в принципе»), а не текст проекта: включать ли его — вопрос директору.
  const hasProj = !!st.proj || (st.subs || []).some(s=>s.proj);
  const lines = st.detail.split('\n');
  const banIdx = hasProj ? -1 : lines.findIndex(l=>BAN_RE.test(l));
  return lines.map((l,i)=>paraHtml(l, banIdx, i)).join('')+
    (st.subs || []).map(s=>{const sl = s.detail.split('\n'); const bi = sl.findIndex(l=>BAN_RE.test(l));
      return '<div class="cz-sub"><span class="sn">'+s.n+'</span><b>'+s.title+'</b>'+(s.norm?'<span class="tg" style="background:#ffcf3f;color:#0e1400;margin-left:6px;">норма · '+s.norm+'</span>':'')+
      sl.map((l,i)=>paraHtml(l, bi, i)).join('')+
      (s.proj ? projNote(s.proj) : '')+stepDocsHtml(s.n)+'</div>';}).join('')+
    (st.proj ? projNote(st.proj) : '')+stepDocsHtml(st.n);
}
// Плашка-схема «Матрёшка документов»: в «Эталоне п/з» — с кнопкой в окно-объяснение,
// в гиде роли (у Антона) — без неё: окно поверх окна заменило бы гид.
const CHAIN_NOTE = withBtn => '<div class="cz-note"><div class="cz-cap">Матрёшка документов · премикс только по согласованию</div><div class="cz-chips"><span>Заказ покупателя</span><i>→</i><span>П/з ГП</span><i>→</i><span>П/з концентрат</span><i>·</i><span>П/з основа</span></div>'+
  (withBtn ? '<button type="button" class="mt-open">Что такое матрёшка? →</button>' : '')+'</div>';
function renderFlow(){
  const chev = ic('<polyline points="6 9 12 15 18 9"/>',15);
  const stepsHtml = steps => steps.map(st=>
    // Класс ref — скоуп оформления. Теми же .cz-step рисуются роли, блоки аттестации и список
    // вопросов; без скоупа белый лист и 13,5px уехали бы в аттестацию 01–02.10.
    '<div class="cz-step ref"><div class="hd"><span class="num'+(st.mark?' lime':'')+'">'+st.n+'</span><div style="flex:1;min-width:0;"><div class="tt">'+st.title+'</div><div class="dd">'+st.desc+'</div>'+(st.norm?'<span class="tg" style="background:#ffcf3f;color:#0e1400;">норма · '+st.norm+'</span>':'')+(st.tag?'<span class="tg">'+st.tag+'</span>':'')+(st.proj||(st.subs||[]).some(s=>s.proj)?'<span class="tag proj" style="margin-left:6px;">проект внутри</span>':'')+'</div><span class="chv">'+chev+'</span></div><div class="dtl-w"><div><div class="dtl">'+stepBody(st)+'</div></div></div></div>').join('');
  const chain = CHAIN_NOTE(true);
  makeCarousel(document.getElementById('flowBlocks'), {
    label:'Ветки процесса',
    items: FLOW.map(b=>({title:b.title, sub:b.sub, icon:b.icon, peek:b.steps.length+' шагов'})).concat([{title:FAST.title, sub:'условие шага 7 · только закупка', icon:FAST.icon, peek:'Когда закупка пропускается'}]),
    list: i=>{
      if(i < FLOW.length){
        const b = FLOW[i];
        return (b.intro==='chain' ? chain : '<div class="cz-note"><div class="cz-cap">Важно</div><div class="cz-txt">'+b.intro+'</div></div>') + stepsHtml(b.steps);
      }
      return '<div class="cz-note"><div class="cz-cap">Условие шага 7 · только закупка</div><div class="cz-txt" style="font-weight:600;">'+FAST.lead+'</div></div>' + czLabel('ok','Условия, все сразу') + FAST.conds.map(t=>czItem(t,'ok')).join('') + '<div class="cz-note" style="margin-top:2px;"><div class="cz-txt">'+FAST.note+'</div></div>';
    },
    bind: list=>{
      list.querySelectorAll('.cz-step .hd').forEach(h=>h.addEventListener('click', ()=>h.parentElement.classList.toggle('open')));
      list.querySelectorAll('.mt-open').forEach(b=>b.addEventListener('click', mtSheet));
    }
  });
}

function ruDocWord(n){
  const n1 = n % 10;
  if(n1===1 && n!==11) return 'документ';
  if(n1>=2 && n1<=4 && !(n>=12 && n<=14)) return 'документа';
  return 'документов';
}

// ===== Карусели: карточки блоков сверху, содержимое активной карточки — под ними =====
const CAROUSELS = [];
function refreshCarousels(){ CAROUSELS.forEach(c=>c.update()); }
window.addEventListener('resize', ()=>refreshCarousels());

function plain(html, n){
  const t = String(html).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
  return t.length>n ? t.slice(0,n).replace(/\s+\S*$/,'')+'…' : t;
}

function makeCarousel(host, cfg){
  if(!host) return;
  const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  host.innerHTML = '<div class="cz"><div class="cz-track" tabindex="0" aria-label="'+(cfg.label||'')+'"><i class="cz-sp"></i>'+
    cfg.items.map((it,i)=>'<button class="cz-card'+(it.dashed?' dashed':'')+(i===0?' on':'')+'" data-i="'+i+'" style="--k:'+(i===0?0:1)+'">'+
      (it.tag?'<span class="cz-tag tag rev">'+it.tag+'</span>':'')+
      '<span class="cz-ic">'+(it.iconHtml||ic(it.icon,22))+'</span><span class="cz-t">'+it.title+'</span><span class="cz-s">'+it.sub+'</span>'+(it.peek?'<span class="cz-p">'+it.peek+'</span>':'')+'</button>').join('')+
    '<i class="cz-sp"></i></div><div class="cz-dots">'+cfg.items.map((it,i)=>'<button aria-label="'+it.title+'" data-i="'+i+'"'+(i===0?' class="on"':'')+'></button>').join('')+'</div><div class="cz-list"></div></div>';
  const track = host.querySelector('.cz-track');
  const cards = Array.from(track.querySelectorAll('.cz-card'));
  const dots = Array.from(host.querySelectorAll('.cz-dots button'));
  const list = host.querySelector('.cz-list');
  let cur = -1, raf = 0;

  function fill(i){
    list.innerHTML = cfg.list(i);
    Array.from(list.children).forEach((c,n)=>c.style.setProperty('--n', n));
    if(cfg.bind) cfg.bind(list, i);
  }
  function setList(i, animate){
    if(!animate || reduced){ fill(i); return; }
    list.classList.add('out');
    setTimeout(()=>{ if(cur===i){ fill(i); list.classList.remove('out'); } }, 130);
  }
  function goTo(i){
    const c = cards[Math.max(0,Math.min(cards.length-1,i))];
    c.scrollIntoView({behavior: reduced ? 'auto' : 'smooth', inline:'center', block:'nearest'});
  }
  function update(){
    if(!track.clientWidth) return;
    const cr = track.getBoundingClientRect(), cx = cr.left + cr.width/2;
    let best = 0, bd = 1e9;
    cards.forEach((c,i)=>{
      const r = c.getBoundingClientRect(), d = Math.abs(r.left + r.width/2 - cx);
      c.style.setProperty('--k', Math.min(1, d/r.width).toFixed(3));
      if(d < bd){ bd = d; best = i; }
    });
    if(best !== cur){
      const first = cur === -1;
      cur = best;
      cards.forEach((c,i)=>c.classList.toggle('on', i===cur));
      dots.forEach((d,i)=>d.classList.toggle('on', i===cur));
      setList(cur, !first);
    }
  }
  track.addEventListener('scroll', ()=>{ if(!raf) raf = requestAnimationFrame(()=>{ raf = 0; update(); }); }, {passive:true});
  cards.forEach((c,i)=>c.addEventListener('click', ()=>{ if(i !== cur) goTo(i); }));
  dots.forEach((d,i)=>d.addEventListener('click', ()=>goTo(i)));
  track.addEventListener('keydown', e=>{
    if(e.key==='ArrowRight'){ e.preventDefault(); goTo(cur+1); }
    if(e.key==='ArrowLeft'){ e.preventDefault(); goTo(cur-1); }
  });
  cur = 0; fill(0);
  CAROUSELS.push({update});
}

function openDoc(key){
  const d = DOCS[key];
  if(!d) return;
  const blk = DOC_BLOCKS.find(b=>b.docs.includes(key));
  const ruleRows = String(d.rule).split('<br><br>').reduce((a,par)=>a.concat(czSentences(par)),[]).map(t=>czItem(t,'ok')).join('');
  const riskRows = [].concat(d.risk||[]).reduce((a,r)=>a.concat(czSentences(r)),[]).map(t=>czItem(t,'risk')).join('');
  const hasErr = Array.isArray(d.errors);
  const errRows = hasErr ? (d.errors.length ? d.errors.map(e=>czItem(withRev(e.what),'err',e.who+' · '+e.when)).join('') : czItem('Нарушений по этому документу пока не зафиксировано.','ok')) : '';
  document.getElementById('docModalInner').innerHTML = `
    <div class="dm-top"><button class="dm-back" id="docBack" aria-label="Назад">${ic('<polyline points="15 18 9 12 15 6"/>',20)}</button><div class="dm-cap">Памятка документы</div><span style="width:44px;flex:0 0 auto;"></span></div>
    <div class="dm-hero"><div class="dm-ic">${ic(d.icon,32)}</div><div class="dm-title">${d.title}</div><div class="dm-sub">${blk ? blk.title : d.subtitle}</div></div>
    <div class="dm-sheet"><div class="cz-stack">
      ${czLabel('ok','Правило работы')}${ruleRows}
      ${czLabel('bad','Нельзя')}${d.bad.map(b=>czItem(withRev(b),'bad')).join('')}
      ${d.risk ? czLabel('risk','Риск')+riskRows : ''}
      ${hasErr ? czLabel('err','Ошибки, которые уже были — недопустимо')+errRows : ''}
    </div></div>
  `;
  document.getElementById('docBack').addEventListener('click', closeDoc);
  const modal = document.getElementById('docModal');
  modal.classList.add('open');
  modal.scrollTop = 0;
}

}

/* Ударный режим на профиле: быстрый переход в «Изучать».
   Плитка сама рассказывает состояние — серия и пройдена ли сегодня разминка, — поэтому
   человеку не надо открывать «Тренажёр», чтобы узнать, горит у него ещё огонёк или уже нет.
   Огонёк контурный, эмодзи в интерфейсе не используем. */
/* Огонь рисуется двумя контурами: внешнее пламя и язык внутри. Одного контура мало —
   без внутреннего языка силуэт читается каплей, а не огнём. Обводка, а не эмодзи:
   эмодзи в интерфейсе у нас не используются и на разных телефонах выглядят по-своему. */
const FIRE_SVG = (size, inner) => '<svg viewBox="0 0 24 24" width="'+size+'" height="'+size+'" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+
  '<path d="M12 2.6c.5 2.6 1.9 4.3 3.3 5.8C16.9 10.1 18 11.9 18 14.2a6 6 0 0 1-12 0c0-2 .8-3.6 2-5 .3 .9 .9 1.6 1.7 2 .5-3 1.2-5.6 .3-8.6z"/>'+
  (inner === false ? '' : '<path d="M12 20.4a3.2 3.2 0 0 0 3.2-3.2c0-1.3-.8-2.2-1.6-3-.5-.5-.9-1.1-1.1-1.8-.8 1-1.7 1.7-2.4 2.6-.6 .8-1.3 1.6-1.3 2.5a3.2 3.2 0 0 0 3.2 2.9z"/>')+
  '</svg>';
const DAY_WORD = n => n % 10 === 1 && n % 100 !== 11 ? 'день' : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? 'дня' : 'дней';

/* Огонь с числом дней внутри. Заливка, а не обводка: по контуру цифру не прочитать.
   Красный берём из фирменного градиента (--grad-2 #C10801), а не --danger: danger у нас
   означает ошибку, и огонь его цветом читался бы как «у тебя проблема».
   Погасшая серия — тот же огонь серым, число 0: пустое место человек не замечает,
   а серый ноль видно. */
let FIRE_UID = 0;
/* Огонь без числа внутри. Число в пламя не ставим: форма сужается кверху, читаемая площадь
   маленькая и не прямоугольная — двузначное влезает впритык, трёхзначное только уменьшением
   до нечитаемого. В Duolingo число тоже стоит рядом, а не внутри.
   Заливка градиентом от оранжевого к красному, обе точки из фирменного градиента
   (--grad-3 #F16001 и --grad-2 #C10801): один плоский красный тонет в тёплом фоне приложения.
   Погасшая серия — тот же огонь серым. */
const FIRE_ICON = (days, size) => {
  const on = Number(days) > 0;
  const id = 'fg' + (++FIRE_UID);
  const заливка = on
    ? '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F16001"/><stop offset="1" stop-color="#C10801"/></linearGradient></defs>'
    : '';
  const цвет = on ? 'url(#' + id + ')' : 'rgba(255,255,255,.22)';
  return '<svg viewBox="0 0 24 26" width="' + size + '" height="' + Math.round(size * 26 / 24) + '" aria-hidden="true">' + заливка +
    '<path fill="' + цвет + '" d="M12 .8c.6 3.2 2.3 5.2 4 6.9C17.9 9.7 19.4 12 19.4 15.2 19.4 21 15.8 25.2 12 25.2S4.6 21 4.6 15.2c0-2.6 1-4.7 2.6-6.5.4 1.2 1.1 2.1 2.2 2.6C10 7.4 13 5 12 .8z"/>' +
    '</svg>';
};

/* Одна и та же плитка на профиле и в «Тренажёре»: человек должен видеть состояние серии
   там, где он о ней вспомнил, и там, где её продлевают. Разница только в стрелке —
   на профиле плитка ведёт в «Изучать», в самом «Тренажёре» вести некуда. */
function streakInner(st){
  const дней = (st && st.days) || 0;
  const пройдена = !!(st && st.answeredToday);
  const слева = дней ? `<b style="font-size:20px;font-family:var(--font-display);">${дней}</b> <span style="font-size:12.5px;">${DAY_WORD(дней)} подряд</span>`
                     : '<b style="font-size:15px;">Серия не начата</b>';
  const снизу = пройдена ? 'Разминка сегодня пройдена. Завтра новая.'
              : дней ? 'Разминка сегодня ещё не пройдена — серия сгорит в полночь.'
                     : 'Пять вопросов в день. Ошибка ничего не стоит, пропуск дня обнуляет серию.';
  return `<span class="strk-fire">${FIRE_ICON((st && st.days) || 0, 30)}</span>
      <span class="strk-txt"><span class="strk-top">${слева}</span><span class="strk-sub">${снизу}</span></span>`;
}
/* Огонь в блоке имени: короткий путь в «Изучать» с того экрана, куда человек заходит первым.
   Подпись под ним — чтобы число в огне читалось как дни, а не как счёт чего-то ещё. */
function streakBadge(){
  const st = window.STREAK || null;
  const дней = (st && st.days) || 0;
  const пройдена = !!(st && st.answeredToday);
  const подпись = дней ? DAY_WORD(дней) : 'серия';
  const title = пройдена ? 'Разминка сегодня пройдена' : дней ? 'Разминка сегодня ещё не пройдена' : 'Разминка ещё не начата';
  return `<button type="button" class="fireb" id="strkGo" aria-label="${title}, открыть Изучать" title="${title}">
      ${FIRE_ICON(дней, 30)}
      <span class="fireb-n"><b>${дней}</b><span class="fireb-c">${подпись}</span></span>
    </button>`;
}

/* После пройденной разминки серия меняется, а огонь в блоке имени нарисован раньше и об этом
   не знает. Перерисовываем оба места разом: человек возвращается на профиль и видит новое
   число, а не вчерашнее. */
function streakPaint(){
  const b = document.getElementById('strkGo');
  if (b) {
    const st = window.STREAK || null, дней = (st && st.days) || 0;
    b.innerHTML = FIRE_ICON(дней, 30) + '<span class="fireb-n"><b>' + дней + '</b><span class="fireb-c">' + (дней ? DAY_WORD(дней) : 'серия') + '</span></span>';
  }
  document.querySelectorAll('.strk.strk-in').forEach(el=>{
    const счёт = el.querySelector('.qd-cap');
    el.innerHTML = streakInner(window.STREAK || null) + (счёт ? счёт.outerHTML : '');
    el.classList.toggle('on', !!(window.STREAK && window.STREAK.answeredToday));
  });
}

// Переход открывает «Тренажёр» тем же путём, что и нижняя навигация: иначе экран считается
// неактивным, и разминка не пересобирается.
function streakBind(){
  const b = document.getElementById('strkGo');
  if(!b) return;

// ===== Заказы: карта пути =====
// Данные считает сервер (chainview + chainload) и отдаёт готовыми: план по этапам, факт,
// узкие горлышки. Приложение только рисует — вторая арифметика рядом с первой означала бы,
// что когда-нибудь они разойдутся.
let ORD = null;
const ordDM = d => d ? String(d).slice(0,10).split('-').reverse().slice(0,2).join('.') : '—';
const ordMoney = n => String(Math.round((n||0)/100)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ')+' ₽';

function ordBar(c){
  const live = c.stages.filter(s=>s.state !== 'skipped');
  const done = live.filter(s=>s.state === 'done').length;
  return Math.round(done / live.length * 100);
}
// Номера заданий — рядом с номером заказа: заказ без п/з ни о чём не говорит,
// а именно по заданию человек ищет работу в программе.
const ordTasks = c => (c.tasks||[]).filter(t=>!t.cancelled).map(t=>t.name);
// Узкие горлышки процесса (решение директора 02.10.2026): этап, ресурс или проблема, которая ограничивает
// поток всей системы. Общие для всех заказов — поэтому лежат здесь, а не приходят с заказом.

const BN_RESOURCE = [
  {t:'Директор как точка согласований', kind:'ресурс', d:'Пять согласований на заказ без срока ответа: подтверждение, техкарты, сумма закупки, спорные случаи ветки, инвентаризация. Каждый заказ ждёт одного человека.',

    fix:'Дублёр на приёмку и отметки — Арсений, на отгрузку — Антон. Заказ поставщику создавать «на основании» п/з, чтобы связь не терялась и расчёт не переписывался руками.'},
  {t:'Антон', kind:'ресурс', d:'Все п/з, расчёт потребности, передача в работу и все выпуски — через одного человека.',

  {t:'Инвентаризация конца месяца', kind:'этап', d:'Выпуски останавливаются за сутки и до «Согласована», для всех заказов разом.',
    fix:'Планировать выпуски мимо окна: машина уже сдвигает готовность с дня инвентаризации. Согласовывать описи в тот же день, чтобы окно не тянулось на 1–2 число.'}
];
// Плашка горлышка — одна разметка на оба места: этап заказа и список ресурсных горлышек.
// Метка и переход стоят одним рядом: по отдельности они занимали два ряда из трёх, а текст
// при этом переносился. Ряд переносится сам, если метка и переход не укладываются в ширину.
function bnPlate(attrs, kind, text, title){

    '<span class="bn-head"><span class="ow-tag">узкое горлышко · '+kind+'</span>'+
    '<span class="bn-go">Предложение →</span></span>'+
    (title ? '<b>'+title+'</b>' : '')+
    '<span class="b">'+text+'</span></button>';
}
// Лист одного горлышка: что это, чем ограничивает, предложение по оптимизации. Открывается с этапа
// заказа и из карточки над списком. Предложения — Аудитора, не решения: решает директор.
function bnSheet(x, back){
  openSheet({cap:'Узкое горлышко · '+x.kind, title:x.t, icon:IC.flag,
    sub:'Общее для всех заказов, не ошибка по заказу',
    body:'<div class="ord-card"><div class="cz-fact"><b style="font-size:12.5px;">Чем ограничивает поток</b><div style="margin-top:6px;">'+SQ_ESC(x.d)+'</div></div>'+
      '<div class="cz-fact" style="margin-top:12px;"><b style="font-size:12.5px;">Предложение по оптимизации</b><div style="margin-top:6px;">'+SQ_ESC(x.fix)+'</div>'+
      '<div class="muted" style="margin-top:8px;">Предложение, не решение: решает директор.</div></div></div>',
    after: ()=>{
      const b = document.getElementById('docBack');
      if(!b || !back) return;
      const n = b.cloneNode(true); b.parentNode.replaceChild(n, b);
      n.addEventListener('click', back);
    }});
}
// Ресурсные горлышки живут на странице профиля директора (решение 02.10.2026), в заказах их нет.
function bnResourceSheet(){
  openSheet({cap:'Узкие горлышки', title:'Ресурсы', icon:IC.flag,
    sub:'Только директору: у сотрудников это рычаг давления на систему',
    body:'<div class="ord-card">'+BN_RESOURCE.map((x,i)=>bnPlate('data-bnr="'+i+'"', x.kind, SQ_ESC(x.d), SQ_ESC(x.t))).join('')+'</div>',
    after: ()=>{ document.querySelectorAll('[data-bnr]').forEach(b=>b.addEventListener('click', ()=>bnSheet(BN_RESOURCE[+b.dataset.bnr], bnResourceSheet))); }});
}
function ordRow(c, i){
  const cur = c.current;
  const late = cur && cur.late;
  // Незапущенный заказ не идёт по этапам: у него очередь, а не «минус первый день».
  const sub = !c.started
    ? 'не запущен'+(c.waiting != null ? ' · в очереди '+c.waiting+' дн' : '')
    : cur
      ? cur.title+' · '+cur.days+'-й день'+(cur.plan ? ' из '+cur.plan : '')
      : 'все этапы закрыты';
  const pz = ordTasks(c);
  // Справа — дата покупателю: пятница и выходные сдвинуты на понедельник. У незапущенного это прогноз.
  const when = c.forecastCustomer || c.readyCustomer || c.ready;
  return '<button class="ord'+(late ? ' late' : '')+'" data-i="'+i+'">'+
    '<span class="ord-top"><b>'+SQ_ESC(c.order.name)+'</b>'+(c.demo ? '<span class="ord-pz">показательный</span>' : '')+
    (pz.length ? '<span class="ord-pz">п/з '+pz.map(SQ_ESC).join(', ')+'</span>' : '<span class="ord-pz">без п/з</span>')+
    '<span class="ord-d">'+(c.started ? '' : 'прогноз ')+ordDM(when)+(c.started ? ordDv(c.deviation) : '')+'</span></span>'+
    '<span class="ord-st">'+(c.order.state ? '<span class="ord-state">'+SQ_ESC(c.order.state)+'</span>' : '')+SQ_ESC(sub)+'</span>'+
    '<span class="ord-bar"><i style="width:'+ordBar(c)+'%"></i></span></button>';
}
// Плашка отклонения: минус и ноль — зелёные (опережение, в срок), плюс — красная (отставание в днях).
function ordDv(n, suffix){
  if(n === undefined || n === null) return '';
  const cls = n > 0 ? 'bad' : 'ok';
  const txt = n > 0 ? '+'+n+' дн' : (n < 0 ? '−'+Math.abs(n)+' дн' : (suffix || 'в срок'));
  return '<span class="dv '+cls+'">'+txt+'</span>';
}
function ordStage(s, c){
  const mark = s.state === 'skipped' ? '—' : (s.state === 'done' ? '✓' : (s.late ? '!' : '·'));
  // Справа: закрытый — дата и отклонение от нормы; открытый — прогноз и сдвиг относительно плана.
  const right = s.state === 'skipped' ? 'пропущен'
    : s.state === 'done' ? ordDM(s.done)+ordDv(s.delta)
    // Будущий этап — только прогноз даты, без плашки: накопленный сдвиг на нём читался как задание
    // «закончить быстрее» (директор 02.10). Отклонение есть у закрытых и у текущего, итог — в шапке.
    : (s.forecast ? 'прогноз '+ordDM(s.forecast)+(s.delta !== undefined ? ordDv(s.delta, 'идёт в срок') : '') : 'план до '+ordDM(s.deadline));
  const bn = BN[s.k];
  // Отметка руками (директор 02.10.2026): этап без документа в учёте закрывает его исполнитель.
  // Кнопку видит исполнитель этапа и директор; снять может автор отметки и директор.
  const me = currentUser ? currentUser.key : null;
  // Кнопка только на этапах, которые вообще отмечаются руками (owners с сервера: «в пути», «фасовка»);
  // директор может любой из них, но не те, что закрывает учёт.
  // Показательный заказ (00010): сотрудники в нём не работают, отметок нет; директор может.
  const demoLock = c && c.demo && me !== 'director';
  const canMark = me && !demoLock && (s.owners || []).length > 0 && (me === 'director' || s.owners.includes(me));
  const canUnmark = me && s.markedBy && (me === 'director' || me === s.markedByKey);
  // Отметка об уже закрытом этапе — пояснение к названию, остаётся в колонке текста.
  const markLine = s.state === 'done' && s.markedBy
    ? '<span class="b">отметил '+SQ_ESC(s.markedBy)+(s.markedAt ? ' '+ordDM(s.markedAt) : '')+(canUnmark ? ' · <button class="lnk" data-unmark="'+s.k+'">снять</button>' : '')+'</span>'
    : '';
  // Кнопки — отдельным рядом во всю ширину строки, иначе две пилюли встают в столбик в колонке 149 px.
  const markBtns = s.state === 'wait' && canMark
    ? '<span class="mk-row"><button class="mk-btn" data-mark="'+s.k+'">Отметить этап</button>'+
        // «Отложить» — только у фасовки: площадка назвала новый срок, причина обязательна (директор 02.10).
        (s.k === 'packing' ? '<button class="mk-btn" style="background:#ffcf3f;" data-postpone="'+s.k+'">Отложить</button>' : '')+'</span>'
    : '';
  // Срок, названный исполнителем (площадка перенесла фасовку): прогноз идёт от него, человек видит почему.
  const expLine = s.expectedNote ? '<span class="b">'+SQ_ESC(s.expectedNote)+'</span>' : '';
  return '<span class="os'+(s.state === 'done' ? ' ok' : '')+(s.late ? ' bad' : '')+(s.state === 'skipped' ? ' off' : '')+(bn ? ' warn' : '')+'">'+
    '<span class="m">'+mark+'</span>'+
    '<span class="t">'+s.title+'</span>'+
    '<span class="r">'+right+'</span>'+
    '<span class="sb"><span class="b">'+s.by+' · '+s.fact+'</span>'+expLine+markLine+'</span>'+
    markBtns+
    (bn ? bnPlate('data-bn="'+s.k+'"', bn.kind, SQ_ESC(bn.t)+' — '+SQ_ESC(bn.d)) : '')+
    '</span>';
}
function ordSheet(c){

  const fc = c.forecastReady || c.ready;
  const head = '<div class="cz-fact"><div class="between"><b style="font-size:12.5px;">Готовность</b><span><span class="ord-state big">'+ordDM(fc)+'</span>'+ordDv(c.deviation)+'</span></div>'+
    // План — первый прогноз при запуске (замороженный); отклонение в плашке считается от него.
    (c.baseline ? '<div class="muted" style="margin-top:6px;">План при запуске — '+ordDM(c.baseline)+(c.forecastReady && c.forecastReady !== c.baseline ? ', прогноз по фактам — '+ordDM(c.forecastReady) : ', прогноз совпадает')+'.</div>' : '')+
    '<div class="muted" style="margin-top:6px;">Старт '+ordDM(c.start)+' ('+(c.startedBy === 'статус' ? 'статус «В работе п/ф»' : c.startedBy === 'факт' ? 'по первому заданию, статус не проставлен' : 'прогноз от сегодня')+') · цикл '+plan+'.'+
    (c.setByHand ? ' В задании стоит '+ordDM(c.setByHand)+(c.setByHand === fc ? ', сходится с прогнозом.' : ', прогноз '+ordDM(fc)+'.') : '')+
    ((c.forecastCustomer || c.readyCustomer) && (c.forecastCustomer || c.readyCustomer) !== fc ? ' <b>Покупателю — '+ordDM(c.forecastCustomer || c.readyCustomer)+'</b>: выпуск, отгрузка и ТК в выходные не работают.' : '')+
    (c.waiting != null ? ' Ждал очереди '+c.waiting+' дн — это норма, не просрочка.' : '')+'</div></div>';
  const stages = '<div class="os-list">'+c.stages.map(s=>ordStage(s, c)).join('')+'</div>';
  // Разбора ошибок по документам здесь нет намеренно: пока заказ идёт, человеку нужен срок
  // и что сделать, а не перечень промахов. Разбор — после выполнения заказа.
  const pz = ordTasks(c);
  // Находок по заказу здесь нет: признаки (догруз, пятница, просрочка) — материал отчёта заказа,
  // к нему процесс не перешёл. Горлышки процесса стоят на этапах, одинаково для всех заказов.
  openSheet({cap:'Карта пути', title:'Заказ '+SQ_ESC(c.order.name), icon:IC.chart,
    sub:(c.demo ? 'показательный заказ · ' : '')+(pz.length ? 'п/з '+pz.map(SQ_ESC).join(', ')+' · ' : '')+(c.order.state || '')+(c.order.sum ? ' · '+ordMoney(c.order.sum) : ''),
    body:'<div class="ord-card">'+head+stages+'</div>',
    after: ()=>{
      document.querySelectorAll('[data-bn]').forEach(b=>b.addEventListener('click', ()=>bnSheet(BN[b.dataset.bn], ()=>ordSheet(c))));
      document.querySelectorAll('[data-mark]').forEach(b=>b.addEventListener('click', ()=>ordMarkSheet(c, b.dataset.mark)));
      document.querySelectorAll('[data-unmark]').forEach(b=>b.addEventListener('click', ()=>ordMarkSend(c, b.dataset.unmark, null, true)));
      document.querySelectorAll('[data-postpone]').forEach(b=>b.addEventListener('click', ()=>ordPostponeSheet(c)));

}
// «Отложить» фасовку: новая дата и причина. Прогноз сдвигается, отклонение считается, причина — площадка.

async function ordMarkSend(c, k, date, off, note){
  const err = document.getElementById('mkErr');
  try{
    await appApi('POST','/chain/mark', off ? {order:c.order.name, stage:k, off:true} : {order:c.order.name, stage:k, date, note: note || undefined});
    ORD = await appApi('GET','/chain?fresh=1');
    ordRender();
    const fresh = (ORD.orders || []).find(o=>o.order.name === c.order.name);
    if(fresh) ordSheet(fresh);
  }catch(e){
    const why = e.status === 403 ? 'Этот этап отмечает его исполнитель или директор.' : e.status === 503 ? 'Сервер без базы: отметка не сохранена.' : 'Не сохранилось: '+(e.message||'');
    if(err) err.textContent = why; else alert(why);
  }
}

// Деньги месяца должны быть под рукой там, где человек бывает каждый день, а бывает он на «Задачах»

// Второй копии правды при этом не появляется: строки и подробности рисует та же atOctHtml
// из тех же данных сервера (window.BONUS.oct), что и карточка премии на «Росте». Один владелец,
// два входа. Блок показывается только при включённой октябрьской конструкции (KPI_OCT):
// сентябрьскую лестницу, которая отменена, на второй экран не тащим.
const mpFmt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ')+' \u20bd';
function mpHtml(){
  const b = window.BONUS;
  if(!b || !b.oct) return '';
  const o = b.oct;
  // План месяца — это цифры плана, а не премии (решение директора 01.10). Деньги остаются
  // в подробностях и на «Росте»: на «Задачах» работник должен видеть, куда целиться.

  const docs = o.docsLimit === null || o.docsLimit === undefined
    ? {n:'—', l:'максимум ошибок в документах', s:'порог ставит директор'}
    // В плане стоит число баллов, а не штук документов: порог считается баллами, и подпись
    // не должна учить обратному. Формулировка плана — директорская, уточнение — под ней.
    : {n:String(o.docsLimit), l:'максимум ошибок в документах', s:'сейчас '+(b.points||0)+' '+AT_PL(b.points||0,'штрафной балл','штрафных балла','штрафных баллов')};
  const key = k => '<span class="mp-k"><span class="n">'+k.n+'</span><span class="l">'+k.l+'</span><span class="s">'+k.s+'</span></span>';
  const period = o.range ? o.range.from+' \u2013 '+o.range.to : b.month;
  return '<button class="mp" id="mpPlan">'+
    '<span class="mp-top"><span class="cz-cap" style="margin:0;">План месяца</span>'+
    '<span class="mp-per">'+period+'</span>'+
    '<span class="chv">'+ic('<polyline points="9 6 15 12 9 18"/>',14)+'</span></span>'+
    '<span class="mp-grid">'+key(inv)+key(docs)+'</span>'+
    '<span class="mp-note">Выполнены оба числа \u2014 премия '+mpFmt(o.total)+'. Нажмите: из чего она складывается и что её обнуляет.</span>'+
    '</button>';
}

};
const gdEsc = t => String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
// Лид с точкой — отдельной строкой; лид, который продолжается фразой, — в одну строку с хвостом.
function gdLead(x){
  if(!x.t) return '<div class="gd-k">'+gdEsc(x.b)+'</div>';
  if(/\.$/.test(x.b)) return '<div class="gd-k">'+gdEsc(x.b)+'</div><div class="gd-t">'+gdEsc(x.t)+'</div>';
  return '<div class="gd-k">'+gdEsc(x.b)+(/^[,.;:]/.test(x.t) ? '' : ' ')+'<span class="gd-ti">'+gdEsc(x.t)+'</span></div>';
}
// Заголовки и слово отметки может прислать сервер (гид «Марина в отпуске» для Леры, 08.10) — компонент тот же.
const gdAckWord = g => g.ackWord || 'Ознакомлен';
function gdBannerHtml(){
  const g = window.GUIDE;
  if(!g) return '';
  const banner = gdEsc(g.banner || GD_BANNER);
  // После «Ознакомлен» плашка не уходит до конца срока — становится белой строкой с временем отметки.
  if(g.ack) return '<button type="button" class="gd-bnr" id="gdOpen"><span class="bi">'+ic(GD_IC.ok,18)+'</span>'+

    '<button type="button" class="go" id="gdOpen">Открыть '+ic('<polyline points="9 6 15 12 9 18"/>',16)+'</button></div>';

function gdBind(root){
  const b = root && root.querySelector('#gdOpen');
  if(b) b.addEventListener('click', gdSheet);
}
function gdFoot(){
  const g = window.GUIDE;
  if(g.ack) return '<div class="gd-done">'+ic(GD_IC.ok,18)+' '+gdAckWord(g)+' '+gdEsc(g.ack.label)+'</div>';
  return '<button type="button" class="gd-ok" id="gdAck">'+ic(GD_IC.ok,18)+' '+gdAckWord(g)+'</button><div class="gd-hint">Время отметки увидит директор</div>';
}
function gdSheet(){
  const g = window.GUIDE;
  if(!g) return;
  const nh = gdEsc(g.newsHead || 'Что нового'), chh = gdEsc(g.changesHead || 'Что изменилось');
  const news = '<div class="gd-hd" id="gdNew"><b>'+nh+'</b><span class="ct">'+g.news.length+'</span></div><div class="gd-src">'+gdEsc(g.newsSrc || 'приложение · общее для всех')+'</div>'+
    '<div class="gd-lst">'+g.news.map(x=>'<div class="gd-rr"><span class="gd-ni">'+ic(GD_IC[x.icon] || GD_IC.modes,14)+'</span><div>'+gdLead(x)+'</div></div>').join('')+'</div>';
  // Номера у «Что изменилось» — адреса пунктов («см. пункт 5»), а не порядок выполнения.
  const changes = g.changes.length ? '<div class="gd-hd" id="gdRole"><b class="acc">'+chh+'</b><span class="ct">'+g.changes.length+'</span></div><div class="gd-src">'+gdEsc(g.changesSrc || 'правила вашей роли')+'</div>'+
    (g.scheme ? CHAIN_NOTE() : '')+
    '<div class="gd-lst">'+g.changes.map((x,i)=>'<div class="gd-rr"><span class="gd-n">'+(i+1)+'</span><div>'+gdLead(x)+'</div></div>').join('')+'</div>' : '';
  // Гид со своими заголовками (отпуск Марины) — сначала «что переходит», потом «не ваше».
  const own = !!g.changesHead;
  const jumpBtn = (to, t, n) => '<button type="button" data-to="'+to+'">'+t+' <i>'+n+'</i></button>';
  const jump = g.changes.length ? '<div class="gd-jmp">'+(own ? jumpBtn('gdRole', chh, g.changes.length) + jumpBtn('gdNew', nh, g.news.length) : jumpBtn('gdNew', nh, g.news.length) + jumpBtn('gdRole', chh, g.changes.length))+'</div>' : '';
  openSheet({cap: g.cap || 'Роль изменена', title: g.title || 'Ваша роль изменена', icon:GD_IC.role,
    sub: g.sub || (g.changes.length ? 'что нового и что изменилось' : 'что нового в приложении'),
    body: jump + (own ? changes + news : news + changes) + '<div class="gd-foot" id="gdFoot">'+gdFoot()+'</div>',
    after: body => {
      body.querySelectorAll('.gd-jmp button').forEach(b => b.addEventListener('click', () => {
        const t = document.getElementById(b.dataset.to);
        if(t) t.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start'});
      }));
      gdBindFoot();
    }});
}
// «Ознакомлен» → 5 секунд «Отмечено · Отменить» → запись на сервере. Отмена до записи, откатывать нечего.
let GD_TIMER = null;
function gdBindFoot(){
  const btn = document.getElementById('gdAck');
  if(!btn) return;
  btn.addEventListener('click', () => {
    const foot = document.getElementById('gdFoot');
    let left = 5;
    foot.innerHTML = '<div class="gd-undo" role="status">'+ic(GD_IC.ok,18)+' Отмечено <span class="sec" id="gdSec">5</span><button type="button" class="u" id="gdUndo">Отменить</button></div>';
    try{ tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred('light'); }catch(e){}
    clearInterval(GD_TIMER);
    document.getElementById('gdUndo').addEventListener('click', () => { clearInterval(GD_TIMER); foot.innerHTML = gdFoot(); gdBindFoot(); });
    GD_TIMER = setInterval(async () => {
      left--;
      const s = document.getElementById('gdSec');
      if(s) s.textContent = left;
      if(left > 0) return;
      clearInterval(GD_TIMER);
      try{
        const r = await fetch(apiBase()+'/guide/ack', {method:'POST', headers:{Authorization:'tma '+tgInit(), 'Content-Type':'application/json'}, body: JSON.stringify({version: window.GUIDE.version})});
        if(!r.ok) throw new Error('http '+r.status);
        const out = await r.json();
        window.GUIDE.ack = out.ack;
        const f = document.getElementById('gdFoot');
        if(f) f.innerHTML = gdFoot();
        if(typeof window.TD_RENDER === 'function') window.TD_RENDER();
      }catch(e){
        const f = document.getElementById('gdFoot');
        if(f){ f.innerHTML = gdFoot() + '<div class="gd-hint bad">Отметка не записалась. Нажмите ещё раз.</div>'; gdBindFoot(); }
      }
    }, 1000);
  });
}

// ===== Окно «Что такое матрёшка?» (решение директора 06.10.2026, вариант А «вложенные рамки») =====
// Рисунок в нумерации 06.10: подготовка 1–7 сверху вниз, выполнение 8–13 снизу вверх, 13 — выход наружу.
// Номера и названия шагов в подписи — из FLOW, не копией: перенумеруют шаги — подпись поедет вместе с ними.
// Координаты рамок и кружков — ручные; шаги на рисунке переставлять только вместе с FLOW.
// ponytail: высоты рамок подобраны под ширину 375 px; на 320 px подписи в п/з ГП могут упереться в низ рамки — тогда считать высоты по замеру текста после отрисовки.
const MT_ICON = '<g transform="translate(6.6 2.2) scale(.108)"><path stroke-width="17" d="M50 0 C72 0 82 16 80 34 C79 44 74 50 72 54 C92 66 100 92 98 118 C96 146 80 160 50 160 C20 160 4 146 2 118 C0 92 8 66 28 54 C26 50 21 44 20 34 C18 16 28 0 50 0 Z"/></g>';
function mtDraw(){

    '<i class="mt-rail l"></i><i class="mt-rail r"></i>'+
    '<div class="mt-f o"><div class="mt-c">Заказ покупателя</div><div class="mt-x">Заказ покупателя. На выходе — отгрузка и счёт покупателю</div></div>'+
    '<div class="mt-f g"><div class="mt-c">П/з ГП · готовая продукция</div><div class="mt-x">Производственное задание · «Выполнение этапа» — выпуск ГП</div></div>'+
    '<div class="mt-f p l"><div class="mt-c">П/з п/ф</div><div class="mt-nm">Концентрат</div></div>'+
    '<div class="mt-f p r"><div class="mt-c">П/з п/ф</div><div class="mt-nm">Основа</div></div>'+
    '<div class="mt-x mt-in" style="top:344px;">У каждого своё п/з · «Выполнение этапа» по сменам</div>'+
    '<div class="mt-x mt-in" style="top:408px;"><b>Премикс — не слой.</b> Только по согласованию директора</div>'+
    '<div class="mt-x mt-in mt-ln" style="top:458px;">Между уровнями — перемещения: выдача материалов, отправка на площадку</div>'+
    n(1,'l',66)+n(2,'l',98)+n(3,'l',176)+n(4,'l',206)+n(5,'l',236)+n(6,'l',286)+
    n(13,'r',0)+'<div class="mt-out"><b>Отгрузка — выход наружу</b><br><span>со склада площадки</span></div>'+
    n(12,'r',176)+n('11а','r',206)+n(11,'r',236)+n(10,'r',274)+n(9,'r',306)+
    '<div class="mt-bar"><span class="mt-n in">7</span><span class="t">'+mtTitle('7')+'</span><span class="ar">→</span><span class="mt-n in r">8</span><span class="t">'+mtTitle('8')+'</span></div>'+
    '</div>';
}
function mtTitle(num){
  for(const b of FLOW) for(const s of b.steps) if(s.n === num) return s.title;
  return '';
}
function mtLegend(b, dir){
  const first = b.steps[0].n, last = b.steps[b.steps.length-1].n;
  return '<div class="mt-col"><div class="mt-pill '+dir+'">'+(dir === 'dn' ? '↓ Подготовка ' : '↑ Выполнение ')+first+'–'+last+'</div>'+
    b.steps.map(s => '<div class="mt-li"><b>'+s.n+'</b><span>'+s.title+'</span></div>').join('')+'</div>';
}
function mtSheet(){
  openSheet({cap:'Эталон п/з', title:'Что такое матрёшка?', icon:MT_ICON, sub:'Три уровня документов · шаги 1–13',
    body: mtDraw()+
      '<div class="mt-leg">'+mtLegend(FLOW[0],'dn')+mtLegend(FLOW[1],'up')+'</div>'+
      '<div class="cz-note"><div class="cz-cap">Где граница половин</div><div class="cz-txt">Не «бумага против физики», а выданы материалы в производство или ещё нет. Концентрат и основа — каждый отдельным <span style="white-space:nowrap">п/з</span>, вместе в одном нельзя.</div></div>'});
}

function tkCard(t, canAct){
  return '<div class="tk-sw'+(canAct ? '' : ' flat')+'" data-key="'+tkEsc(t.key)+'">'+
    (canAct ? '<div class="tk-bg"><span class="l">Выполнено</span><span class="r">Нужна информация</span></div>' : '')+
    '<div class="tk-card"><div class="tk-t">'+tkEsc(t.title)+'</div>'+
    '<div class="tk-meta"><span class="tag">'+tkEsc(t.key)+'</span><span class="due'+(t.due && TKS && t.due < TKS.today ? ' late' : '')+'">'+(t.due ? 'срок '+tkDay(t.due) : 'без срока')+'</span>'+
    '<button class="tk-go" data-url="'+tkEsc(t.url)+'" aria-label="Открыть в Трекере">'+ic('<path d="M14 3h7v7"/><path d="M10 14 21 3"/><path d="M21 14v7H3V3h7"/>',14)+'</button></div></div></div>';
}
const tkEmpty = t => '<div class="cz-fact"><b style="font-size:12.5px;">'+t+'</b></div>';

function renderTasksBody(){
  const t = TKS.tasks, today = TKS.today;
  const week = tkWeek(today);
  const byDay = {};
  tkAll(t).forEach(x=>{ if(x.due){ (byDay[x.due] = byDay[x.due] || []).push(x); } });
  const strip = '<div class="wk">'+week.map(d=>{
    const n = (byDay[d] || []).length;
    const late = d < today && n;
    return '<button class="wk-d'+(d===TK_DAY ? ' on' : '')+(d===today ? ' now' : '')+'" data-d="'+d+'">'+
      '<span class="wd">'+TK_WD[week.indexOf(d)]+'</span><span class="dn">'+Number(d.slice(8,10))+'</span>'+
      '<i class="'+(n ? (late ? 'late' : 'has') : '')+'"></i></button>';
  }).join('')+'</div>';

  const dayList = (byDay[TK_DAY] || []);
  const dayName = TK_DAY === today ? 'На сегодня' : 'На '+tkDay(TK_DAY);
  const overdue = t.overdue.filter(x=>x.due !== TK_DAY);
  const sec = (lab, html, bad) => '<div class="tk-sec"><div class="tk-lab'+(bad ? ' bad' : '')+'">'+lab+'</div>'+html+'</div>';
  const parts = [];
  // Просроченное показываем всегда, даже когда открыт другой день: прятать его переключением дня нельзя.
  if(overdue.length) parts.push(sec('Осталось с прошлых дней — '+nTask(overdue.length), overdue.map(x=>tkCard(x,true)).join(''), true));
  parts.push(sec(dayName+' — '+(dayList.length ? nTask(dayList.length) : 'пусто'),
    dayList.length ? dayList.map(x=>tkCard(x,true)).join('') : tkEmpty(TK_DAY === today ? 'На сегодня задач нет.' : 'На этот день задач нет.')));
  if(t.noDue.length) parts.push(sec('Без срока — '+nTask(t.noDue.length), t.noDue.map(x=>tkCard(x,true)).join('')));
  return strip+parts.join('');
}

// Свайп по карточке: вправо — «Выполнено», влево — «Нужна информация».
// Запрос уходит не сразу: пять секунд внизу висит «Отменить». Так необратимое действие
// отменяется до того, как случится, и не приходится откатывать статус в Трекере.
function tkTrim(){
  document.querySelectorAll('#tkBody .tk-sec').forEach(sec=>{
    const cards = [...sec.querySelectorAll('.tk-sw')];
    const alive = !cards.length || cards.some(c=>c.style.display !== 'none');
    sec.style.display = alive ? '' : 'none';
  });
}
function bindSwipe(el){
  const card = el.querySelector('.tk-card');
  let x0 = null, dx = 0;
  const done = () => { card.style.transition = ''; el.classList.remove('to-done','to-info'); };
  el.addEventListener('pointerdown', e=>{ x0 = e.clientX; dx = 0; card.style.transition = 'none'; try{ el.setPointerCapture(e.pointerId); }catch(err){} });
  el.addEventListener('pointermove', e=>{
    if(x0 === null) return;
    dx = e.clientX - x0;
    card.style.transform = 'translateX('+dx+'px)';
    el.classList.toggle('to-done', dx > 12);
    el.classList.toggle('to-info', dx < -12);
  });
  const end = ()=>{
    if(x0 === null) return;
    const th = Math.min(120, el.offsetWidth * 0.3);
    const act = dx > th ? 'done' : dx < -th ? 'needinfo' : null;
    x0 = null; done();
    if(!act){ card.style.transform = ''; return; }
    card.style.transform = 'translateX('+(act === 'done' ? '110%' : '-110%')+')';
    try{ tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred('light'); }catch(err){}
    setTimeout(()=>{ el.style.display = 'none'; tkTrim(); }, 180);
    tkPending(el, act);
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}

let TK_TIMER = null;
function tkPending(el, action){
  const key = el.dataset.key;
  const bar = document.getElementById('tkUndo');
  const label = action === 'done' ? 'Закрыто' : 'Отмечено «нужна информация»';
  bar.innerHTML = '<span>'+label+' · '+tkEsc(key)+'</span><button type="button" id="tkUndoBtn">Отменить</button>';
  bar.classList.add('on');
  clearTimeout(TK_TIMER);
  const restore = ()=>{ bar.classList.remove('on'); el.style.display = ''; el.querySelector('.tk-card').style.transform = ''; tkTrim(); };
  document.getElementById('tkUndoBtn').addEventListener('click', ()=>{ clearTimeout(TK_TIMER); restore(); });
  TK_TIMER = setTimeout(async ()=>{
    bar.classList.remove('on');
    try{
      const r = await fetch(apiBase()+'/tasks/action', {method:'POST', headers:{Authorization:'tma '+tgInit(), 'Content-Type':'application/json'}, body: JSON.stringify({key, action})});
      if(!r.ok) throw new Error('http '+r.status);
      await loadTasks(true);
    }catch(e){
      restore();
      bar.innerHTML = '<span>Трекер не принял изменение. Задача на месте.</span>';
      bar.classList.add('on');
      setTimeout(()=>bar.classList.remove('on'), 4000);
    }
  }, 5000);
}

async function loadTasks(silent){
  const url = apiBase();
  let data = null;
  if(url && tgInit()){
    try{
      const r = await fetch(url+'/tasks', {headers:{Authorization:'tma '+tgInit()}});
      if(r.ok) data = await r.json();
    }catch(e){}
  }
  if(!data){
    if(silent) return;
    const el = document.getElementById('s-tasks');
    // План месяца не из Трекера: он остаётся на экране и когда задачи не пришли.
    el.innerHTML = CZ_HEAD('Задачи','Трекер PR-VO')+mpHtml()+
      '<div class="attn col"><div class="eb">Задачи не загружены</div><p>Трекер сейчас недоступен. Это не значит «задач нет» — откройте очередь PR-VO в Трекере.</p></div>'+
      TASK_STATUSES+'<div class="pill lime" id="openTracker" style="justify-content:center;width:100%;text-align:center;margin:12px 0 10px;cursor:pointer;">Открыть в Трекере</div>';
    mpBind();
    document.getElementById('openTracker').addEventListener('click', ()=>tkOpen(TRACKER_URL));
    return;
  }
  TKS = data;
  if(data.score) window.DISCIPLINE = data.score;
  if(!TK_DAY || !tkWeek(data.today).includes(TK_DAY)) TK_DAY = data.today;
  if(data.byEmployee) renderTasksDirector(); else renderTasksScreen();
}

// Закрытие тура, поднятое из showWhatsNew: им пользуется перехват системной «Назад» (atHookBack).
let NT_CLOSE = null;
function showWhatsNew(){
  const host = document.getElementById('newTour');
  if(!host) return;
  host.innerHTML = '<div class="nt-in">'+
    '<div class="nt-track" id="ntTrack">'+NEW_SLIDES.map((s,i)=>'<section class="nt-s">'+
      '<div class="nt-art"'+(s.bg ? ' style="background:'+s.bg+'"' : '')+'>'+(s.art ? s.art : '<img src="assets/cards/'+s.img+'.webp?v='+window.ASSET_V+'" alt="" draggable="false">')+'</div>'+
      '<div class="nt-t">'+s.t+'</div><p class="nt-p">'+s.p+'</p>'+
      (i === NEW_SLIDES.length - 1 ? '<button class="nt-go" type="button" id="ntGo">Приступить к работе</button>' : '<div class="nt-hint">Листайте дальше</div>')+
    '</section>').join('')+'</div>'+
    '<div class="nt-dots">'+NEW_SLIDES.map((s,i)=>'<button type="button" aria-label="'+s.t+'"'+(i === 0 ? ' class="on"' : '')+'></button>').join('')+'</div>'+
    '<button class="nt-skip" type="button" id="ntSkip">Пропустить</button>'+
  '</div>';
  host.classList.add('open');
  const track = document.getElementById('ntTrack'), dots = [...host.querySelectorAll('.nt-dots button')];
  track.addEventListener('scroll', ()=>{
    const i = Math.round(track.scrollLeft / track.clientWidth);
    dots.forEach((d,n)=>d.classList.toggle('on', n === i));
  }, {passive:true});
  dots.forEach((d,i)=>d.addEventListener('click', ()=>track.scrollTo({left:i*track.clientWidth, behavior:'smooth'})));
  // Закрытие отдаём наружу: системная «Назад» должна закрывать тур, а не сворачивать приложение.
  const close = ()=>{ newMark(); host.classList.remove('open'); NT_CLOSE = null; setTimeout(()=>{ host.innerHTML = ''; }, 250); };
  NT_CLOSE = close;
  document.getElementById('ntGo').addEventListener('click', close);
  document.getElementById('ntSkip').addEventListener('click', close);
}

  catch(e){ box.innerHTML = '<div class="cz-note"><div class="cz-cap">Не получилось</div><div class="cz-txt">Мой Склад сейчас недоступен, список перемещений не пришёл. Это не значит, что перемещений нет.</div></div>'; return; }
  const moves = (d && d.moves) || [];
  if(!moves.length){ box.innerHTML = '<div class="cz-fact"><b style="font-size:12.5px;">Сегодня перемещений не создавали.</b><div class="muted" style="margin-top:4px;">Появится — придёт сообщение от бота.</div></div>'; return; }
  box.innerHTML = moves.map(m=>'<button class="pk-doc" data-id="'+m.id+'">'+
    '<span class="pk-n">'+tkEsc(m.name)+'</span>'+
    '<span class="pk-w">'+tkEsc(m.from || '—')+' → '+tkEsc(m.to || '—')+' · '+m.positions+' поз.</span>'+
    (m.state ? '<span class="pk-st'+(m.state === 'picking' ? ' go' : '')+'">'+PK_STATE[m.state]+(m.state === 'picking' ? ' · '+m.done+' из '+m.positions : '')+'</span>' : '')+
    '</button>').join('');
  box.querySelectorAll('.pk-doc').forEach(b=>b.addEventListener('click', ()=>pkOpen(box, b.dataset.id)));
}

async function pkOpen(box, docId){
  box.innerHTML = LOADING;
  let r;
  try{ r = await pkApi('/start', {docId}); }
  catch(e){ box.innerHTML = '<div class="cz-note"><div class="cz-cap">Не получилось</div><div class="cz-txt">Сборку начать не удалось. Попробуйте ещё раз.</div></div>'; return; }
  pkRender(box, r.session);
}

// Факт против расчёта: ok — ровно, short — меньше, over — больше (кратность тары, не ошибка).
const pkTone = (fact, plan) => Number(fact) === Number(plan) ? 'ok' : Number(fact) < Number(plan) ? 'short' : 'over';

// Шапка сборки: сколько отмечено, недобор и перебор по таре.
function pkHead(s){
  const open = s.state === 'picking';
  const marked = s.items.filter(i=>i.done);
  const short = marked.filter(i=>pkTone(i.fact, i.plan) === 'short').length;
  const over = marked.filter(i=>pkTone(i.fact, i.plan) === 'over').length;
  const head = '<div class="cz-note" style="margin-bottom:12px;"><div class="cz-cap">'+tkEsc(s.docName)+' · '+(PK_STATE[s.state] || s.state)+'</div>'+
    '<div class="now-sum"><span><b>'+s.done+'</b> из '+s.total+'</span>'+
    (short ? '<span><b>'+short+'</b> меньше расчёта</span>' : '')+
    (over ? '<span><b>'+over+'</b> больше — по таре</span>' : '')+
    (!short && !over ? '<span>всё по расчёту</span>' : '')+'</div>'+
    (open && s.done ? '<div class="cz-txt" style="margin-top:6px;opacity:.75;">Количество в строке можно исправить, пока не нажата «Сборка закончена».</div>' : '')+'</div>';
  return head;
}

function pkRender(box, s){
  const left = s.total - s.done;
  const open = s.state === 'picking';
  const head = pkHead(s);
  // Пока сборка открыта, каждая строка — поле: отмеченную можно исправить (Арсений 09.10).
  // После «Сборка закончена» строки только читаются — дальше правда в Мой Складе.
  const row = i => '<div class="pk-row'+(i.done ? ' done' : '')+'" data-pos="'+i.pos+'" data-plan="'+i.plan+'"'+(i.done ? ' data-fact="'+i.fact+'"' : '')+'>'+
    // Код товара — первым: по нему ищут на полке (директор 09.10). У сборки, начатой до выкатки, кода нет.
    '<span class="pk-t" title="'+tkEsc(i.name)+'">'+(i.code ? '<span class="pk-code">('+tkEsc(i.code)+')</span>' : '')+tkEsc(i.name)+'</span>'+
    '<span class="pk-plan">'+i.plan+'</span>'+
    (!open
      ? '<span class="pk-fact '+pkTone(i.fact, i.plan)+'">'+i.fact+'</span>'
      // Кнопок в строке нет: товар, расчёт, поле. Число сохраняется само, когда палец ушёл из поля
      // (директор 09.10 — кнопки удлиняли строку и прятали наименование).
      : '<input class="pk-in'+(i.done ? ' '+pkTone(i.fact, i.plan) : '')+'" type="number" inputmode="decimal" min="0" step="any"'+(i.done ? ' value="'+i.fact+'"' : '')+' aria-label="Сколько собрано '+tkEsc(i.name)+'">')+
    '</div>';
  const foot = s.state === 'picking'
    ? '<button class="pill lime pk-fin" type="button" style="justify-content:center;width:100%;margin-top:12px;'+(left ? 'opacity:.45;' : '')+'">'+(left ? 'Осталось '+left : 'Сборка закончена')+'</button>'
    : s.state === 'picked'
      ? '<div class="cz-note" style="margin-top:12px;"><div class="cz-cap">Перенесите в Мой Склад</div><div class="cz-txt">Внесите собранное количество в документ своей учёткой и отметьте здесь. Пока не внесено, перемещение считается расчётным, а не фактическим.</div></div>'+
        '<button class="pill lime pk-ent" type="button" style="justify-content:center;width:100%;margin-top:10px;">Внёс в Мой Склад</button>'
      : '<div class="cz-fact" style="margin-top:12px;"><b style="font-size:12.5px;">'+(s.state === 'entered' ? 'Отмечено как внесённое.' : 'Документ проведён, перемещение уехало.')+'</b><div class="muted" style="margin-top:4px;">Аудитор сверит сборку с документом и напомнит, если что-то разошлось.</div></div>';
  box.innerHTML = head+'<div class="pk-list">'+s.items.map(row).join('')+'</div>'+foot+
    '<button class="pk-back" type="button">← К списку перемещений</button>';

  // Набранное, но не сохранённое: новая строка с числом или исправленная отмеченная.
  const dirty = r => { const i = r.querySelector('.pk-in'); return !!i && i.value !== '' && (r.dataset.fact == null || Number(i.value) !== Number(r.dataset.fact)); };
  box.querySelectorAll('.pk-row').forEach(r=>{
    const inp = r.querySelector('.pk-in');
    if(!inp) return;
    // Цвет — сразу по мере ввода, чтобы недобор был виден до нажатия.
    inp.addEventListener('input', ()=>{
      inp.classList.remove('ok','short','over');
      if(inp.value !== '') inp.classList.add(pkTone(inp.value, r.dataset.plan));
    });
    const send = async ()=>{
      if(!dirty(r)) return;
      try{
        const out = await pkApi('/mark', {docId:s.docId, pos:Number(r.dataset.pos), fact:Number(inp.value)});
        // Список не перерисовываем: палец уже в следующем поле, перерисовка сбросила бы его ввод.
        // Обновляем только эту строку, шапку и кнопку внизу.
        r.dataset.fact = out.session.items.find(i=>String(i.pos) === r.dataset.pos).fact;
        r.classList.add('done');
        const left = out.session.total - out.session.done;
        box.querySelector('.cz-note').outerHTML = pkHead(out.session);
        const f = box.querySelector('.pk-fin');
        if(f && !box.pkClosing){ f.textContent = left ? 'Осталось '+left : 'Сборка закончена'; f.style.opacity = left ? '.45' : ''; }
      }
      catch(e){ const f = box.querySelector('.pk-fin'); if(f) f.textContent = 'Строка не сохранилась — проверьте связь'; }
    };
    inp.addEventListener('change', send);
    inp.addEventListener('keydown', e=>{ if(e.key === 'Enter'){ e.preventDefault(); inp.blur(); } });
  });
  const fin = box.querySelector('.pk-fin');
  if(fin) fin.addEventListener('click', async ()=>{
    // Исправление, которое ещё не ушло на сервер, сохраняем первым: иначе документ закрылся бы со старым числом.
    box.pkClosing = true;
    try{
      for(const r of [...box.querySelectorAll('.pk-row')].filter(dirty))
        await pkApi('/mark', {docId:s.docId, pos:Number(r.dataset.pos), fact:Number(r.querySelector('.pk-in').value)});
    }catch(e){ box.pkClosing = false; fin.textContent = 'Исправление не сохранилось — проверьте связь'; return; }
    try{ const out = await pkApi('/finish', {docId:s.docId}); box.pkClosing = false; pkRender(box, out.session); }
    catch(e){ box.pkClosing = false; fin.textContent = 'Отметьте все позиции'; }
  });
  const ent = box.querySelector('.pk-ent');
  if(ent) ent.addEventListener('click', async ()=>{
    try{ const out = await pkApi('/entered', {docId:s.docId}); pkRender(box, out.session); }
    catch(e){ ent.textContent = 'Не сохранилось'; }
  });
  box.querySelector('.pk-back').addEventListener('click', ()=>{ box.innerHTML = LOADING; pkList(box); });
}

// ===== «Сейчас»: операции сотрудника =====
// Экран отвечает на вопрос «что я делаю», а не «где я в процессе» (решение директора 22.09).
// Показываем только свои операции: чужие в цеху не нужны. Частое — чёрной плиткой, редкое — стеклянной,
// лайм остаётся акцентом, а не заливкой.
let OPS = [];
const opMine = (o, u) => !!(u && o.keys && o.keys.indexOf(u.key) > -1);

// Шаг по номеру. Подшаги 7.1–7.3 лежат внутри шага 7, поэтому ищем и там:
// сквозная нумерация 1–13 (с 06.10.2026) от разбивки не меняется, а адресовать подшаг операции нужно.
function findStep(n){
  for(const f of FLOW){
    for(const s of f.steps){
      if(s.n === n) return s;
      const sub = (s.subs || []).find(x=>x.n === n);
      if(sub) return sub;
    }
  }
  return null;
}

function opSteps(o){
  const parts = [];
  if((o.scen || []).length){
    parts.push(PR_DRAFT);
  }
  // Операция вне цикла 1–13 (инвентаризация): пустой список шагов читался как «шаг не назначен»,
  // хотя шага у неё и не должно быть. Пишем это словами, а не пустотой.
  if(o.outside){
    parts.push('<div class="cz-note"><div class="cz-cap">Вне цикла 1–13</div><div class="cz-txt">'+o.outside+'</div></div>');
  }
  if(o.gap){
    parts.push('<div class="cz-note"><div class="cz-cap">Чек-листа нет</div><div class="cz-txt">Порядка шагов в эталоне процесса на эту операцию нет. Ниже собрано из правил документа — это не проверенный порядок. Спорное — к директору.</div></div>');
  }
  (o.scen || []).forEach(q=>{
    const g = (SCEN || []).find(x=>(x.items||[]).some(i=>i.q === q));
    const it = g && g.items.find(i=>i.q === q);
    if(!it) return;
    parts.push(czLabel('ok', it.q)+'<ol class="cz-ol">'+it.steps.map(t=>'<li>'+t+'</li>').join('')+'</ol>');
  });
  (o.steps || []).forEach(n=>{
    const st = findStep(n);
    if(!st) return;
    parts.push(czItem('<b>Шаг '+st.n+'. '+st.title+'</b>'+(st.desc ? ' — '+st.desc : ''), 'ok'));
    // full — разворачиваем шаг целиком прямо в операции. Нужно там, где сценарного чек-листа нет,
    // а одной строки мало: у отгрузки это основание, триггер, правка по «доступно» и два запрета.
    if(o.full) parts.push('<div class="op-detail">'+stepBody(st)+'</div>');
  });
  if(o.gap){
    (o.docs || []).forEach(k=>{
      const d = DOCS[k];
      if(!d) return;
      parts.push(czLabel('ok','Что известно')+czSentences(d.rule).map(t=>czItem(t,'ok')).join(''));
      parts.push(czLabel('bad','Нельзя')+(d.bad||[]).map(b=>czItem(withRev(b),'bad')).join(''));
    });
  }
  return parts.join('');
}

function opSheet(o, u){
  const docs = (o.docs || []).filter(k=>DOCS[k]);
  openSheet({
    cap: o.gap ? 'Операция · чек-листа нет' : 'Операция',
    title: o.title,
    sub: (opMine(o,u) ? 'Делаете вы · ' : 'Делает: ')+o.who,
    icon: IC.step,
    body: opSteps(o)+(docs.length ? czLabel('ok','Документы')+'<div class="cz-links">'+docs.map(k=>'<button class="cz-link" data-doc="'+k+'">'+DOCS[k].title+' '+ic('<polyline points="9 6 15 12 9 18"/>',13)+'</button>').join('')+'</div>' : '')+
      (o.key === 'give' ? '<button class="pk-start" id="pkStart" type="button">Приступить</button>' : ''),
    after: box => {
      box.querySelectorAll('.cz-link').forEach(b=>b.addEventListener('click', ()=>openDoc(b.dataset.doc)));
      const pk = box.querySelector('#pkStart');
      if(pk) pk.addEventListener('click', pkSheet);
    }
  });
}

function renderNow(u){
  const body = document.getElementById('prBody');
  const mine = OPS.filter(o=>opMine(o,u));
  const list = mine.length ? mine : OPS; // роль не определилась — показываем всё, а не пустоту
  const gaps = list.filter(o=>o.gap).length;
  const head = '<div class="cz-note" style="margin-bottom:12px;"><div class="cz-cap">Ваши операции</div>'+
    '<div class="now-sum"><span><b>'+list.length+'</b> операций</span>'+(gaps ? '<span><b>'+gaps+'</b> без чек-листа</span>' : '<span>чек-листы есть у всех</span>')+'</div>'+
    '<div class="cz-txt" style="margin-top:8px;opacity:.8;">Порядок шагов сверку Аудитором ещё не прошёл — это черновик, а не правило.</div>'+
    (mine.length ? '' : '<div class="cz-txt" style="margin-top:6px;">Роль не определена, показаны все операции процесса.</div>')+'</div>';
  const tile = o => '<button class="op'+(o.accent === 'lime' ? ' lime' : o.freq === 'often' ? ' hot' : '')+'" type="button" data-k="'+o.key+'">'+
    '<span class="op-t">'+o.title+'</span>'+
    '<span class="op-w">'+o.who+'</span>'+
    (o.gap ? '<span class="op-gap">чек-листа нет</span>' : '')+'</button>';
  body.innerHTML = head+'<div class="op-grid">'+list.map(tile).join('')+'</div>'+
    '<div class="honest" style="margin:10px 4px 0;">Чаще всего — чёрные. Остальное — светлые. Порядок по ходу процесса.</div>';
  body.querySelectorAll('.op').forEach(b=>b.addEventListener('click', ()=>{
    const o = OPS.find(x=>x.key === b.dataset.k);
    if(o) opSheet(o, u);
  }));
}

// ===== Экран «Процесс»: справочник вкладками =====
// Решение 22.09: пять разделов лежали одной лентой без приоритета — теперь по одному за раз.
// Режим «Работа» (экран от действия) добавится следующим этапом, тогда над вкладками появится переключатель.
// Слово «проект» с 25.09.2026 занято: так помечается задуманное, но не объявленное (см. projNote).
// Здесь речь о другом — чек-лист написан, но не сверен, поэтому называем его черновиком.
// Одно слово на два смысла на одном экране сотрудник разбирать не будет.
const PR_DRAFT = '<div class="cz-note" style="margin-bottom:12px;"><div class="cz-cap">Черновик, не правило</div>'+
  '<div class="cz-txt">Чек-листы писались под Антона и сверку Аудитором ещё не прошли: два шага уже нашлись неверными для Михаила и Арсения. Пользуйтесь как подсказкой, а не как основанием; спорное — к директору.</div></div>';
const PR_MOVE_ALWAYS = '<div class="attn col"><div class="eb">Всегда, при любом движении</div>'+
  '<p style="margin:0;font-size:12.5px;line-height:1.5;">Две подписи от руки — «сдал» и «принял». Затем фото подписанного документа в чат «Документы» — в день движения, до конца смены. PDF из программы фото не заменяет — в нём нет подписей.</p></div>';
const PR_TABS = [
  {k:'docs',  t:'Документы',              head:'Памятка документы',        sub:'Правила, запреты и прошлые ошибки по каждому документу', body:'<div id="docBlocks"></div>',   mount:()=>renderDocBlocks()},
  {k:'flow',  t:'Эталон п/з',             head:'Эталонный процесс п/з',    sub:'Редакция 19.09.2026, правки 06.10 · шаги 1–13',            body:'<div id="flowBlocks"></div>',  mount:()=>renderFlow()},
  {k:'sfp',   t:'Выпуск п/ф',             head:'Выпуск полуфабриката',     sub:'Шесть шагов · формулировка директора 30.09.2026',      body:'<div id="sfpBlocks"></div>', mount:()=>renderSfp()},
  {k:'move',  t:'Движение',               head:'Движение документов',      sub:'Откуда, куда, в чём работаем, что печатаем и когда',                   body:'<div id="moveMap"></div>'+PR_MOVE_ALWAYS, mount:()=>renderMoveMap()},
  {k:'rules', t:'Правила',                head:'Общие правила',            sub:'Действуют для любого документа',                       body:'<div id="ruleAccordion"></div>', mount:()=>renderRules()}
];

// ===== Выпуск полуфабриката: шесть шагов =====
// Последовательность продиктована директором 30.09.2026 дословно:
// произведено → перелито → промаркировано → взвешано → поправлено в «Выполнении этапа» →
// перемещено на «Основной склад». Это выпуск П/Ф, а не готовой продукции: решение 25.09
// «ГП на основной склад не возвращается» относится к готовой продукции и отгрузке
// со складов группы СТМ — другой контур, он здесь не затрагивается.
//
// Смысл блока — два шага, которые пропускают. Ошибка описана директором так:
// «выпустить всё как есть, не взвешать, никому не передать». Это механика нарушения
// «задание проведено скопом» по п/з 00066 и 00067, за которое начислено по −3.
const SFP_STEPS = [
  {t:'Произведено', d:'Полуфабрикат сварен по техкарте задания. Работа идёт по шаблону п/з с материалами, а не по нормам техкарты: списывается то, что выдано перемещением.'},
  {t:'Перелито',    d:'Продукт перелит в тару, в которой он будет храниться и уедет дальше. До этого шага вес снимать бессмысленно: часть остаётся в оборудовании.'},
  {t:'Промаркировано', d:'На таре стоит маркировка: что внутри, из какого задания, когда сделано. Без неё на складе стоит безымянная канистра, и на инвентаризации её не с чем сверить.'},
  {t:'Взвешано', key:true, d:'Снимается фактический вес. Это единственная цифра, которой можно закрыть выпуск: норматив по выпуску п/ф ±3%, и равенство плана с фактом при нём физически невозможно. Не взвесили — значит закрываете по плану, а фактического расхода не знает никто.'},
  {t:'Поправлено в документе «Выполнение этапа»', key:true, d:'Фактический вес вносится в «Выполнение этапа» — документ, которым в системе фиксируется факт производства. Сюда попадает цифра с весов, а не количество из техкарты. Проведённое и закрытое задание потом не откатывают: откат стирает сам факт, это уровень 3.'},
  {t:'Перемещено на «Основной склад»', key:true, d:'Полуфабрикат передаётся перемещением с Производства на Основной склад — это передача другому человеку, стык между Антоном и Арсением. Без неё п/ф числится там, где его физически нет. Принимающий пересчитывает и взвешивает сам, а не принимает по документу.'}
];
function renderSfp(){
  const host = document.getElementById('sfpBlocks');
  if(!host) return;
  const steps = SFP_STEPS.map((s,i)=> accHtml(String(i+1), s.t, s.key ? 'шаг, который пропускают' : '', '<p style="margin:0;">'+s.d+'</p>')).join('');
  host.innerHTML =
    '<div class="cz-note"><div class="cz-cap">Что пропускают</div><div class="cz-txt">Выпуск закрывают «как есть»: фактический вес не снимают и полуфабрикат никому не передают. Тогда выпуск закрыт по плановому количеству, себестоимость считается по норме техкарты, а недостача сырья вскрывается через месяц на инвентаризации, когда причину уже не найти. В перечне это «задание проведено скопом», уровень 2.</div></div>'+
    '<div class="cz-stack">'+steps+'</div>'+

let PR_TAB = 'docs';
let PR_MODE = 'now'; // экран всегда открывается на «Сейчас» (решение 22.09), выбор не запоминается
function renderProcess(u){
  const tabs = document.getElementById('prTabs'), body = document.getElementById('prBody');
  const modes = document.getElementById('prModes');
  if(!tabs || !body) return;
  if(modes){
    modes.innerHTML = [['now','Сейчас'],['ref','Справочник']].map(m=>'<button class="pr-mode'+(m[0] === PR_MODE ? ' on' : '')+'" type="button" data-m="'+m[0]+'">'+m[1]+'</button>').join('');
    modes.querySelectorAll('.pr-mode').forEach(b=>b.addEventListener('click', ()=>{ PR_MODE = b.dataset.m; renderProcess(u); }));
  }
  if(PR_MODE === 'now'){ tabs.hidden = true; renderNow(u); return; }
  tabs.hidden = false;
  tabs.innerHTML = PR_TABS.map(x=>'<button class="pr-tab'+(x.k === PR_TAB ? ' on' : '')+'" type="button" data-k="'+x.k+'">'+x.t+(x.draft ? '<span class="pr-draft">проект</span>' : '')+'</button>').join('');
  tabs.querySelectorAll('.pr-tab').forEach(b=>b.addEventListener('click', ()=>{
    PR_TAB = b.dataset.k;
    renderProcess(u);
    const y = tabs.getBoundingClientRect().top + window.scrollY - 8;
    window.scrollTo({top:Math.max(0, y), behavior:'smooth'});
  }));
  const t = PR_TABS.find(x=>x.k === PR_TAB) || PR_TABS[0];
  body.innerHTML = CZ_HEAD(t.head, t.sub) + (t.draft ? (t.draftNote || PR_DRAFT) : '') + t.body;
  t.mount(u);
}

function renderErrors(u){
  // errorStats приходит с сервера; в запасном режиме (данные из файла) считаем сами
  let st = window.ERROR_STATS;
  if(!st) st = {total:0, from:'', to:'', byCategory:[]};
  const isDir = !!u && u.key === 'director';
  const chip = ([k,n]) => `<div class="errchip"><span>${k}</span><span class="cnt">${n}</span></div>`;
  document.getElementById('errChips').innerHTML = st.byCategory.map(chip).join('');
  // Сводка по отделу — только директору (02.10.2026): у сотрудника на экране ошибок только своё.
  document.getElementById('errDept').hidden = !isDir;
  const be = document.getElementById('errByEmp');
  be.hidden = !(isDir && st.byEmployee);
  if(!be.hidden) document.getElementById('errEmpChips').innerHTML = st.byEmployee.map(chip).join('');

  const fmt = d => (d||'').split('-').reverse().slice(0,2).join('.');
  document.getElementById('errHonest').textContent = `${st.total} записей по отделу, ${fmt(st.from)}–${fmt(st.to)}`+(u && !isDir ? `, ваших — ${ERROR_LOG.length}` : '')+` · источник «Учёт ошибок — дисциплина». Проверка проведена машинным интеллектом.`;

  // Имена и точные числа по нулевой цене видит только директор: у сотрудника в журнале лишь его записи
  let topHtml;
  if(isDir){

    const who = {}; zero.forEach(e=>{ who[e.emp] = (who[e.emp]||0)+1; });

  } else {
    topHtml = `
    <div class="eb">Самое частое конкретное нарушение</div>
    <p>Нулевая цена в документе при приёмке или перемещении. Разобрано в блоке «Процесс» → движение документов.</p>

  }

  const total = BANS.reduce((n,b)=>n+b.items.length,0);

  makeCarousel(document.getElementById('banAccordion'), {
