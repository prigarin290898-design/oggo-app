<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F9F9F9">
<title>OGGO — база знаний</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
/* Версия картинок колоды. Имена файлов при замене колоды не меняются, поэтому WebView Telegram
   отдаёт старые картинки даже после обновления index.html. Меняем это число при каждой замене
   колоды — адрес каждой картинки становится новым, и кэш обходится. */
window.ASSET_V = '20260923b';
</script>
<style>
  :root{
    color-scheme:light;
    --paper:#F9F9F9;
    --orange:#E85002;
    --orange-2:#ffab5e;
    --ink:#000000;
    --ink-soft:#211f1b;
    --ink-dim:#54514a;
    --line:rgba(0,0,0,.16);
    --glass:rgba(255,255,255,.46);
    --glass-strong:rgba(255,255,255,.68);
    --glass-border:rgba(0,0,0,.14);
    --pill:#000000;
    --pill-ink:#ffffff;
    --ok:#2f7a3d;
    --ok-bg:#e6f2e6;
    --danger:#c8331f;
    --danger-bg:#fbe6e1;
    --warn:#a8660f;
    --warn-bg:#fbeed9;
    --lime:#dbff3d;
    --lime-ink:#0e1400;
    /* Серые из палитры 23.09.2026. Объявлены впервые, в интерфейсе пока не используются:
       подписи по-прежнему идут через --ink-dim. Замена --ink-dim на серый — отдельное решение. */
    --gray-dark:#333333;
    --gray:#646464;
    --gray-light:#A7A7A7;
    /* Фирменный градиент. Угол и стопы зафиксированы решением 23.09.2026: 45°, вторая чёрная
       точка на 30% держит тьму под контентом — на пропорции телефона диагональ растягивается,
       и стопы палитры 0/38/70/100 делают экран преимущественно оранжевым.
       Применяется на шапке, карточке-обложке и заставке. Фон экрана — картинка из assets/bg/.
       Поверхности интерфейса (плитки, карточки, кнопки) остаются плоскими заливками. */
    --grad-1:#000000;
    --grad-2:#C10801;
    --grad-3:#F16001;
    --grad-4:#D9C3AB;
    --grad:linear-gradient(45deg,var(--grad-1) 0%,var(--grad-1) 30%,var(--grad-2) 62%,var(--grad-3) 85%,var(--grad-4) 100%);
    --font-display:'Unbounded',system-ui,sans-serif;
    --font-body:'Montserrat',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  /* button/input не наследуют шрифт от body — без этой строки любая новая кнопка молча уезжает
     на системный Arial. Та же ловушка, что с сокращением `font:` (решение 22.09). */
  button,input,textarea,select{font-family:var(--font-body);}
  /* manipulation снимает ожидание второго тапа (до 300 мс «залипания» на iOS).
     user-select — чтобы долгое нажатие не выделяло подпись кнопки. Текст и номера документов
     остаются выделяемыми: правило только на управляющие элементы. */
  button,a,[role="button"],.ni,.pill{touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
  /* Вспышку браузера по тапу сняли выше — отдачу на нажатие возвращаем своей, иначе кнопка
     молчит до отпускания и это читается как тормоз. 120 мс: палец ещё на экране, длиннее не нужно.
     .tk-card сюда не берём — у него свой transform под свайп. */
  button,[role="button"],.ni,.pill{transition:transform 120ms cubic-bezier(.22,.78,.2,1);}
  button:active,[role="button"]:active,.ni:active,.pill:active{transform:scale(.97);}
  @media (prefers-reduced-motion:reduce){button,[role="button"],.ni,.pill{transition:none;}}
  /* Серая вспышка браузера по тапу — главный признак «это сайт»; убираем её, отдача живёт в :active.
     overscroll-behavior гасит pull-to-refresh и оттяг страницы: в Telegram этот жест сворачивает приложение.
     text-size-adjust — чтобы Android не раздувал шрифт в альбомной ориентации. */
  html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;}
  html,body{margin:0;padding:0;height:100%;overscroll-behavior:none;}
  body{
    background:var(--paper);color:var(--ink);font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;min-height:100%;
  }
  /* Клякса живёт в клипере во всю ширину окна, а сама фигура — в ::before.
     Так надо, потому что фигура торчит за правый край на 68px: 38 даёт right:-38px и ещё 30 —
     поворот на -18°, он расширяет рамку с 230 до 290. Пока клякса была position:fixed, она в
     ширине документа не участвовала; когда стала absolute (починка текста под ней), эти 68px
     растянули страницу — появилась боковая прокрутка и содержимое резалось по обоим краям.
     overflow-x:hidden на html/body здесь нельзя: он ломает position:sticky, а на нём держится
     кнопка «Приступить» в шторке операции (.pk-start, решение директора 22.09). */
  .oshape{
    position:absolute;top:0;left:0;right:0;height:210px;
    overflow:hidden;z-index:0;pointer-events:none;
  }
  .oshape::before{
    content:'';position:absolute;top:-54px;right:-38px;width:230px;height:230px;
    background:var(--orange);border-radius:30% 34% 38% 32%/30%;
    transform:rotate(-18deg);
  }
  .app{position:relative;z-index:1;padding:16px 16px calc(92px + env(safe-area-inset-bottom,0px));padding-top:calc(16px + env(safe-area-inset-top,0px));max-width:520px;margin:0 auto;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;}
  .logo{height:26px;width:auto;display:block;}
  .whoami{
    display:flex;align-items:center;gap:8px;
    background:var(--glass);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);
    border:1px solid var(--glass-border);border-radius:99px;padding:5px 12px 5px 5px;
  }
  .whoami .av{width:26px;height:26px;border-radius:50%;background:var(--pill);color:var(--pill-ink);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:10.5px;font-weight:700;}
  .whoami .nm{font-size:11.5px;font-weight:700;}
  .section{display:none;}
  .section.active{display:block;}
  .glass{
    position:relative;background:var(--glass);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);
    border:1px solid var(--glass-border);border-radius:22px;padding:16px;margin-bottom:12px;
    box-shadow:0 14px 30px -16px rgba(0,0,0,.45);
  }
  .attn{background:var(--pill);color:var(--pill-ink);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 14px 30px -16px rgba(0,0,0,.45);}
  .attn .eb{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--orange-2);margin-bottom:4px;}
  .attn p{margin:0;font-size:13px;line-height:1.45;}
  .blackblock{background:var(--pill);color:var(--pill-ink);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 14px 30px -16px rgba(0,0,0,.45);}
  .blackblock hr.sep{background:rgba(255,255,255,.18);}
  .row{display:flex;align-items:center;gap:10px;}
  .col{display:flex;flex-direction:column;gap:10px;}
  .between{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .muted{color:var(--ink-dim);font-size:12.5px;}
  .name{font-family:var(--font-display);font-size:19px;font-weight:700;}
  .huge{font-family:var(--font-display);font-weight:700;line-height:1;}
  .sep{height:1px;background:var(--line);border:0;margin:8px 0;}
  .avatar{width:46px;height:46px;border-radius:50%;background:var(--pill);color:var(--pill-ink);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:16px;font-weight:700;flex:0 0 auto;}
  .avatar.lime{background:var(--lime);color:var(--lime-ink);}
  .tag{font-size:10.5px;font-weight:700;color:var(--ink);background:var(--glass-strong);border:1px solid var(--glass-border);padding:4px 9px;border-radius:99px;display:inline-block;}
  .pill{position:relative;z-index:2;display:inline-flex;align-items:center;gap:6px;background:var(--pill);color:var(--pill-ink);font-weight:600;font-size:12.5px;padding:10px 16px;border:0;border-radius:99px;font-family:var(--font-body);}
  .pill.ghost{background:var(--glass);border:1px solid var(--glass-border);color:var(--ink);backdrop-filter:blur(26px) saturate(170%);}
  .pill.lime{background:var(--lime);color:var(--lime-ink);}
  .tag.rev{background:var(--warn-bg);color:var(--warn);border-color:rgba(168,102,15,.35);white-space:nowrap;}
  h2{font-family:var(--font-display);font-size:15px;margin:0 0 10px;}
  .empty{padding:30px 16px;text-align:center;color:var(--ink-dim);font-size:13px;}
  .honest{font-size:11.5px;color:var(--ink-soft);line-height:1.4;margin-top:2px;}

  /* Моя роль subtabs */
  .subtabs{display:flex;gap:6px;margin-bottom:10px;}
  .subtab{flex:1;text-align:center;padding:9px 4px;border-radius:12px;font-size:11.5px;font-weight:700;background:var(--glass);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border:1px solid var(--glass-border);color:var(--ink-soft);cursor:pointer;}
  .subtab.active{background:var(--pill);color:var(--pill-ink);border-color:var(--pill);}
  .sublist{display:none;flex-direction:column;gap:0;}
  .sublist.active{display:flex;}

  /* Team strip */
  .tree{display:flex;flex-direction:column;align-items:center;padding:6px 0 2px;}
  .tn{display:flex;flex-direction:column;align-items:center;text-align:center;}
  .tn .avatar{width:56px;height:56px;font-size:18px;}
  .tn.me .avatar{box-shadow:0 0 0 3px rgba(219,255,61,.45);}
  .tn .nm{margin-top:7px;font-size:14px;font-weight:700;color:var(--ink);line-height:1.2;}
  .tn .rl{margin-top:2px;font-size:11px;line-height:1.3;color:var(--ink-dim);max-width:130px;}
  .tn .you{margin-top:6px;padding:3px 10px;border-radius:99px;background:var(--pill);color:var(--pill-ink);font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;}
  .tv{width:2px;height:20px;background:var(--line);}
  .tkids{position:relative;display:flex;width:100%;}
  .tkids::before{content:'';position:absolute;top:0;left:25%;right:25%;height:2px;background:var(--line);}
  .tk{flex:1;position:relative;padding-top:20px;display:flex;justify-content:center;}
  .tk::before{content:'';position:absolute;top:0;left:50%;width:2px;height:20px;margin-left:-1px;background:var(--line);}
  .glass.tblack{background:var(--pill);color:var(--pill-ink);border-color:transparent;box-shadow:0 14px 30px -16px rgba(0,0,0,.45);backdrop-filter:none;-webkit-backdrop-filter:none;}
  .tblack .tn .avatar{background:rgba(255,255,255,.16);color:#fff;}
  .tblack .tn.me .avatar{background:var(--lime);color:var(--lime-ink);box-shadow:0 0 0 3px rgba(219,255,61,.35);}
  .tblack .tn .nm{color:#fff;}
  .tblack .tn .rl{color:rgba(255,255,255,.62);}
  .tblack .tn .you{background:var(--lime);color:var(--lime-ink);}
  .tblack .tv,.tblack .tk::before,.tblack .tkids::before{background:rgba(255,255,255,.28);}
  .tblack .tnote{border-top-color:rgba(255,255,255,.22);color:rgba(255,255,255,.62);}
  .tnote{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:11.5px;line-height:1.4;color:var(--ink-dim);text-align:center;width:100%;}

  /* Process carousel */
  .carousel-dots{display:flex;gap:5px;justify-content:center;margin-bottom:10px;}
  .carousel-dots i{width:6px;height:6px;border-radius:50%;background:var(--line);display:block;}
  .carousel-dots i.on{background:var(--ink);width:16px;border-radius:3px;}
  .carousel{display:flex;overflow-x:auto;overscroll-behavior-x:contain;gap:12px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none;}
  .carousel::-webkit-scrollbar{display:none;}
  .cpage{flex:0 0 100%;scroll-snap-align:start;}
  .docdef{display:flex;gap:10px;align-items:flex-start;}
  .docdef .ic{width:34px;height:34px;border-radius:10px;background:var(--pill);color:var(--pill-ink);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .docdef b{display:block;font-size:13.5px;}
  .docdef span{font-size:11.5px;color:var(--ink-dim);}
  .blackblock .docdef span{color:rgba(255,255,255,.78);}
  .blackblock .docdef .ic{background:var(--orange-2);color:#000;}
  .lime-heading{display:inline-block;background:var(--lime);color:var(--lime-ink);font-family:var(--font-display);font-weight:700;font-size:15px;padding:9px 16px;border-radius:99px;margin-bottom:12px;}


  /* Правила — аккордеон */
  .racc{margin-bottom:8px;}
  .rhead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;background:var(--glass);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border:1px solid var(--glass-border);border-radius:16px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .racc.open .rhead{border-radius:16px 16px 0 0;}
  .rhead .chev{transition:transform .2s;flex:0 0 auto;color:var(--ink-dim);}
  .racc.open .rhead .chev{transform:rotate(180deg);}
  .rbody{display:none;padding:14px;background:var(--glass-strong);border:1px solid var(--glass-border);border-top:none;border-radius:0 0 16px 16px;font-size:12px;line-height:1.55;}
  .racc.open .rbody{display:block;}
  .rbody p{margin:0;}
  .rbody .rlbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin:10px 0 4px;}
  .rbody .rlbl:first-child{margin-top:0;}
  .rbody ul{margin:0;padding-left:16px;}
  .rbody li{margin-bottom:3px;}


  /* Процесс — блоки документов */
  .dblock{background:var(--glass);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border:1px solid var(--glass-border);border-radius:24px;margin-bottom:12px;}
  .dblock.open{background:var(--pill);backdrop-filter:none;-webkit-backdrop-filter:none;border-color:transparent;}
  .dblock-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 18px;cursor:pointer;}
  .dblock-ic{width:48px;height:48px;border-radius:50%;background:var(--pill);color:var(--pill-ink);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .dblock.open .dblock-ic{background:rgba(255,255,255,.14);color:#fff;}
  .dblock-title{font-family:var(--font-display);font-size:19px;font-weight:700;color:var(--ink);}
  .dblock.open .dblock-title{color:#fff;}
  .dblock-count{font-size:11.5px;color:var(--ink-dim);margin-top:2px;}
  .dblock.open .dblock-count{color:rgba(255,255,255,.6);}
  .dblock-chev{width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--ink);transition:transform .2s;}
  .dblock.open .dblock-chev{background:rgba(255,255,255,.14);color:#fff;transform:rotate(180deg);}
  .dblock-body{display:none;padding:0 18px 14px;}
  .dblock.open .dblock-body{display:block;}
  .dblock-sep{height:1px;background:rgba(0,0,0,.1);}
  .dblock.open .dblock-sep{background:rgba(255,255,255,.12);}
  .doc-row{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer;}
  .doc-row .ic-sm{width:36px;height:36px;border-radius:11px;background:rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--ink);}
  .dblock.open .doc-row .ic-sm{background:rgba(255,255,255,.14);color:#fff;}
  .doc-row .dt{font-size:13.5px;font-weight:700;color:var(--ink);}
  .dblock.open .doc-row .dt{color:#fff;}
  .doc-row .ds{font-size:11px;color:var(--ink-dim);}
  .dblock.open .doc-row .ds{color:rgba(255,255,255,.55);}
  .doc-row .chv{color:var(--ink-dim);flex:0 0 auto;}
  .dblock.open .doc-row .chv{color:rgba(255,255,255,.4);}


  /* Эталонный процесс п/з — две ветки и проект быстрой ветки */
  .fchips-cap{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--orange-2);margin-top:2px;}
  .fchips{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 0 12px;}
  .fchip{font-size:11px;font-weight:600;color:#fff;background:rgba(255,255,255,.14);border-radius:99px;padding:5px 10px;}
  .fchips .ar{color:rgba(255,255,255,.5);font-size:12px;}
  .fintro{font-size:11.5px;line-height:1.5;color:rgba(255,255,255,.75);padding:2px 0 12px;}
  .frow{display:flex;align-items:center;gap:12px;padding:11px 0;cursor:pointer;}
  .fnum{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-family:var(--font-display);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .fnum.lime{background:var(--lime);color:var(--lime-ink);}
  .fbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .ftitle{font-size:13.5px;font-weight:700;color:#fff;line-height:1.3;}
  .fdesc{font-size:11px;color:rgba(255,255,255,.62);line-height:1.4;}
  .ftag{align-self:flex-start;margin-top:4px;font-size:9.5px;font-weight:700;letter-spacing:.06em;background:var(--lime);color:var(--lime-ink);border-radius:99px;padding:3px 9px;}
  .fchev{color:rgba(255,255,255,.45);flex:0 0 auto;display:flex;transition:transform .2s;}
  .fstep.open .fchev{transform:rotate(180deg);}
  .fdetail{display:none;margin:0 0 12px 42px;background:rgba(255,255,255,.1);border-radius:16px;padding:12px 14px;font-size:12px;line-height:1.55;color:#fff;}
  .fstep.open .fdetail{display:block;}
  .fdetail p{margin:0 0 8px;}
  .fdetail p:last-child{margin:0;}
  .dblock.fast:not(.open){border-style:dashed;border-color:rgba(0,0,0,.35);}
  .dblock.fast .tag.rev{margin-top:5px;}


  /* Движение документов */
  .mroute{display:flex;flex-direction:column;gap:9px;padding:13px 0;}
  .mpath{display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
  .mchip{font-size:12.5px;font-weight:700;color:#fff;background:rgba(255,255,255,.14);border-radius:12px;padding:8px 12px;}
  .mchip.to{background:#fff;color:#000;}
  .mpath .ar{display:flex;color:rgba(255,255,255,.6);}
  .mline{display:flex;flex-wrap:wrap;align-items:center;gap:6px;}
  .mlbl{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:rgba(255,255,255,.6);}
  .mprint{font-size:11px;font-weight:700;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:99px;padding:4px 10px;}
  .mtxt{font-size:12px;line-height:1.45;color:#fff;}
  .mwhen{display:flex;align-items:flex-start;gap:8px;}
  .mwhen .k{flex:0 0 auto;font-size:9.5px;font-weight:700;letter-spacing:.06em;background:var(--lime);color:var(--lime-ink);border-radius:99px;padding:4px 9px;margin-top:1px;}

  /* Тренажёр — колода карточек (стекло) */
  /* статистика игры — стекло */
  .g-stats{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;padding:11px 13px;border-radius:99px;background:#000;color:#fff;border:1px solid #000;box-shadow:0 14px 30px -16px rgba(0,0,0,.45);}
  .g-pill{font-size:11px;font-weight:700;border-radius:99px;padding:5px 11px;white-space:nowrap;}
  .g-pill.g-know{background:var(--lime);color:var(--lime-ink);}
  .g-pill.g-left{background:rgba(255,255,255,.16);color:#fff;}
  .g-bar{flex:1 1 60px;height:6px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden;min-width:50px;}
  .g-bar i{display:block;height:100%;width:0;background:var(--lime);border-radius:99px;transition:width .4s cubic-bezier(.22,.78,.2,1);}


  .g-deck{position:relative;height:calc(var(--gch,448px) + 168px);margin:56px 6px 0;perspective:1100px;perspective-origin:50% 0;}
  .g-card{position:absolute;left:0;top:0;width:100%;height:var(--gch,448px);border-radius:32px;overflow:visible;
    background:var(--glass);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);
    border:1px solid var(--glass-border);box-shadow:0 14px 34px -18px rgba(0,0,0,.35);
    transform-origin:50% 50%;transition:transform 760ms cubic-bezier(.16,.86,.24,1),opacity 620ms ease,
      filter 700ms cubic-bezier(.16,.86,.24,1),background-color 700ms ease,border-color 700ms ease,
      backdrop-filter 700ms ease,-webkit-backdrop-filter 700ms ease;
    user-select:none;-webkit-user-select:none;-webkit-user-drag:none;touch-action:pan-y;outline:none;}
  .g-card:focus-visible{outline:3px solid var(--lime);outline-offset:2px;}
  .g-card.g-s0{z-index:4;transform:translate3d(0,0,0) rotate(0) scale(1,1) rotateX(0deg);filter:blur(0);cursor:grab;box-shadow:0 22px 48px -20px rgba(0,0,0,calc(.32 + var(--sh,0)));}
    /* Глубина: передняя карточка резкая, задние размыты тем сильнее, чем дальше.
     Размытие — часть перехода, поэтому подъезжающая карточка наводится на резкость
     на глазах, а не подменяется резкой копией. Это и даёт эффект фокуса.
     Разрыв набран между первой и второй карточкой, а не внизу стопки: отодвигать
     нижние бессмысленно, расстояние до второй от этого не меняется, а именно она
     выходит вперёд. Нижние карточки, наоборот, собраны в плотную пачку, как было
     изначально: разрывы 18 и 18 px против 36 и 32.
     Колода за первой лежит наклонённой (`rotateX`) и встаёт, выходя вперёд. Сдвиг и
     размытие глаз всё равно читал как «та же карточка вернулась на место»; вставание
     из наклона он читает как приход другого предмета. Сцене нужна `perspective`,
     иначе наклон выглядит сжатием по высоте. */
  .g-card.g-s1{z-index:3;transform:translate3d(-12px,104px,0) rotate(3.2deg) scale(.84,.83) rotateX(30deg);filter:blur(6px);}
  .g-card.g-s2{z-index:2;transform:translate3d(-10px,122px,0) rotate(-5deg) scale(.80,.79) rotateX(40deg);filter:blur(9px);}
  .g-card.g-s3{z-index:1;transform:translate3d(-13px,140px,0) rotate(8deg) scale(.76,.75) rotateX(48deg);filter:blur(12px);}
  /* Пауза перед движением стопки. Без неё задняя карточка едет одновременно с броском,
     и к моменту, когда верхняя ушла, новая уже стоит на месте — смены не видно.
     Задержка только на подтягивание; сам бросок начинается сразу по пальцу. */
  .g-deck.g-advancing .g-card:not(.g-leaving){transition-delay:300ms;}
  .g-card.g-dragging{transition:none;cursor:grabbing;will-change:transform;}
  .g-card.g-preview{transition:none;will-change:transform;}
  .g-card.g-preview .g-tint{transition:none;}
  /* Новая карточка приходит снизу стопки, а не возникает на месте: без сдвига глаз
     читает появление как рывок и переспрашивает, та же это карточка или уже другая. */
  .g-card.g-entering{opacity:0;transform:translate3d(-14px,164px,0) rotate(10deg) scale(.72,.71) rotateX(58deg);filter:blur(14px);}
  .g-card.g-leaving{z-index:30;pointer-events:none;filter:blur(0);}
  .g-tint{position:absolute;inset:0;z-index:20;border-radius:inherit;pointer-events:none;transition:opacity 360ms cubic-bezier(.22,.78,.2,1),background-color 430ms;}
  .g-s0 .g-tint{background:rgba(255,255,255,.6);opacity:0;}
  .g-s1 .g-tint{background:rgba(255,171,94,.34);opacity:1;}
  .g-s2 .g-tint{background:rgba(219,255,61,.4);opacity:1;}
  .g-s3 .g-tint{background:rgba(0,0,0,.08);opacity:1;}
  .g-art{position:absolute;left:12px;right:12px;top:12px;height:178px;border-radius:24px;overflow:visible;border:1px solid rgba(0,0,0,.08);}
  .g-art-in{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:transform .2s ease-out;}
  .g-obj{position:absolute;left:50%;top:50%;z-index:2;height:calc(100% * var(--s,1.3));aspect-ratio:1/1;transform:translate(calc(-50% + var(--x,0%)),calc(-50% + var(--y,-8%))) rotate(var(--t,0deg));animation:g-float 5.2s ease-in-out infinite;opacity:0;transition:opacity .36s ease;pointer-events:none;}
  .g-card.g-s0 .g-obj,.g-card.g-preview .g-obj,.g-card.g-leaving .g-obj{opacity:1;}
  .g-obj img,.g-obj svg{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none;user-select:none;filter:drop-shadow(0 14px 14px rgba(0,0,0,.18));}
  .g-card:nth-child(2n) .g-obj{animation-delay:-1.7s;}
  .g-card:nth-child(3n) .g-obj{animation-delay:-3.1s;}
  .g-chip{z-index:3;}
  @keyframes g-float{0%,100%{transform:translate(calc(-50% + var(--x,0%)),calc(-50% + var(--y,-8%))) rotate(calc(var(--t,0deg) - 2.5deg));}50%{transform:translate(calc(-50% + var(--x,0%) + 2%),calc(-50% + var(--y,-8%) - 6%)) rotate(calc(var(--t,0deg) + 2.5deg));}}
  .g-chip{position:absolute;top:12px;font-size:11px;font-weight:700;border-radius:99px;padding:5px 11px;background:rgba(255,255,255,.82);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border:1px solid rgba(0,0,0,.1);}
  .g-chip.g-tag{left:12px;}
  .g-chip.g-cnt{right:12px;background:#000;color:#fff;border-color:#000;}

    border:1px solid var(--glass-border);background:var(--glass);color:var(--ink);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);}

  /* Карточка документа — модалка */

  /* Карусели блоков */

  .cz-card{flex:0 0 74%;scroll-snap-align:center;scroll-snap-stop:always;position:relative;min-height:178px;border-radius:28px;padding:16px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;
    background:var(--glass);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border:1px solid var(--glass-border);
    transform:scale(calc(1 - var(--k,1)*.07));opacity:calc(1 - var(--k,1)*.4);transition:background-color .3s,color .3s,border-color .3s,box-shadow .3s;}

  .cz-item{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:18px;font-size:12.5px;line-height:1.5;background:var(--glass);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border:1px solid var(--glass-border);}

  .cz-lab{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin:8px 2px 0;}

  .cz-stack{display:flex;flex-direction:column;gap:8px;}
  .cz-zone{display:flex;align-items:center;gap:12px;margin-top:10px;}
  .ov{flex:0 0 auto;min-width:88px;text-align:center;font-size:13px;font-weight:800;line-height:1;padding:10px 14px;border-radius:99px;}
  .ov.g{background:var(--lime);color:var(--lime-ink);}
  .ov.y{background:#ffcf3f;color:#1a1400;}
  .ov.r{background:#ff5544;color:#1a0500;}
  .cz-fact{border-radius:20px;padding:14px 16px;background:var(--glass);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border:1px solid var(--glass-border);font-size:12.5px;}

  .cz-route{border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:9px;background:var(--glass);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border:1px solid var(--glass-border);}
  .cz-path{display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
  .cz-path .a{font-size:12.5px;font-weight:700;background:rgba(255,255,255,.7);border:1px solid var(--glass-border);border-radius:12px;padding:8px 12px;}
  .cz-path .b{font-size:12.5px;font-weight:700;background:#000;color:#fff;border-radius:12px;padding:8px 12px;}
  .cz-path .ar{display:flex;}
  .cz-line{display:flex;flex-wrap:wrap;align-items:center;gap:6px;}
  .cz-line .lb{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-dim);}
  .cz-line .pr{font-size:11px;font-weight:700;border:1px solid #000;border-radius:99px;padding:4px 10px;}
  .cz-line .tx{font-size:12px;line-height:1.4;}
  .cz-when{display:flex;align-items:flex-start;gap:8px;}
  .cz-when .k{flex:0 0 auto;font-size:9.5px;font-weight:700;letter-spacing:.06em;background:var(--lime);color:var(--lime-ink);border-radius:99px;padding:4px 9px;margin-top:1px;}
  .cz-when .tx{font-size:12px;line-height:1.45;}
  @media (prefers-reduced-motion:reduce){.cz-card,.cz-list,.cz-list > *,.docModal.open .dm-sheet,.docModal.open .dm-hero,.cz-step,.cz-step *{animation:none;transition:none;}}

  .step{position:relative;padding:10px 0 10px 24px;font-size:12.5px;}
  .step::before{content:"";position:absolute;left:5px;top:0;bottom:0;width:2px;background:var(--line);}
  .step:first-child::before{top:14px;}
  .step:last-child::before{bottom:calc(100% - 24px);}
  .step .dot{position:absolute;left:0;top:13px;width:12px;height:12px;border-radius:50%;background:var(--pill);border:2px solid #fff;}

  .errchip{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:14px;background:var(--danger-bg);color:var(--danger);font-size:12.5px;font-weight:600;margin-bottom:8px;}
  .errchip .cnt{margin-left:auto;font-family:var(--font-display);font-size:14px;}

  .cal{display:flex;gap:6px;}
  .cal .d{flex:1;text-align:center;border-radius:12px;padding:8px 0;background:var(--glass-strong);border:1px solid var(--glass-border);font-size:11px;font-weight:600;color:var(--ink-dim);}
  .cal .d.today{background:var(--pill);color:var(--pill-ink);border-color:var(--pill);}
  .cal .d b{display:block;font-family:var(--font-display);font-size:15px;color:inherit;margin-top:2px;}
  .taskcard{padding:12px 14px;border-radius:16px;background:var(--glass);backdrop-filter:blur(26px) saturate(170%);border:1px solid var(--glass-border);margin-bottom:8px;}
  .dotpri{width:8px;height:8px;border-radius:50%;background:var(--ink);flex:0 0 auto;}
  .dotpri.mid{background:var(--lime);}
  .dotpri.low{background:var(--ink-dim);}

  .bars{display:flex;align-items:flex-end;gap:7px;height:58px;margin:12px 0 4px;}
  .bars .b{flex:1;border-radius:6px 6px 2px 2px;background:var(--glass-strong);border:1px solid var(--glass-border);}
  .bars .b.hi{background:var(--lime);border-color:var(--lime);}

  /* bottom nav */
  .botnav{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9;display:flex;gap:6px;background:var(--pill);border-radius:99px;padding:6px;box-shadow:0 16px 30px -14px rgba(0,0,0,.45);}
  .botnav .ni{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:transparent;color:#fff;cursor:pointer;}
  .botnav .ni.on{background:var(--lime);color:var(--lime-ink);}
  .botnav .ni svg{display:block;}
  [hidden]{display:none!important;}

  /* Состояния загрузки и ошибок */
  #appState{display:none;}
  body.st-on #appState{display:flex;position:relative;z-index:5;min-height:calc(100dvh - 140px);align-items:center;justify-content:center;padding:0 16px;}
  body.st-on .section, body.st-on .botnav{display:none !important;}
  .st-card{width:100%;max-width:340px;text-align:center;padding:28px 22px;border-radius:26px;background:var(--glass);border:1px solid var(--glass-border);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);}
  .st-ic{width:64px;height:64px;border-radius:50%;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
  .st-t{font-family:var(--font-display);font-size:17px;font-weight:700;line-height:1.25;}
  .st-p{margin-top:8px;font-size:13px;line-height:1.5;color:var(--ink-soft);}
  .st-btn{display:inline-flex;align-items:center;justify-content:center;margin-top:18px;padding:13px 26px;border-radius:99px;border:0;background:#000;color:#fff;font:800 13px var(--font-body);cursor:pointer;text-decoration:none;}
  .st-drop{width:52px;height:52px;margin:0 auto 16px;background:#000;border-radius:50% 0 50% 50%;transform:rotate(-45deg);animation:stPulse 1.4s ease-in-out infinite;}
  @keyframes stPulse{0%,100%{transform:rotate(-45deg) scale(.86);opacity:.75;}50%{transform:rotate(-45deg) scale(1);opacity:1;}}
  @media (prefers-reduced-motion:reduce){.st-drop{animation:none;}}

  /* Быстрый поиск на главной */
  .sq{margin:0 0 14px;}
  .sq-field{display:flex;align-items:center;gap:10px;height:52px;padding:0 14px;border-radius:99px;background:var(--glass);border:1px solid var(--glass-border);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);cursor:text;}
  .sq-field:focus-within{border-color:#000;}
  .sq-field > svg{flex:0 0 auto;}
  .sq-field input{flex:1;min-width:0;border:0;background:transparent;font:600 16px var(--font-body);color:var(--ink);outline:none;-webkit-appearance:none;appearance:none;}
  .sq-field input::placeholder{color:var(--ink-soft);opacity:1;font-weight:500;}
  .sq-field input::-webkit-search-cancel-button{-webkit-appearance:none;}
  .sq-x{display:none;flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:0;background:#000;color:#fff;align-items:center;justify-content:center;cursor:pointer;padding:0;}
  .sq.has .sq-x{display:flex;}
  .sq-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .sq.has .sq-chips{display:none;}
  .sq-chip{padding:8px 13px;border-radius:99px;background:var(--glass);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border:1px solid var(--glass-border);font:700 12px var(--font-body);color:var(--ink);cursor:pointer;}
  .sq-res{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
  .sq-res[hidden]{display:none;}
  .sq-row{display:block;width:100%;text-align:left;padding:13px 14px;border-radius:18px;background:var(--glass);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border:1px solid var(--glass-border);cursor:pointer;font-family:var(--font-body);color:var(--ink);}
  .sq-row:active{background:#000;color:#fff;}
  .sq-ty{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--orange);}
  .sq-t{margin-top:3px;font-size:14px;font-weight:700;line-height:1.3;}
  .sq-s{margin-top:4px;font-size:12.5px;line-height:1.45;color:var(--ink-soft);}
  .sq-row:active .sq-s{color:rgba(255,255,255,.7);}
  .sq mark,.sq-res mark{background:var(--lime);color:#000;border-radius:4px;padding:0 2px;}
  .sq-none{padding:22px 16px;text-align:center;font-size:13px;line-height:1.5;color:var(--ink-soft);}
  .sq-on > .sq-rest{display:none;}

  /* Баллы за месяц, аттестация, игра «Банк» */
  .at-score{border-radius:22px;padding:16px;background:var(--glass);border:1px solid var(--glass-border);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);margin-bottom:12px;}
  .at-cols{display:flex;align-items:stretch;gap:6px;margin-top:8px;}
  .at-col{flex:1;min-width:0;border-radius:16px;padding:12px 6px;text-align:center;background:rgba(0,0,0,.04);}
  .at-col.tot{background:#000;color:#fff;}
  .at-n{font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1.1;}
  .at-l{margin-top:4px;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-dim);}
  .at-col.tot .at-l{color:rgba(255,255,255,.7);}
  .at-op{align-self:center;font-family:var(--font-display);font-size:18px;font-weight:700;color:var(--ink-dim);}
  .at-zone{display:flex;align-items:center;gap:12px;margin-top:14px;}
  .at-zt{font-size:12px;line-height:1.45;color:var(--ink-soft);}
  .at-note{margin-top:10px;font-size:11.5px;line-height:1.45;color:var(--ink-dim);}
  .at-cta{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;margin-top:14px;border:0;border-radius:99px;background:#000;color:#fff;font:800 13px var(--font-body);cursor:pointer;}
  .at-cta[disabled]{background:rgba(0,0,0,.08);color:var(--ink-dim);cursor:default;}
  .at-card{border-radius:22px;padding:16px;background:var(--glass);border:1px solid var(--glass-border);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);margin-bottom:12px;}
  .at-h{margin-top:6px;font-family:var(--font-display);font-size:16px;font-weight:700;line-height:1.3;}
  .at-p{margin:6px 0 0;font-size:12.5px;line-height:1.5;color:var(--ink-soft);}
  .at-sm{margin:8px 0 0;font-size:11.5px;line-height:1.45;color:var(--ink-dim);}
  .at-ban{margin:12px 0 0;padding:12px 14px;border-radius:16px;background:#000;color:#fff;font-size:12px;line-height:1.5;}
  .at-ban b{color:var(--orange-2);}
  .at-blocks{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
  .at-sec{margin-top:12px;}
  .at-lab{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--orange-2);}
  .at-tx{margin-top:4px;font-size:12.5px;line-height:1.5;}
  .at-task{margin-top:12px;padding:12px;border-radius:16px;background:rgba(255,255,255,.08);}
  .at-th{display:flex;align-items:center;gap:8px;}
  .at-tid{font-family:var(--font-display);font-size:12px;font-weight:700;}
  .at-tt{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:99px;padding:3px 9px;}
  .at-tt.p{background:var(--lime);color:var(--lime-ink);} .at-tt.w{background:#fff;color:#000;}
  .at-chk{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12.5px;font-weight:600;}
  .at-chk input{width:20px;height:20px;accent-color:var(--lime);flex:0 0 auto;}
  .at-ta{display:block;width:100%;box-sizing:border-box;margin-top:10px;padding:10px 12px;border-radius:12px;border:0;background:#fff;color:#000;font:500 14px/1.4 var(--font-body);resize:vertical;outline:none;}
  .at-ta[disabled]{background:rgba(255,255,255,.14);color:rgba(255,255,255,.85);}
  .at-prog{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-size:12px;font-weight:700;}
  .at-save{font-size:11px;font-weight:600;color:var(--ink-dim);}
  .at-two{display:flex;gap:8px;margin-top:10px;}
  .at-two button{flex:1;min-height:48px;border-radius:99px;font:800 13px var(--font-body);cursor:pointer;border:1px solid #000;background:transparent;color:#000;}
  .at-two button.pri{background:#000;color:#fff;}
  .at-verd{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .at-row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:18px;background:var(--glass);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border:1px solid var(--glass-border);margin-bottom:8px;cursor:pointer;width:100%;box-sizing:border-box;text-align:left;font-family:var(--font-body);color:var(--ink);}
  .at-row .nm{flex:1;min-width:0;font-size:14px;font-weight:700;} .at-row .sb{display:block;margin-top:2px;font-size:11.5px;font-weight:500;color:var(--ink-dim);}
  .at-row .ov{min-width:0;padding:7px 12px;font-size:11.5px;}
  .at-chkbox{display:flex;align-items:flex-start;gap:10px;margin-top:8px;font-size:13px;line-height:1.4;}
  .at-chkbox input{width:20px;height:20px;margin-top:1px;accent-color:#000;flex:0 0 auto;}
  .at-chkbox.red{color:var(--danger);font-weight:700;}
  .at-choose{display:flex;gap:8px;margin-top:12px;}
  .at-choose label{flex:1;}
  .at-choose input{position:absolute;opacity:0;pointer-events:none;}
  .at-choose span{display:flex;align-items:center;justify-content:center;min-height:46px;border-radius:99px;border:1px solid #000;font-size:13px;font-weight:800;cursor:pointer;}
  .at-choose input:checked + span.pass{background:var(--lime);border-color:var(--lime);color:var(--lime-ink);}
  .at-choose input:checked + span.fail{background:#ff5544;border-color:#ff5544;color:#1a0500;}
  .at-ans{margin-top:8px;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.05);font-size:13px;line-height:1.45;white-space:pre-wrap;}
  .at-ans.no{color:var(--ink-dim);font-style:italic;}
  .gm-sw{display:flex;gap:6px;margin:0 0 12px;}
  .gm-sw button{flex:1;text-align:center;padding:11px 6px;border-radius:99px;font:700 12.5px var(--font-body);background:var(--glass);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border:1px solid var(--glass-border);color:var(--ink-soft);cursor:pointer;}
  .gm-sw button.on{background:#000;color:#fff;border-color:#000;}
  .gm-q{font-family:var(--font-display);font-size:16px;font-weight:700;line-height:1.35;margin-top:8px;}
  .gm-opts{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
  .gm-opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:13px 14px;border-radius:18px;background:var(--glass);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border:1px solid var(--glass-border);font:600 13.5px/1.4 var(--font-body);color:var(--ink);cursor:pointer;}
  .gm-opt:disabled{cursor:default;}
  .gm-opt .k{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:11px;font-weight:700;}
  .gm-opt.right{background:var(--lime);border-color:var(--lime);color:var(--lime-ink);}
  .gm-opt.wrong{background:#ff5544;border-color:#ff5544;color:#1a0500;}
  .gm-fb{margin-top:12px;padding:12px 14px;border-radius:16px;background:#000;color:#fff;font-size:12.5px;line-height:1.5;}
  .gm-fb b{color:var(--orange-2);}
  .gm-prog{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;color:var(--ink-soft);}
  .gm-off{font-family:var(--font-display);font-weight:700;color:var(--ink);}

  /* Два раздельных счёта: «Ошибки» (минус) и «Рост» (плюс) */
  .ge-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px;}
  .ge-n{font-family:var(--font-display);font-size:38px;font-weight:700;line-height:1.05;}
  .ge-sub{margin-top:6px;font-size:12px;line-height:1.45;color:var(--ink-soft);}
  .ge-zones{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;}
  .ge-zones .ov{min-width:0;padding:8px 12px;font-size:11.5px;opacity:.28;}
  .ge-zones .ov.now{opacity:1;box-shadow:0 0 0 2px var(--paper),0 0 0 4px #000;}
  .ge-lv{margin-top:14px;display:flex;flex-direction:column;gap:6px;}
  .ge-lv div{display:flex;gap:10px;font-size:12px;line-height:1.4;color:var(--ink-soft);}
  .ge-lv b{flex:0 0 34px;font-family:var(--font-display);font-size:13px;color:var(--ink);}
  .gp-head{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .gp-draft{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--orange);border:1px dashed var(--orange);border-radius:99px;padding:4px 10px;}
  .gp-rows{margin-top:14px;border-top:1px solid var(--line);}
  .gp-row{display:flex;align-items:baseline;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .gp-row .l{flex:1;min-width:0;font-weight:600;}
  .gp-row .m{color:var(--ink-dim);font-size:12px;font-variant-numeric:tabular-nums;}
  .gp-row .v{min-width:44px;text-align:right;font-family:var(--font-display);font-weight:700;font-variant-numeric:tabular-nums;}
  .gp-seg{display:flex;gap:6px;margin-top:12px;}
  .gp-seg i{flex:1;height:12px;border-radius:99px;background:rgba(0,0,0,.1);}
  .gp-seg i.on{background:var(--lime);box-shadow:inset 0 0 0 2px #000;}

  /* Тёмные блоки (акцент важного): «Рост», «Аттестация», карточки игры */
  .at-score.dk,.at-card.dk{background:#000;color:#fff;border-color:#000;box-shadow:0 14px 30px -16px rgba(0,0,0,.5);-webkit-backdrop-filter:none;backdrop-filter:none;}
  .dk .cz-cap{color:var(--orange-2);}
  .dk .ge-n{color:var(--lime);}
  .dk .ge-sub,.dk .at-p,.dk .at-sm,.dk .at-note,.dk .at-zt{color:rgba(255,255,255,.72);}
  .dk .at-h{color:#fff;}
  .dk .gp-rows,.dk .gp-row{border-color:rgba(255,255,255,.18);}
  .dk .gp-row .m{color:rgba(255,255,255,.6);}
  .dk .gp-row .v{color:#fff;}
  .dk .at-cta{background:var(--lime);color:var(--lime-ink);}
  .dk .at-cta[disabled]{background:rgba(255,255,255,.12);color:rgba(255,255,255,.55);}
  .dk .at-ban{background:rgba(255,255,255,.1);}
  .dk .cz-step{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);color:#fff;-webkit-backdrop-filter:none;backdrop-filter:none;}
  .dk .cz-step .dd{color:rgba(255,255,255,.62);}
  .dk .cz-step .num{background:rgba(255,255,255,.18);color:#fff;}
  .dk .cz-step .chv{color:rgba(255,255,255,.7);}
  .dk .cz-step.open{background:#1e1e1e;border-color:rgba(255,255,255,.22);box-shadow:none;}
  .dk .gm-q{color:#fff;}
  .dk .gm-prog{color:rgba(255,255,255,.7);}
  .dk .gm-off{color:var(--lime);}
  .dk .gm-opt{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff;}
  .dk .gm-opt .k{background:rgba(255,255,255,.22);color:#fff;}
  .dk .gm-opt.sel{background:var(--lime);border-color:var(--lime);color:var(--lime-ink);}
  .dk .gm-opt.sel .k{background:var(--lime-ink);color:var(--lime);}
  .dk .gm-opt.right{background:var(--lime);border-color:var(--lime);color:var(--lime-ink);}
  .dk .gm-opt.right .k{background:var(--lime-ink);color:var(--lime);}
  .dk .gm-opt.wrong{background:#ff5544;border-color:#ff5544;color:#1a0500;}
  .dk .gm-fb{background:rgba(255,255,255,.1);}
  .dk .at-ans{background:rgba(255,255,255,.08);color:#fff;}
  .dk .at-ans.no{color:rgba(255,255,255,.6);}

  .gp-bar{margin-top:14px;height:12px;border-radius:99px;background:rgba(0,0,0,.1);overflow:hidden;}
  .gp-bar i{display:block;height:100%;border-radius:99px;background:var(--lime);box-shadow:inset 0 0 0 2px #000;}
  #atScore.dk .ge-n{color:#fff;}
  .dk .ge-lv div{color:rgba(255,255,255,.72);}
  .dk .ge-lv b{color:#fff;}
  .dk .ge-zones .ov.now{box-shadow:0 0 0 2px #000,0 0 0 4px #fff;}
  .dk .ge-zones .ov{opacity:.35;}
  .dk .ge-zones .ov.now{opacity:1;}

  /* Экран «Задачи»: неделя полосой, карточка со свайпом, полоска «Отменить» */
  .tk-sum{display:flex;align-items:center;gap:10px;width:100%;margin-bottom:12px;padding:12px 14px;border-radius:16px;background:#000;border:1px solid #000;color:#fff;font-family:var(--font-body);font-weight:600;font-size:12px;line-height:1;cursor:pointer;text-align:left;box-shadow:0 14px 30px -16px rgba(0,0,0,.45);}
  .tk-sum b{font-family:var(--font-display);font-size:14px;}
  .tk-sum .s2{color:#ff8a7a;}
  .tk-sum .s3{margin-left:auto;background:var(--lime);color:var(--lime-ink);border-radius:99px;padding:5px 9px;font-weight:800;}
  .tk-sum .chv{display:flex;opacity:.5;}
  .wk{display:flex;gap:5px;margin:0 0 14px;}
  .wk-d{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border-radius:14px;background:var(--glass);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border:1px solid var(--glass-border);color:var(--ink);cursor:pointer;}
  .wk-d .wd{font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;opacity:.55;}
  .wk-d .dn{font-family:var(--font-display);font-weight:700;font-size:15px;line-height:1;}
  .wk-d i{width:5px;height:5px;border-radius:50%;background:transparent;}
  .wk-d i.has{background:var(--orange);}
  .wk-d i.late{background:var(--danger);}
  .wk-d.now .dn{color:var(--orange);}
  .wk-d.on{background:var(--pill);color:var(--pill-ink);border-color:transparent;}
  .wk-d.on .dn,.wk-d.now.on .dn{color:var(--pill-ink);}
  .tk-lab{font-size:11.5px;color:var(--ink-dim);margin:10px 0 6px 4px;}
  .tk-lab.bad{color:var(--danger);font-weight:700;}
  .tk-sw{position:relative;border-radius:18px;overflow:hidden;margin-bottom:8px;touch-action:pan-y;}
  .tk-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:11.5px;font-weight:800;border-radius:18px;background:var(--glass-strong);color:var(--ink-dim);}
  .tk-sw.to-done .tk-bg{background:var(--lime);color:var(--lime-ink);}
  .tk-sw.to-info .tk-bg{background:var(--warn-bg);color:var(--warn);}
  .tk-card{position:relative;border-radius:18px;padding:12px 14px;background:var(--glass);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border:1px solid var(--glass-border);transition:transform .18s ease;}
  .tk-t{font-size:12.5px;font-weight:700;line-height:1.35;}
  .tk-meta{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:11.5px;color:var(--ink-dim);}
  .tk-meta .due.late{color:var(--danger);font-weight:700;}
  .tk-go{margin-left:auto;display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--glass-strong);border:1px solid var(--glass-border);color:var(--ink);cursor:pointer;}
  .tk-undo{position:fixed;left:50%;transform:translate(-50%,120%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:12;display:flex;align-items:center;gap:12px;max-width:min(92vw,420px);padding:11px 14px;border-radius:99px;background:#000;color:#fff;font-family:var(--font-body);font-weight:600;font-size:12px;line-height:1.2;box-shadow:0 18px 34px -18px rgba(0,0,0,.7);opacity:0;transition:transform .2s ease,opacity .2s ease;pointer-events:none;}
  .tk-undo.on{transform:translate(-50%,0);opacity:1;pointer-events:auto;}
  .scen-who{display:inline-block;margin-top:6px;padding:3px 8px;border-radius:99px;font-size:10px;font-weight:700;background:var(--glass-strong);border:1px solid var(--glass-border);color:var(--ink-dim);}
  .scen-who.mine{background:var(--lime);border-color:transparent;color:var(--lime-ink);}
  .pr-modes{display:flex;gap:4px;padding:5px;margin:0 0 12px;border-radius:99px;background:#000;box-shadow:0 14px 30px -16px rgba(0,0,0,.45);}
  .pr-mode{flex:1;padding:10px 12px;border:0;border-radius:99px;background:transparent;color:rgba(255,255,255,.72);font-family:var(--font-body);font-weight:700;font-size:12.5px;cursor:pointer;}
  .pr-mode.on{background:var(--lime);color:var(--lime-ink);}
  .now-sum{display:flex;gap:16px;margin-top:6px;font-size:12px;color:rgba(255,255,255,.72);}
  .now-sum b{font-family:var(--font-display);font-size:18px;color:#fff;margin-right:4px;}
  .nt{position:fixed;inset:0;z-index:30;background:var(--paper);opacity:0;pointer-events:none;transition:opacity .25s ease;}
  .nt.open{opacity:1;pointer-events:auto;}
  .nt-in{position:relative;height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;}
  .nt-track{flex:1;display:flex;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scrollbar-width:none;}
  .nt-track::-webkit-scrollbar{display:none;}
  .nt-s{flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;padding:24px 28px 0;text-align:center;}
  .nt-art{width:min(62vw,240px);aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:32px;background:var(--lime);}
  .nt-art img{width:78%;height:78%;object-fit:contain;}
  .nt-t{font-family:var(--font-display);font-weight:700;font-size:22px;line-height:1.15;}
  .nt-p{margin:0;font-size:13px;line-height:1.5;color:var(--ink-dim);max-width:34ch;}
  .nt-hint{font-size:11px;color:var(--ink-dim);opacity:.7;}
  .nt-go{margin-top:4px;padding:14px 28px;border:0;border-radius:99px;background:#000;color:#fff;font-family:var(--font-body);font-weight:700;font-size:13.5px;cursor:pointer;}
  .nt-dots{display:flex;gap:6px;justify-content:center;padding:18px 0 8px;}
  .nt-dots button{width:7px;height:7px;padding:0;border:0;border-radius:50%;background:var(--glass-border);cursor:pointer;}
  .nt-dots button.on{background:#000;width:18px;border-radius:99px;}
  .nt-skip{margin:0 auto calc(18px + env(safe-area-inset-bottom,0px));padding:8px 16px;border:0;background:transparent;color:var(--ink-dim);font-family:var(--font-body);font-size:12px;cursor:pointer;}
  .pk-doc{display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;margin-bottom:8px;padding:13px 14px;border-radius:18px;background:var(--glass);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border:1px solid var(--glass-border);color:var(--ink);text-align:left;cursor:pointer;}
  .pk-n{font-family:var(--font-display);font-weight:700;font-size:15px;}
  .pk-w{font-size:11.5px;color:var(--ink-dim);}
  .pk-st{margin-top:4px;padding:3px 8px;border-radius:99px;background:var(--glass-strong);border:1px solid var(--glass-border);font-size:10px;font-weight:700;color:var(--ink-dim);}
  .pk-st.go{background:var(--lime);border-color:transparent;color:var(--lime-ink);}
  .pk-row{display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:12px;background:var(--paper);border:1px solid var(--glass-border);margin-bottom:5px;}
  .pk-row.done{background:var(--glass-strong);}
  .pk-t{flex:1 1 auto;min-width:0;font-size:12.5px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pk-plan{flex:0 0 auto;min-width:40px;padding:6px 8px;border-radius:8px;background:var(--glass-strong);font-family:var(--font-display);font-weight:700;font-size:13px;color:var(--ink-dim);text-align:center;}
  .pk-fact{flex:0 0 auto;min-width:48px;padding:6px 10px;border-radius:8px;background:var(--lime);color:var(--lime-ink);font-family:var(--font-display);font-size:13px;font-weight:700;text-align:center;}
  .pk-fact.bad{background:#ff5544;color:#1a0500;}
  .pk-in{flex:0 0 54px;width:54px;padding:6px 6px;border-radius:8px;border:1px solid var(--glass-border);background:#fff;font-family:var(--font-display);font-size:13px;font-weight:700;color:var(--ink);text-align:center;}
  .pk-go{flex:0 0 auto;padding:7px 10px;border:0;border-radius:8px;background:var(--glass-strong);color:var(--ink-dim);font-family:var(--font-body);font-weight:700;font-size:11px;cursor:pointer;}
  .pk-go.now{background:var(--lime);color:var(--lime-ink);}
  .pk-back{display:block;width:100%;margin-top:12px;padding:10px;border:0;background:transparent;color:var(--ink-dim);font-family:var(--font-body);font-size:12px;cursor:pointer;}
  .op-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .op{display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-height:96px;padding:13px 12px;border-radius:18px;background:var(--glass);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border:1px solid var(--glass-border);color:var(--ink);text-align:left;cursor:pointer;}
  .op.lime{background:var(--lime);color:var(--lime-ink);border:0;box-shadow:0 14px 30px -18px rgba(0,0,0,.35);}
  .op.lime .op-w{color:rgba(14,20,0,.62);}
  .op.lime .op-gap{background:rgba(14,20,0,.12);color:var(--lime-ink);}
  .pk-start{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:block;width:100%;margin:20px 0 4px;padding:17px 24px;border:0;border-radius:16px;background:var(--lime);color:var(--lime-ink);font-family:var(--font-body);font-weight:700;font-size:14.5px;letter-spacing:.01em;cursor:pointer;box-shadow:0 16px 30px -18px rgba(0,0,0,.45);}
  .op.hot{background:#000;color:#fff;border-color:#000;box-shadow:0 14px 30px -16px rgba(0,0,0,.45);}
  .op-t{font-size:12.5px;font-weight:700;line-height:1.3;}
  .op-w{font-size:10.5px;color:var(--ink-dim);line-height:1.25;}
  .op.hot .op-w{color:rgba(255,255,255,.6);}
  .op-gap.draft{background:var(--glass-strong);color:var(--ink-dim);}
  .op.hot .op-gap.draft{background:rgba(255,255,255,.16);color:rgba(255,255,255,.8);}
  .op-gap{margin-top:auto;padding:3px 7px;border-radius:99px;background:var(--warn-bg);color:var(--warn);font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;}
  .op.hot .op-gap{background:rgba(255,255,255,.16);color:#fff;}
  .pr-tabs{display:flex;gap:6px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;margin:0 0 14px;padding-bottom:2px;}
  .pr-tabs::-webkit-scrollbar{display:none;}
  .pr-tab{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:99px;background:var(--glass);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border:1px solid var(--glass-border);color:var(--ink);font-family:var(--font-body);font-weight:700;font-size:12px;line-height:1;cursor:pointer;white-space:nowrap;}
  .pr-tab.on{background:#000;color:#fff;border-color:#000;box-shadow:0 14px 30px -16px rgba(0,0,0,.45);}
  .pr-draft{font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 6px;border-radius:99px;background:var(--warn-bg);color:var(--warn);}
  .pr-tab.on .pr-draft{background:rgba(255,255,255,.18);color:#fff;}
  .at-tile.dk{background:#000;color:#fff;border-color:#000;box-shadow:0 14px 30px -16px rgba(0,0,0,.45);backdrop-filter:none;-webkit-backdrop-filter:none;}
  .at-tile.dk .s{color:rgba(255,255,255,.6);}
  .at-tile.lime{background:var(--lime);color:var(--lime-ink);border-color:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;}
  .at-tile.lime .s{color:rgba(14,20,0,.62);}
  .at-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
  .at-tiles:empty{display:none;}
  .at-tile{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:12px 10px;border-radius:18px;background:var(--glass);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border:1px solid var(--glass-border);color:var(--ink);text-align:left;cursor:pointer;}
  .at-tile .c{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;opacity:.55;}
  .at-tile .v{font-family:var(--font-display);font-weight:700;font-size:21px;line-height:1.05;}
  .at-tile .s{font-size:10.5px;color:var(--ink-dim);line-height:1.25;}
  .at-tile .ov{min-width:0;margin-top:4px;padding:4px 8px;font-size:10px;}
  .g-again.ghost{background:transparent;color:var(--ink-dim);border:1px solid var(--glass-border);margin-top:8px;}
  .tk-undo span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tk-undo button{flex:0 0 auto;background:var(--lime);color:var(--lime-ink);border:0;border-radius:99px;padding:7px 12px;font-family:var(--font-body);font-weight:800;font-size:11.5px;line-height:1;cursor:pointer;}

function ruDocWord(n){
  const n1 = n % 10;
  if(n1===1 && n!==11) return 'документ';
  if(n1>=2 && n1<=4 && !(n>=12 && n<=14)) return 'документа';
  return 'документов';
}

// ===== Карусели: карточки блоков сверху, содержимое активной карточки — под ними =====
const CAROUSELS = [];
function refreshCarousels(){ CAROUSELS.forEach(c=>c.update()); }
window.addEventListener('resize', ()=>refreshCarousels());

function plain(html, n){
  const t = String(html).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
  return t.length>n ? t.slice(0,n).replace(/\s+\S*$/,'')+'…' : t;
}

function makeCarousel(host, cfg){
  if(!host) return;
  const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  host.innerHTML = '<div class="cz"><div class="cz-track" tabindex="0" aria-label="'+(cfg.label||'')+'"><i class="cz-sp"></i>'+
    cfg.items.map((it,i)=>'<button class="cz-card'+(it.dashed?' dashed':'')+(i===0?' on':'')+'" data-i="'+i+'" style="--k:'+(i===0?0:1)+'">'+
      (it.tag?'<span class="cz-tag tag rev">'+it.tag+'</span>':'')+
      '<span class="cz-ic">'+(it.iconHtml||ic(it.icon,22))+'</span><span class="cz-t">'+it.title+'</span><span class="cz-s">'+it.sub+'</span>'+(it.peek?'<span class="cz-p">'+it.peek+'</span>':'')+'</button>').join('')+
    '<i class="cz-sp"></i></div><div class="cz-dots">'+cfg.items.map((it,i)=>'<button aria-label="'+it.title+'" data-i="'+i+'"'+(i===0?' class="on"':'')+'></button>').join('')+'</div><div class="cz-list"></div></div>';
  const track = host.querySelector('.cz-track');
  const cards = Array.from(track.querySelectorAll('.cz-card'));
  const dots = Array.from(host.querySelectorAll('.cz-dots button'));
  const list = host.querySelector('.cz-list');
  let cur = -1, raf = 0;

  function fill(i){
    list.innerHTML = cfg.list(i);
    Array.from(list.children).forEach((c,n)=>c.style.setProperty('--n', n));
    if(cfg.bind) cfg.bind(list, i);
  }
  function setList(i, animate){
    if(!animate || reduced){ fill(i); return; }
    list.classList.add('out');
    setTimeout(()=>{ if(cur===i){ fill(i); list.classList.remove('out'); } }, 130);
  }
  function goTo(i){
    const c = cards[Math.max(0,Math.min(cards.length-1,i))];
    c.scrollIntoView({behavior: reduced ? 'auto' : 'smooth', inline:'center', block:'nearest'});
  }
  function update(){
    if(!track.clientWidth) return;
    const cr = track.getBoundingClientRect(), cx = cr.left + cr.width/2;
    let best = 0, bd = 1e9;
    cards.forEach((c,i)=>{
      const r = c.getBoundingClientRect(), d = Math.abs(r.left + r.width/2 - cx);
      c.style.setProperty('--k', Math.min(1, d/r.width).toFixed(3));
      if(d < bd){ bd = d; best = i; }
    });
    if(best !== cur){
      const first = cur === -1;
      cur = best;
      cards.forEach((c,i)=>c.classList.toggle('on', i===cur));
      dots.forEach((d,i)=>d.classList.toggle('on', i===cur));
      setList(cur, !first);
    }
  }
  track.addEventListener('scroll', ()=>{ if(!raf) raf = requestAnimationFrame(()=>{ raf = 0; update(); }); }, {passive:true});
  cards.forEach((c,i)=>c.addEventListener('click', ()=>{ if(i !== cur) goTo(i); }));
  dots.forEach((d,i)=>d.addEventListener('click', ()=>goTo(i)));
  track.addEventListener('keydown', e=>{
    if(e.key==='ArrowRight'){ e.preventDefault(); goTo(cur+1); }
    if(e.key==='ArrowLeft'){ e.preventDefault(); goTo(cur-1); }
  });
  cur = 0; fill(0);
  CAROUSELS.push({update});
}

function openDoc(key){
  const d = DOCS[key];
  if(!d) return;
  const blk = DOC_BLOCKS.find(b=>b.docs.includes(key));
  const ruleRows = String(d.rule).split('<br><br>').reduce((a,par)=>a.concat(czSentences(par)),[]).map(t=>czItem(t,'ok')).join('');
  const riskRows = [].concat(d.risk||[]).reduce((a,r)=>a.concat(czSentences(r)),[]).map(t=>czItem(t,'risk')).join('');
  const hasErr = Array.isArray(d.errors);
  const errRows = hasErr ? (d.errors.length ? d.errors.map(e=>czItem(withRev(e.what),'err',e.who+' · '+e.when)).join('') : czItem('Нарушений по этому документу пока не зафиксировано.','ok')) : '';
  document.getElementById('docModalInner').innerHTML = `
    <div class="dm-top"><button class="dm-back" id="docBack" aria-label="Назад">${ic('<polyline points="15 18 9 12 15 6"/>',20)}</button><div class="dm-cap">Памятка документы</div><span style="width:44px;flex:0 0 auto;"></span></div>
    <div class="dm-hero"><div class="dm-ic">${ic(d.icon,32)}</div><div class="dm-title">${d.title}</div><div class="dm-sub">${blk ? blk.title : d.subtitle}</div></div>
    <div class="dm-sheet"><div class="cz-stack">
      ${czLabel('ok','Правило работы')}${ruleRows}
      ${czLabel('bad','Нельзя')}${d.bad.map(b=>czItem(withRev(b),'bad')).join('')}
      ${d.risk ? czLabel('risk','Риск')+riskRows : ''}
      ${hasErr ? czLabel('err','Ошибки, которые уже были — недопустимо')+errRows : ''}
    </div></div>
  `;
  document.getElementById('docBack').addEventListener('click', closeDoc);
  const modal = document.getElementById('docModal');
  modal.classList.add('open');
  modal.scrollTop = 0;
}

function closeDoc(){
  document.getElementById('docModal').classList.remove('open');
}

// ===== Задачи =====
// Источник — Яндекс Трекер, очередь PR-VO, живьём (решение 22.09.2026: Трекер — единственное место учёта,
// приложение — витрина, а не вторая копия). Показываются только задачи в статусе «В работе».
// Главный экран — сегодня: неделя полосой, список выбранного дня, просроченное всегда сверху.
const apiBase = () => (typeof API_URL === 'string' && API_URL) ? API_URL.replace(/\/data$/, '') : '';
const tkEsc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tkDay = d => String(d).slice(8,10)+'.'+String(d).slice(5,7);
const nTask = n => n+' '+(n%10===1 && n%100!==11 ? 'задача' : (n%10>=2 && n%10<=4 && (n%100<10 || n%100>=20)) ? 'задачи' : 'задач');
const TK_WD = ['пн','вт','ср','чт','пт','сб','вс'];
const TRACKER_URL = 'https://tracker.yandex.ru/issues/?query=Queue%3A%20PRVO%20Sort%20By%3A%20key%20DESC';
let TKS = null;      // ответ сервера
let TK_DAY = null;   // выбранный день недели

function tkOpen(url){ if(tg && tg.openLink){ tg.openLink(url); } else { window.open(url, '_blank'); } }
const tkAll = t => [].concat(t.overdue, t.today, t.soon, t.noDue);
function tkWeek(today){
  const d = new Date(today+'T00:00:00Z');
  const mon = new Date(d.getTime() - ((d.getUTCDay()+6)%7)*86400000);
  return Array.from({length:7}, (_,i)=> new Date(mon.getTime()+i*86400000).toISOString().slice(0,10));
}

// Пояснение про статусы: сотрудник закрывает задачу сам, и от статуса зависит срок (решение 22.09.2026).
const TASK_STATUSES = '<div class="cz-note"><div class="cz-cap">Что делать со статусом</div>'+
  '<div class="cz-txt">Свайп вправо — <b>Закрыт</b>, сделал. Свайп влево — <b>Требуется информация</b>: не сделал и есть вопрос, срок встаёт на паузу, пока директор не ответит. Вопрос, заданный днём, директор увидит следующим утром.<br>'+
  'В Трекере рядом с задачей появится ваше имя: статус меняет сервер, а комментарий подписывает вас.<br>'+
  '<b>Открыт</b> — черновик директора, вам такие задачи не приходят. <b>В работе</b> — выданное вам, только эти и показаны здесь.</div></div>';

// Счёт дисциплины: строка-итог в шапке, подробности — шторкой, чтобы экран не тянулся вниз.
function discLine(s){
  if(!s) return '';
  return '<button class="tk-sum" id="tkSum"><span class="s1">в срок <b>'+s.inTime+'</b></span><span class="s2">просрочено <b>'+s.overdue+'</b></span>'+
    '<span class="s3">+'+s.plus+' из '+s.cap+'</span><span class="chv">'+ic('<polyline points="9 6 15 12 9 18"/>',14)+'</span></button>';
}
function discBlock(s){
  if(!s) return '';
  const rows = [
    ['Закрыто в срок', s.inTime + (s.early ? ' (раньше срока — '+s.early+')' : ''), 'ok'],
    ['Закрыто с опозданием', s.late, s.late ? 'bad' : 'ok'],
    ['Сейчас просрочено', s.overdue, s.overdue ? 'bad' : 'ok'],
    ['Закрыто без срока — в счёт не идут', s.noDue, 'risk']
  ];
  return '<div class="cz-fact"><div class="between"><b style="font-size:12.5px;">Плюсов за месяц</b><span class="tag" style="background:var(--lime);color:var(--lime-ink);border-color:transparent;font-weight:800;">+'+s.plus+' из '+s.cap+'</span></div>'+
    '<div class="muted" style="margin-top:6px;">+1 за каждую задачу, закрытую не позже срока, не больше '+s.cap+' плюсов в месяц. Счёт премию не снижает — влияет только на рост.</div></div>'+
    rows.map(r=>czItem(r[0]+': <b>'+r[1]+'</b>', r[2])).join('');
}
// Общая шторка: «тап → подробности → назад». Так экран остаётся коротким, а детали никуда не деваются.
function openSheet({cap, title, sub, icon, body, after}){
  document.getElementById('docModalInner').innerHTML =
    '<div class="dm-top"><button class="dm-back" id="docBack" aria-label="Назад">'+ic('<polyline points="15 18 9 12 15 6"/>',20)+'</button><div class="dm-cap">'+cap+'</div><span style="width:44px;flex:0 0 auto;"></span></div>'+
    '<div class="dm-hero"><div class="dm-ic">'+ic(icon || IC.chart,32)+'</div><div class="dm-title">'+title+'</div>'+(sub ? '<div class="dm-sub">'+sub+'</div>' : '')+'</div>'+
    '<div class="dm-sheet"><div class="cz-stack" id="dmBody">'+body+'</div></div>';
  document.getElementById('docBack').addEventListener('click', closeDoc);
  const m = document.getElementById('docModal'); m.classList.add('open'); m.scrollTop = 0;
  if(after) after(document.getElementById('dmBody'));
}
function tkSheet(){
  openSheet({cap:'Третий счёт', title:'Задачи и сроки', icon:IC.cal,
    sub:'Срок и факт выполнения'+(TKS && TKS.period ? ' · '+TKS.period.replace('-','.') : ''),
    body: discBlock(TKS && TKS.score)+TASK_STATUSES});
}

function tkCard(t, canAct){
  return '<div class="tk-sw'+(canAct ? '' : ' flat')+'" data-key="'+tkEsc(t.key)+'">'+
    (canAct ? '<div class="tk-bg"><span class="l">Выполнено</span><span class="r">Нужна информация</span></div>' : '')+
    '<div class="tk-card"><div class="tk-t">'+tkEsc(t.title)+'</div>'+
    '<div class="tk-meta"><span class="tag">'+tkEsc(t.key)+'</span><span class="due'+(t.due && TKS && t.due < TKS.today ? ' late' : '')+'">'+(t.due ? 'срок '+tkDay(t.due) : 'без срока')+'</span>'+
    '<button class="tk-go" data-url="'+tkEsc(t.url)+'" aria-label="Открыть в Трекере">'+ic('<path d="M14 3h7v7"/><path d="M10 14 21 3"/><path d="M21 14v7H3V3h7"/>',14)+'</button></div></div></div>';
}
const tkEmpty = t => '<div class="cz-fact"><b style="font-size:12.5px;">'+t+'</b></div>';

function renderTasksBody(){
  const t = TKS.tasks, today = TKS.today;
  const week = tkWeek(today);
  const byDay = {};
  tkAll(t).forEach(x=>{ if(x.due){ (byDay[x.due] = byDay[x.due] || []).push(x); } });
  const strip = '<div class="wk">'+week.map(d=>{
    const n = (byDay[d] || []).length;
    const late = d < today && n;
    return '<button class="wk-d'+(d===TK_DAY ? ' on' : '')+(d===today ? ' now' : '')+'" data-d="'+d+'">'+
      '<span class="wd">'+TK_WD[week.indexOf(d)]+'</span><span class="dn">'+Number(d.slice(8,10))+'</span>'+
      '<i class="'+(n ? (late ? 'late' : 'has') : '')+'"></i></button>';
  }).join('')+'</div>';

  const dayList = (byDay[TK_DAY] || []);
  const dayName = TK_DAY === today ? 'На сегодня' : 'На '+tkDay(TK_DAY);
  const overdue = t.overdue.filter(x=>x.due !== TK_DAY);
  const sec = (lab, html, bad) => '<div class="tk-sec"><div class="tk-lab'+(bad ? ' bad' : '')+'">'+lab+'</div>'+html+'</div>';
  const parts = [];
  // Просроченное показываем всегда, даже когда открыт другой день: прятать его переключением дня нельзя.
  if(overdue.length) parts.push(sec('Осталось с прошлых дней — '+nTask(overdue.length), overdue.map(x=>tkCard(x,true)).join(''), true));
  parts.push(sec(dayName+' — '+(dayList.length ? nTask(dayList.length) : 'пусто'),
    dayList.length ? dayList.map(x=>tkCard(x,true)).join('') : tkEmpty(TK_DAY === today ? 'На сегодня задач нет.' : 'На этот день задач нет.')));
  if(t.noDue.length) parts.push(sec('Без срока — '+nTask(t.noDue.length), t.noDue.map(x=>tkCard(x,true)).join('')));
  return strip+parts.join('');
}

function renderTasksScreen(){
  const el = document.getElementById('s-tasks');
  el.innerHTML = CZ_HEAD('Задачи','Трекер PR-VO · статус «В работе»')+discLine(TKS.score)+
    '<div id="tkBody">'+renderTasksBody()+'</div>'+
    '<div class="pill lime" id="openTracker" style="justify-content:center;width:100%;text-align:center;margin:12px 0 10px;cursor:pointer;">Открыть в Трекере</div>';
  bindTasks();
}

function bindTasks(){
  const sum = document.getElementById('tkSum');
  if(sum) sum.addEventListener('click', tkSheet);
  const tr = document.getElementById('openTracker');
  if(tr) tr.addEventListener('click', ()=>tkOpen(TRACKER_URL));
  document.querySelectorAll('#tkBody .wk-d').forEach(b=>b.addEventListener('click', ()=>{
    TK_DAY = b.dataset.d;
    document.getElementById('tkBody').innerHTML = renderTasksBody();
    bindTasks();
  }));
  document.querySelectorAll('#tkBody .tk-go').forEach(b=>b.addEventListener('click', e=>{ e.stopPropagation(); tkOpen(b.dataset.url); }));
  document.querySelectorAll('#tkBody .tk-sw:not(.flat)').forEach(bindSwipe);
}

// Свайп по карточке: вправо — «Выполнено», влево — «Нужна информация».
// Запрос уходит не сразу: пять секунд внизу висит «Отменить». Так необратимое действие
// отменяется до того, как случится, и не приходится откатывать статус в Трекере.
function tkTrim(){
  document.querySelectorAll('#tkBody .tk-sec').forEach(sec=>{
    const cards = [...sec.querySelectorAll('.tk-sw')];
    const alive = !cards.length || cards.some(c=>c.style.display !== 'none');
    sec.style.display = alive ? '' : 'none';
  });
}
function bindSwipe(el){
  const card = el.querySelector('.tk-card');
  let x0 = null, dx = 0;
  const done = () => { card.style.transition = ''; el.classList.remove('to-done','to-info'); };
  el.addEventListener('pointerdown', e=>{ x0 = e.clientX; dx = 0; card.style.transition = 'none'; try{ el.setPointerCapture(e.pointerId); }catch(err){} });
  el.addEventListener('pointermove', e=>{
    if(x0 === null) return;
    dx = e.clientX - x0;
    card.style.transform = 'translateX('+dx+'px)';
    el.classList.toggle('to-done', dx > 12);
    el.classList.toggle('to-info', dx < -12);
  });
  const end = ()=>{
    if(x0 === null) return;
    const th = Math.min(120, el.offsetWidth * 0.3);
    const act = dx > th ? 'done' : dx < -th ? 'needinfo' : null;
    x0 = null; done();
    if(!act){ card.style.transform = ''; return; }
    card.style.transform = 'translateX('+(act === 'done' ? '110%' : '-110%')+')';
    try{ tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred('light'); }catch(err){}
    setTimeout(()=>{ el.style.display = 'none'; tkTrim(); }, 180);
    tkPending(el, act);
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}

let TK_TIMER = null;
function tkPending(el, action){
  const key = el.dataset.key;
  const bar = document.getElementById('tkUndo');
  const label = action === 'done' ? 'Закрыто' : 'Отмечено «нужна информация»';
  bar.innerHTML = '<span>'+label+' · '+tkEsc(key)+'</span><button type="button" id="tkUndoBtn">Отменить</button>';
  bar.classList.add('on');
  clearTimeout(TK_TIMER);
  const restore = ()=>{ bar.classList.remove('on'); el.style.display = ''; el.querySelector('.tk-card').style.transform = ''; tkTrim(); };
  document.getElementById('tkUndoBtn').addEventListener('click', ()=>{ clearTimeout(TK_TIMER); restore(); });
  TK_TIMER = setTimeout(async ()=>{
    bar.classList.remove('on');
    try{
      const r = await fetch(apiBase()+'/tasks/action', {method:'POST', headers:{Authorization:'tma '+((tg && tg.initData) || ''), 'Content-Type':'application/json'}, body: JSON.stringify({key, action})});
      if(!r.ok) throw new Error('http '+r.status);
      await loadTasks(true);
    }catch(e){
      restore();
      bar.innerHTML = '<span>Трекер не принял изменение. Задача на месте.</span>';
      bar.classList.add('on');
      setTimeout(()=>bar.classList.remove('on'), 4000);
    }
  }, 5000);
}

async function loadTasks(silent){
  const url = apiBase();
  let data = null;
  if(url && tg && tg.initData){
    try{
      const r = await fetch(url+'/tasks', {headers:{Authorization:'tma '+tg.initData}});
      if(r.ok) data = await r.json();
    }catch(e){}
  }
  if(!data){
    if(silent) return;
    const el = document.getElementById('s-tasks');
    el.innerHTML = CZ_HEAD('Задачи','Трекер PR-VO')+
      '<div class="attn col"><div class="eb">Задачи не загружены</div><p>Трекер сейчас недоступен. Это не значит «задач нет» — откройте очередь PR-VO в Трекере.</p></div>'+
      TASK_STATUSES+'<div class="pill lime" id="openTracker" style="justify-content:center;width:100%;text-align:center;margin:12px 0 10px;cursor:pointer;">Открыть в Трекере</div>';
    document.getElementById('openTracker').addEventListener('click', ()=>tkOpen(TRACKER_URL));
    return;
  }
  TKS = data;
  if(data.score) window.DISCIPLINE = data.score;
  if(!TK_DAY || !tkWeek(data.today).includes(TK_DAY)) TK_DAY = data.today;
  if(data.byEmployee) renderTasksDirector(); else renderTasksScreen();
}

    },

  });
  document.getElementById('openTracker').addEventListener('click', ()=>tkOpen(TRACKER_URL));

  const el = document.getElementById('s-tasks');

// ===== Мой рост =====
// Личные баллы живут на экране «Изучать» (два счёта, премия, игра). Здесь — правила, по которым они считаются:
// недельные цифры убраны, зона считается за календарный месяц (редакция 22.09.2026).
function renderGrowth(u){

  // Карточки счетов («Ошибки», «Премия», «Рост», аттестация) вставляет сюда же atMountScore — сразу после заголовка.
  const where = u.key === 'director'

    : '';

    dots.forEach((d,n)=>d.classList.toggle('on', n === i));
  }, {passive:true});
  dots.forEach((d,i)=>d.addEventListener('click', ()=>track.scrollTo({left:i*track.clientWidth, behavior:'smooth'})));
